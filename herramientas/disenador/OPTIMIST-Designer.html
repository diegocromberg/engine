// ---------- validación
function validarCns(m) {
  const errores = [], avisos = [];
  if (!ID_Q.test(m.consulta)) errores.push('nombre de la consulta inválido: ' + m.consulta);
  if (!m.trn.trim()) errores.push('falta la TRN de la consulta');
  const vistas = new Set();
  for (const c of m.columnas) {
    if (!ID_Q.test(c)) errores.push('columna inválida: ' + c);
    if (vistas.has(c.toLowerCase())) errores.push('columna repetida: ' + c);
    vistas.add(c.toLowerCase());
    if (origenQ(m, c) === '?') avisos.push(c + ' no es un campo de la TRN ' + m.trn + ' ni una columna SQL (no se va a ver)');
  }
  for (const [c, a] of Object.entries(m.anchos)) if (!/^\d+(\.\d+)?(px|em|%)$/.test(String(a).trim())) errores.push('ancho de ' + c + ' inválido: ' + a + ' (ej. 80px)');
  for (const [c, p] of Object.entries(m.procesos)) if (!/^\d+(\s*,\s*\d+)*$/.test(String(p).trim())) errores.push('procesos de ' + c + ': números separados por coma');
  const nsql = new Set();
  for (const s of m.columnasSql) {
    if (!ID_Q.test(s.nombre)) errores.push('columna SQL con nombre inválido: ' + (s.nombre || '(vacío)'));
    if (nsql.has(s.nombre.toLowerCase())) errores.push('columna SQL repetida: ' + s.nombre);
    nsql.add(s.nombre.toLowerCase());
    if (!s.sql.trim()) errores.push('columna SQL ' + s.nombre + ': falta la sentencia');
    if (s.tipo && !['texto', 'numero', 'fecha'].includes(s.tipo)) errores.push('columna SQL ' + s.nombre + ': tipo texto, numero o fecha');
    if (s.sql.trim() && !m.join.trim() && /\bx\w*\./.test(s.sql)) avisos.push('columna SQL ' + s.nombre + ': usa tablas del join y la consulta no tiene join');
  }
  for (const r of m.recibe) {
    if (!ID_Q.test(r.nombre)) errores.push('recibe: nombre inválido ' + (r.nombre || '(vacío)'));

  }
  for (const [c, e] of Object.entries(m.enlaces)) {
    if (e.cns) continue;   // V66l: vínculo a otra consulta (con sus parámetros)
    if (!e.clave.trim()) errores.push('vínculo de ' + c + ': falta la clave');
    if (!e.trn.length) errores.push('vínculo de ' + c + ': falta al menos una TRN');
    e.trn.forEach((x, i) => { if (!x.trn.trim()) errores.push('vínculo de ' + c + ', caso ' + (i + 1) + ': falta la TRN'); });
    if (!m.columnas.includes(c)) avisos.push('el vínculo de ' + c + ' no se usa: no es una columna');
  }
  for (const p of m.parametros) {
    if (!ID_Q.test(p.nombre)) errores.push('parámetro con nombre inválido: ' + (p.nombre || '(vacío)'));
    if (p.valores.trim() && p.valores.split(';').some(x => x.trim() && !x.includes('='))) errores.push('parámetro ' + p.nombre + ': los valores van como 1=Texto; 2=Texto');
  }
  if (m.subtitulo && !m.subtitulo.sql.trim()) errores.push('el subtítulo no tiene la sentencia SQL');
  if (totalQ(m) > ANCHO_UTIL_Q) avisos.push('la grilla mide ' + totalQ(m) + ' px y el ancho útil es ' + ANCHO_UTIL_Q + ' px: va a tener barra horizontal');
  return { errores, avisos };
}

/** Un escalar de YAML, sin comillas si no hacen falta (también dentro de [] y {}). */

  return plano ? s : JSON.stringify(s);
}

    if (!s) { p.append(h('div', { class: 'ayuda' }, 'La consulta no tiene subtítulo.'), boton('+ Subtítulo', () => cambiarQ(mm => { mm.subtitulo = { sql: '', parametros: [] }; }))); return; }
    p.append(textoQ('SQL', s.sql, x => cambiarQ(mm => { mm.subtitulo.sql = x.trim(); }), { area: true, filas: 6, ayuda: 'Un SELECT de una columna; cada ? es un parámetro, en orden.' }),
      textoQ('Parámetros', s.parametros.join(', '), x => cambiarQ(mm => { mm.subtitulo.parametros = x.split(',').map(y => y.trim()).filter(Boolean); }), { ph: 'ej. AsientosId', ayuda: 'Los nombres de "Recibe", separados por coma.' }),
      boton('Borrar subtítulo', () => cambiarQ(mm => { mm.subtitulo = null; }), { peligro: true }));
  }
}

// ------------------------------------------------------------------ arranque
$('#bAbrir').addEventListener('click', abrirCarpeta);
// V49i: "Abrir archivo" abre el YAML con permiso para grabarlo en el MISMO lugar (Chrome / Edge); si el navegador no lo permite,
// queda el modo viejo (se descarga al guardar)
$('#bArchivo').addEventListener('click', async () => {
  if (!await confirmarPerder()) return;
  if (!window.showOpenFilePicker) { $('#inArchivo').click(); return; }
  let fh;
  try { [fh] = await showOpenFilePicker({ id: 'optimist-archivo', types: [{ description: 'YAML de OPTIMIST', accept: { 'text/yaml': ['.yaml', '.yml'] } }] }); }
  catch (e) { return; }   // canceló
  const tx = await (await fh.getFile()).text();
  if (/^panel\s*:/m.test(tx)) { cargarPanel(fh.name, tx, fh); if (P) P.suelto = true; }
  else if (esConsulta(tx)) { cargarCns(fh.name, tx, fh); if (Q) Q.suelto = true; }   // V66k4
  else if (esImpresion(tx)) { cargarImp(fh.name, tx, fh); if (R) R.suelto = true; }   // V64
  else { cargar(fh.name, tx, fh); if (A) A.suelto = true; }
});
/** V49i: antes de grabar, el permiso de escritura del archivo (Chrome lo pregunta la primera vez). */
async function permisoEscritura(handle) {
  try {
    if (!handle.queryPermission) return true;
    if (await handle.queryPermission({ mode: 'readwrite' }) === 'granted') return true;
    return await handle.requestPermission({ mode: 'readwrite' }) === 'granted';
  } catch { return false; }
}
$('#inArchivo').addEventListener('change', async e => {
  const f = e.target.files[0];
  if (f) { const tx = await f.text(); if (/^panel\s*:/m.test(tx)) cargarPanel(f.name, tx, null); else if (esConsulta(tx)) cargarCns(f.name, tx, null); else if (esImpresion(tx)) cargarImp(f.name, tx, null); else cargar(f.name, tx, null); }   // V49h: un web panel
  e.target.value = '';
});
$('#lista').addEventListener('change', e => { const v = e.target.value; if (v === '') return; if (v.startsWith('c')) abrirCns(+v.slice(1)); else if (v.startsWith('i')) abrirImp(+v.slice(1)); else if (v.startsWith('w')) abrirWbp(+v.slice(1)); else abrirTrn(+v); });
$('#bGuardar').addEventListener('click', guardar);
$('#bDeshacer').addEventListener('click', deshacer);
$('#bClases').addEventListener('click', () => abrirClases({}));
$('#bRehacer').addEventListener('click', rehacer);
document.addEventListener('keydown', e => {
  if (!(e.ctrlKey || e.metaKey)) return;
  const k = e.key.toLowerCase();
  if (k === 's') { e.preventDefault(); guardar(); }
  else if (k === 'z' && !e.target.matches('input')) { e.preventDefault(); e.shiftKey ? rehacer() : deshacer(); }
  else if (k === 'y' && !e.target.matches('input')) { e.preventDefault(); rehacer(); }
});
window.addEventListener('beforeunload', e => { if (sucio()) { e.preventDefault(); e.returnValue = ''; } });

$('#centro').append(h('div', { id: 'bienvenida' },
  h('h2', null, 'OPTIMIST Designer'),
  h('ol', null,
    h('li', null, 'Tocá ', h('b', null, 'Abrir carpeta'), ' y elegí la carpeta del proyecto (o directamente ', h('code', null, 'src/main/resources/trn'), ').'),
    h('li', null, 'Elegí una TRN, un web panel, una impresión o una consulta en la lista de arriba.'),
    h('li', null, 'Arrastrá los campos para acomodarlos; botón derecho sobre un campo para visible, solo lectura, obligatorio, negrita…'),
    h('li', null, 'A la derecha, todas las propiedades del elemento elegido (como el panel de WorkWithPlus).'),
    h('li', null, h('b', null, 'Guardar'), ' (Ctrl+S) reescribe solo lo que cambiaste y deja una copia ', h('code', null, '.bak'), ' la primera vez.')),
  h('p', { style: 'color:var(--suave)' }, 'Funciona en Chrome o Edge. Después de guardar, refrescá OPTIMIST para ver el cambio y subilo a GitHub como siempre.')));
recordarCarpeta();
pintarBarra();
