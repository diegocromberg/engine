// ------------------------------------------------------------------ V49h: web panels (wbp/*.yaml)
/* Un web panel se edita con su propio modelo (P), aparte de las TRN (A):
   variables (con sus propiedades), renglones de la pantalla, lupas, botones, título, parm, variables internas y eventos.
   Guardar reescribe SOLO las secciones que cambiaron; el resto (comentarios, formato) queda igual. */
let WBP_DIR = null;       // carpeta wbp (al lado de trn)
let wbps = [];            // [{nombre, handle}]
let P = null;             // panel abierto: {nombre, handle, texto, m, orig, hist, fut, bak}
let vistaP = 'form';      // 'form' | 'eventos' | 'internas'

const VAR_ORDEN = ['nombre', 'dominio', 'etiqueta'];
const VAR_FLAGS = ['soloLectura', 'oculto', 'obligatorio'];

function modelarPanel(texto) {
  const doc = YAML.parseDocument(texto);
  if (doc.errors.length) throw new Error('El YAML tiene errores: ' + doc.errors[0].message.split('\n')[0]);
  const js = doc.toJS() || {};
  if (!js.panel) throw new Error('no es un web panel (falta "panel:")');
  const lista = v => Array.isArray(v) ? v : [];
  return {
    panel: String(js.panel),
    titulo: js.titulo == null ? '' : String(js.titulo),
    parm: lista(js.parm).map(String),
    variables: lista(js.variables).filter(v => v && typeof v === 'object').map(v => Object.assign({}, v, { nombre: String(v.nombre) })),
    // V66t: una sección ({seccion: Título}) es un renglón con un solo elemento '§Título'
    pantalla: lista(js.pantalla).map(r => Array.isArray(r) ? r.map(String)
      : (r && typeof r === 'object' && r.seccion != null) ? [SECC + String(r.seccion)] : [String(r)]),
    botones: lista(js.botones).filter(b => b && typeof b === 'object').map(b => ({ titulo: String(b.titulo ?? ''), evento: String(b.evento ?? '') })),
    prompts: lista(js.prompts).filter(p => p && typeof p === 'object').map(p => Object.assign({}, p)),
    internas: js.internas == null ? '' : String(js.internas),
    eventos: js.eventos == null ? '' : String(js.eventos),
    dominios: js.dominios && typeof js.dominios === 'object' ? js.dominios : {}
  };
}

function cargarPanel(nombre, texto, handle) {
  let m;
  try { m = modelarPanel(texto); } catch (e) { aviso(nombre + ': ' + e.message, true); return; }
  A = null; R = null; Q = null;
  P = { nombre, handle, texto, m, orig: JSON.parse(JSON.stringify(m)), hist: [], fut: [], bak: false };
  sel = { tipo: 'wpanel' }; vistaP = 'form';
  pintar();
}

async function abrirWbp(i) {
  if (!await confirmarPerder()) return;
  const a = wbps[i]; if (!a) return;
  cargarPanel(a.nombre, await (await a.handle.getFile()).text(), a.handle);
  if (P) P.dirBak = a.dir;   // la .bak va al lado del archivo
}

function cambiarP(fn) {
  P.hist.push(JSON.stringify(P.m));
  if (P.hist.length > 200) P.hist.shift();
  P.fut = [];
  fn(P.m);
  pintar();
}

const varP = n => P.m.variables.find(v => v.nombre.toLowerCase() === String(n).toLowerCase());
const SECC = '§';   // V66t: renglón de sección (título que separa grupos de variables, como las de GeneXus)
const esSecc = r => Array.isArray(r) && r.length === 1 && String(r[0]).startsWith(SECC);
const enPantalla = n => P.m.pantalla.some(r => !esSecc(r) && r.some(x => x.toLowerCase() === n.toLowerCase()));
function sacarDePantalla(m, n) {
  m.pantalla = m.pantalla.map(r => r.filter(x => x.toLowerCase() !== n.toLowerCase())).filter(r => r.length);
}

function validarPanel(m) {
  const err = [];
  const nombres = new Set();
  for (const v of m.variables) {
    if (!/^[A-Za-z_][A-Za-z0-9_]*$/.test(v.nombre)) err.push('nombre de variable inválido: ' + v.nombre);
    if (nombres.has(v.nombre.toLowerCase())) err.push('variable repetida: ' + v.nombre);
    nombres.add(v.nombre.toLowerCase());
    if (!v.dominio) err.push(v.nombre + ': falta el dominio');
  }
  for (const r of m.pantalla) for (const x of r) if (!esSecc(r) && !nombres.has(x.toLowerCase())) err.push('la pantalla usa ' + x + ', que no es una variable');
  for (const b of m.botones) if (!b.titulo || !b.evento) err.push('botón sin título o sin evento');
  for (const p of m.prompts) {
    if (!p.variable || !nombres.has(String(p.variable).toLowerCase())) err.push('lupa de una variable que no está: ' + p.variable);
    if (!p.tabla) err.push('lupa de ' + p.variable + ': falta la tabla');
    if (!p.devuelve || !Object.keys(p.devuelve).length) err.push('lupa de ' + p.variable + ': falta qué devuelve');
  }
  return err;
}

// ---------- texto: solo se reemplazan las secciones que cambiaron (el resto del archivo queda letra por letra igual)
function textoPanel() {
  const m = P.m, o = P.orig;
  const ordenarVar = v => {
    const r = {};
    for (const k of VAR_ORDEN) if (v[k] != null && v[k] !== '') r[k] = v[k];
    for (const [k, x] of Object.entries(v)) if (!VAR_ORDEN.includes(k) && x != null && x !== '' && x !== false) r[k] = x;
    return r;
  };
  // el texto de una sección sola ("clave: ..."), con el mismo formato que usa el resto del archivo
  const seccion = (k, armar) => {
    const d = new YAML.Document({});
    d.set(k, armar(d));
    return d.toString({ lineWidth: 0, flowCollectionPadding: false }).replace(/\n+$/, '');
  };
  const flujo = (d, v) => { const n = d.createNode(v); if (n && n.items) n.flow = true; return n; };
  const cambios = [];   // [clave, texto | null (borrar)]
  if (m.titulo !== o.titulo) cambios.push(['titulo', seccion('titulo', () => m.titulo)]);
  if (!igual(m.parm, o.parm)) cambios.push(['parm', seccion('parm', d => flujo(d, m.parm))]);
  if (!igual(m.variables, o.variables)) cambios.push(['variables', seccion('variables', d => {
    const s = d.createNode([]); for (const v of m.variables) s.items.push(flujo(d, ordenarVar(v))); return s; })]);
  if (!igual(m.pantalla, o.pantalla)) cambios.push(['pantalla', seccion('pantalla', d => {
    const s = d.createNode([]);
    for (const r of m.pantalla) {
      if (esSecc(r)) { const n = d.createNode({ seccion: r[0].slice(1) }); n.flow = true; s.items.push(n); }   // V66t
      else s.items.push(flujo(d, r));
    }
    return s; })]);
  if (!igual(m.prompts, o.prompts)) cambios.push(['prompts', !m.prompts.length ? null : seccion('prompts', d => {
    const s = d.createNode([]);
    for (const p0 of m.prompts) {
      const p = {};   // en el orden de siempre y sin lo vacío
      for (const k of ['variable', 'tabla', 'codigo', 'descripcion', 'donde', 'devuelve']) if (p0[k] != null && p0[k] !== '') p[k] = p0[k];
      for (const [k, x] of Object.entries(p0)) if (!(k in p) && x != null && x !== '') p[k] = x;
      const n = d.createNode(p); for (const it of n.items) if (it.value && it.value.items) it.value.flow = true; s.items.push(n); }
    return s; })]);
  if (!igual(m.botones, o.botones)) cambios.push(['botones', seccion('botones', d => {
    const s = d.createNode([]); for (const b of m.botones) s.items.push(flujo(d, { titulo: b.titulo, evento: b.evento })); return s; })]);
  const bloque = t => d => { const n = d.createNode(t.endsWith('\n') ? t : t + '\n'); n.type = 'BLOCK_LITERAL'; return n; };
  if (m.internas !== o.internas) cambios.push(['internas', seccion('internas', bloque(m.internas))]);
  if (m.eventos !== o.eventos) cambios.push(['eventos', seccion('eventos', bloque(m.eventos))]);

  let txt = P.texto;
  const ubicar = (texto, k) => {   // [desde, hasta) de "k: ..." en el texto (sin el salto final)
    const doc = YAML.parseDocument(texto);
    const par = doc.contents.items.find(x => x.key && x.key.value === k);
    if (!par) return null;
    let hasta = par.value ? par.value.range[1] : par.key.range[1];
    while (hasta > 0 && texto[hasta - 1] === '\n') hasta--;
    return [par.key.range[0], hasta];
  };
  for (const [k, nuevo] of cambios) {
    const r = ubicar(txt, k);
    if (r) {
      if (nuevo == null) { let h2 = r[1]; if (txt[h2] === '\n') h2++; txt = txt.slice(0, r[0]) + txt.slice(h2); }
      else txt = txt.slice(0, r[0]) + nuevo + txt.slice(r[1]);
    } else if (nuevo != null) {   // sección nueva (ej. la primera lupa): después de la pantalla
      const ant = ubicar(txt, k === 'prompts' ? 'pantalla' : 'variables') || [0, txt.length];
      txt = txt.slice(0, ant[1]) + '\n' + nuevo + txt.slice(ant[1]);
    }
  }
  return txt;
}

async function guardarPanel() {
  if (!P || !sucio()) return;
  const errs = validarPanel(P.m);
  if (errs.length) { aviso('No se guardó: ' + errs.join(' · '), true); return; }

  try {
    nuevo = textoPanel();
    const r = modelarPanel(nuevo);
    const cmp = x => JSON.stringify({ t: x.titulo, p: x.parm, v: x.variables, s: x.pantalla, b: x.botones, l: x.prompts,
      i: x.internas.replace(/\n+$/, ''), e: x.eventos.replace(/\n+$/, '') });
    if (cmp(r) !== cmp(P.m)) throw new Error('el archivo generado no coincide con el diseño');
  } catch (e) { aviso('No se guardó (' + e.message + '). Avisale a Claude con el nombre del panel.', true); return; }

    if (P.handle && P.handle.createWritable) {
      if (!await permisoEscritura(P.handle)) { aviso('No se guardó: el navegador no dio permiso para grabar ' + P.nombre, true); return; }
      const dirBak = P.dirBak || WBP_DIR;
      if (!P.bak && dirBak && !P.suelto) {
        const b = await dirBak.getFileHandle(P.nombre + '.bak', { create: true });

      }
      const w = await P.handle.createWritable(); await w.write(nuevo); await w.close();

      const url = URL.createObjectURL(new Blob([nuevo], { type: 'text/yaml' }));
      const a = h('a', { href: url, download: P.nombre }); document.body.append(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 5000);
      aviso('Se descargó ' + P.nombre + ': copialo sobre el original en src/main/resources/wbp');
    }
  } catch (e) { aviso('No se pudo guardar: ' + e.message, true); return; }
  const hist = P.hist, fut = P.fut, s = sel, bak = P.bak, vp = vistaP, suelto = P.suelto, db = P.dirBak;
  cargarPanel(P.nombre, nuevo, P.handle);
  P.hist = hist; P.fut = fut; P.bak = bak; P.suelto = suelto; P.dirBak = db; sel = s; vistaP = vp; pintar();
}

function editorCodigo(k) {
  const ta = h('textarea', { class: 'codigo', spellcheck: 'false' });
  ta.value = P.m[k];
  ta.addEventListener('keydown', e => {
    if (e.key === 'Tab') {   // tabulador dentro del código (como en GeneXus)
      e.preventDefault();
      const s = ta.selectionStart, f = ta.selectionEnd;
      ta.value = ta.value.slice(0, s) + '\t' + ta.value.slice(f);
      ta.selectionStart = ta.selectionEnd = s + 1;
    }
  });
  // se aplica sin volver a dibujar la pantalla (si no, el clic que sacó el foco, ej. en otra pestaña, se perdía)
  ta.addEventListener('change', () => {
    if (ta.value === P.m[k]) return;
    P.hist.push(JSON.stringify(P.m)); if (P.hist.length > 200) P.hist.shift(); P.fut = [];
    P.m[k] = ta.value;
    pintarBarra(); pintarArbolP();
  });
  const ayuda = k === 'eventos'
    ? 'Código GeneXus de los eventos (Event Start, Event Enter, Event \'DoAlgo\', Event &Variable.IsValid, Sub ...). Se aplica al salir del cuadro.'
    : 'Variables que usan los eventos y no se ven en la pantalla: &Nombre Tipo (ej. &Importe Numeric(14.2)). Se aplica al salir del cuadro.';
  return h('div', { class: 'form' }, h('div', { class: 'coment' }, ayuda), ta);
}

/** E2: web panel como las TRN (V66o): en cada columna los literales con el ancho del más largo y las celdas del mismo ancho,
 *  así los campos quedan uno debajo del otro. */
function alinearPanelP(form) {
  if (!form.isConnected) return;
  const celdas = [...form.querySelectorAll('.renglon-w > .celda[data-col]')];
  const maxEt = {}, maxCel = {};
  for (const c of celdas) { const et = c.querySelector(':scope > .et'); if (et) { et.style.flex = 'none'; et.style.width = 'auto'; maxEt[c.dataset.col] = Math.max(maxEt[c.dataset.col] || 0, Math.ceil(et.getBoundingClientRect().width)); } }
  for (const c of celdas) { const et = c.querySelector(':scope > .et'); if (et) et.style.width = (maxEt[c.dataset.col] + 1) + 'px'; }
  for (const c of celdas) { c.style.flex = 'none'; c.style.width = 'auto'; maxCel[c.dataset.col] = Math.max(maxCel[c.dataset.col] || 0, Math.ceil(c.getBoundingClientRect().width)); }
  for (const c of celdas) c.style.width = maxCel[c.dataset.col] + 'px';
}
function celdaVar(n, fila, col) {
  const v = varP(n);
  const cl = 'celda' + (v && v.soloLectura ? ' lectura' : '') + (v && v.oculto ? ' oculto' : '') + (!v ? ' error' : '')
    + (esSel({ tipo: 'wvar', nombre: n }) ? ' sel' : '');
  const lupa = P.m.prompts.some(p => String(p.variable).toLowerCase() === n.toLowerCase());
  const d = v ? dominio(v.dominio) : null;
  const et = h('span', { class: 'et', style: v && v.estilo && v.estilo.negrita ? 'font-weight:700' : '' }, v ? (v.etiqueta || n) : n + ' (no existe)');
  const ctl = h('span', { class: 'ctl', style: 'max-width:' + (v ? anchoGrilla(v) : '120px') }, d && d.valores ? '▾ ' + n : n);
  const el = h('div', { class: cl, title: n + (v ? ' · ' + v.dominio : '') }, et, ctl, lupa ? h('span', { class: 'marcas' }, '🔍') : null);
  el.addEventListener('click', ev => { ev.stopPropagation(); seleccionar({ tipo: 'wvar', nombre: n }); });
  el.addEventListener('contextmenu', ev => menuVarP(ev, n));
  arrastrable(el, { tipo: 'wvar', nombre: n });
  destino(el, d2 => d2.tipo === 'wvar' && d2.nombre !== n, d2 => moverVarP(d2.nombre, fila, col));
  return el;
}

function moverVarP(nombre, fila, col) {   // la deja antes de [fila][col] (col = largo del renglón: al final)
  cambiarP(m => {
    let f = fila, c = col;
    m.pantalla.forEach((r, i) => { const k = r.findIndex(x => x.toLowerCase() === nombre.toLowerCase()); if (k >= 0) { r.splice(k, 1); if (i === f && k < c) c--; } });
    if (f >= m.pantalla.length) m.pantalla.push([]);
    if (esSecc(m.pantalla[f])) { m.pantalla.splice(f + 1, 0, []); f++; c = 0; }   // V66t: sobre una sección: renglón nuevo debajo
    m.pantalla[f].splice(Math.max(0, c), 0, nombre);
    const antes = m.pantalla.length;
    m.pantalla = m.pantalla.filter(r => r.length);
    if (m.pantalla.length < antes && sel && sel.tipo === 'wfila') sel = null;
  });
}

function pintarFormP() {

      const sec = h('div', { class: 'renglon-d renglon-w' + (esSel({ tipo: 'wfila', idx: i }) ? ' sel' : ''),

    style: esSel({ tipo: 'wboton', idx: i }) ? 'outline:2px solid #e0b400' : '', onclick: () => seleccionar({ tipo: 'wboton', idx: i }) }, b.titulo)));
  bs.append(h('button', { class: 'chico', onclick: () => { cambiarP(mm => mm.botones.push({ titulo: 'Nuevo', evento: "'DoNuevo'" })); sel = { tipo: 'wboton', idx: P.m.botones.length - 1 }; pintar(); } }, '+ Botón'));
  form.append(bs);
  // sin ubicar + papelera
  const sueltas = m.variables.filter(v => !enPantalla(v.nombre));
  const pal = h('div', { class: 'paleta' }, h('h4', null, 'Variables fuera de la pantalla (arrastralas a un renglón)'));
  const chips = h('div', { class: 'chips' });
  for (const v of sueltas) {
    const ch = h('span', { class: 'chip' + (v.oculto ? ' oculto' : '') + (esSel({ tipo: 'wvar', nombre: v.nombre }) ? ' aviso' : ''), title: v.dominio }, v.nombre);

  pal.append(pap);

function menuVarP(e, n) {

  menu(e, [
    { txt: 'Solo lectura', tilde: !!v.soloLectura, fn: () => cambiarP(() => { const x = varP(n); if (x.soloLectura) delete x.soloLectura; else x.soloLectura = true; }) },
    { txt: 'Oculta', tilde: !!v.oculto, fn: () => cambiarP(() => { const x = varP(n); if (x.oculto) delete x.oculto; else x.oculto = true; }) },

function negritaP(x) {
  const e = Object.assign({}, x.estilo || {});
  if (e.negrita) delete e.negrita; else e.negrita = true;
  if (Object.keys(e).length) x.estilo = e; else delete x.estilo;
}

function nuevaVarP() {
  const n = prompt('Nombre de la variable nueva (sin &):', '');
  if (!n) return;
  if (!/^[A-Za-z_][A-Za-z0-9_]*$/.test(n)) { aviso('Nombre inválido: letras, números y _', true); return; }
  if (varP(n)) { aviso('Ya existe ' + n, true); return; }
  cambiarP(m => m.variables.push({ nombre: n, dominio: 'VarChar(40)', etiqueta: n }));
  sel = { tipo: 'wvar', nombre: n }; pintar();
}

function checkP(etiqueta, valor, alCambiar) {

// "A: x, B: &y" <-> {A: 'x', B: '&y'}
const mapaATexto = o => Object.entries(o || {}).map(([k, v]) => k + ': ' + v).join(', ');
function textoAMapa(t) {
  const r = {};
  for (const par of String(t || '').split(',')) {
    const i = par.indexOf(':'); if (i < 0) continue;
    const k = par.slice(0, i).trim(), v = par.slice(i + 1).trim();
    if (k) r[k] = /^-?\d+(\.\d+)?$/.test(v) ? Number(v) : v.replace(/^["']|["']$/g, '');
  }
  return r;
}

function modelarImp(texto) {

function ordenarEl(e) {

// las columnas que agrega el motor con "calculo: stock" (OptimistStock.COLUMNAS); sin ancho, 130 px
const STOCK_Q = ['ArticulosAlmacenesBultStk', 'ArticulosAlmacenesCantStk', 'ArticulosAlmacenesBultDisp', 'ArticulosAlmacenesCantDisp',
  'ArticulosAlmacenesBultPot', 'ArticulosAlmacenesCantPot', 'ArticulosAlmacenesBultTot', 'ArticulosAlmacenesCantTot',
  'ArticulosAlmacenesBultPendEntrega', 'ArticulosAlmacenesCantPendEntrega'];

const ID_Q = /^[A-Za-z_][A-Za-z0-9_]*$/;
const strQ = v => v == null ? '' : String(v);

async function buscarConsultas(recursos) {
  try { CNS_DIR = await recursos.getDirectoryHandle('consultas'); guardarClave('consultas', CNS_DIR); } catch { CNS_DIR = null; }
}
async function leerConsultas() {
  cnss = [];
  if (!CNS_DIR) return;
  try {
    for await (const [nombre, handle] of CNS_DIR.entries())
      if (handle.kind === 'file' && /\.ya?ml$/i.test(nombre)) cnss.push({ nombre, handle });
  } catch {}
  cnss.sort((a, b) => a.nombre.localeCompare(b.nombre));

// ---------- modelo
function normalParQ(p, nodo) {
  p = p && typeof p === 'object' ? p : {};
  // V66l: tipo (combo / fecha), vacio, recordar y el "donde" de la tabla
  const r = { nombre: strQ(p.nombre), etiqueta: strQ(p.etiqueta), valores: '', tabla: null, default: strQ(p.default),
    tipo: strQ(p.tipo), vacio: p.vacio == null ? '' : String(p.vacio), recordar: p.recordar == null ? '' : String(p.recordar) };
  // los valores en el orden del archivo (un objeto de JavaScript pone primero las claves numéricas, ordenadas)
  const vn = nodo && nodo.get ? nodo.get('valores', true) : null;
  if (vn && vn.items) r.valores = vn.items.map(x => strQ(x.key && (x.key.value ?? x.key.source)) + '=' + strQ(x.value ? x.value.toJSON() : '')).join('; ');
  else if (p.valores && typeof p.valores === 'object') r.valores = Object.entries(p.valores).map(([k, v]) => k + '=' + strQ(v)).join('; ');
  if (p.tabla && typeof p.tabla === 'object') r.tabla = { tabla: strQ(p.tabla.tabla), valor: strQ(p.tabla.valor), texto: strQ(p.tabla.texto), donde: strQ(p.tabla.donde) };
  return r;
}
function modelarCns(texto) {
  const doc = YAML.parseDocument(texto);
  if (doc.errors.length) throw new Error('El YAML tiene errores: ' + doc.errors[0].message.split('\n')[0]);
  const js = doc.toJS() || {};
  if (js.consulta == null) throw new Error('no es una consulta (falta "consulta:")');
  const mapa = o => { const r = {}; if (o && typeof o === 'object' && !Array.isArray(o)) for (const [k, v] of Object.entries(o)) r[String(k)] = strQ(v); return r; };
  const lista = o => Array.isArray(o) ? o.map(x => String(x).trim()) : o == null ? [] : String(o).split(',').map(x => x.trim()).filter(Boolean);
  const procesos = {};
  if (js.procesos && typeof js.procesos === 'object')
    for (const [k, v] of Object.entries(js.procesos)) procesos[k] = (Array.isArray(v) ? v : [v]).map(x => String(x).trim()).join(', ');
  const enlaces = {};
  if (js.enlaces && typeof js.enlaces === 'object')
    for (const [k, v] of Object.entries(js.enlaces)) {
      const vv = v && typeof v === 'object' ? v : {};
      enlaces[k] = { clave: strQ(vv.clave), trn: (Array.isArray(vv.trn) ? vv.trn : []).map(c => ({ si: strQ(c && c.si), trn: strQ(c && c.trn) })),
        cns: strQ(vv.cns), parametros: (Array.isArray(vv.parametros) ? vv.parametros : []).map(x => String(x).trim()).join(', '), si: strQ(vv.si) };   // V66l
    }
  return {
    consulta: strQ(js.consulta), titulo: strQ(js.titulo), plural: strQ(js.plural), trn: strQ(js.trn), calculo: strQ(js.calculo),
    parametros: (Array.isArray(js.parametros) ? js.parametros : []).map((x, i) => { const pn = doc.get('parametros', true); return normalParQ(x, pn && pn.items ? pn.items[i] : null); }),
    recibe: (Array.isArray(js.recibe) ? js.recibe : []).map(r => ({ nombre: strQ(r && r.nombre), obligatorio: !!(r && r.obligatorio === true), sql: strQ(r && r.sql) })),
    // V66l: las demás claves (variables, condicion, estilos, acciones, botones, cabecera, orden) no se editan acá: quedan como están en el archivo
    subtitulo: js.subtitulo && typeof js.subtitulo === 'object' ? { sql: strQ(js.subtitulo.sql), parametros: lista(js.subtitulo.parametros) } : null,
    join: js.join == null ? '' : String(js.join).replace(/\s+$/, ''),
    columnasSql: (Array.isArray(js.columnasSql) ? js.columnasSql : []).map(c => ({ nombre: strQ(c && c.nombre), titulo: strQ(c && c.titulo),
      tipo: strQ(c && c.tipo), formato: strQ(c && c.formato), sql: strQ(c && c.sql), oculta: !!(c && c.oculta === true) })),
    enlaces, columnas: lista(js.columnas), titulos: mapa(js.titulos), anchos: mapa(js.anchos), ocultas: lista(js.ocultas), procesos
  };
}
function cargarCns(nombre, texto, handle) {
  let m;
  try { m = modelarCns(texto); } catch (e) { aviso(nombre + ': ' + e.message, true); return; }
  A = null; P = null; R = null;
  const info = Q && Q.m.trn === m.trn ? Q.info : null;
  Q = { nombre, handle, texto, m, orig: JSON.parse(JSON.stringify(m)), hist: [], fut: [], bak: false, info };
  sel = { tipo: 'cns' };
  pintar();
  if (!info) leerTrnQ();
}
async function abrirCns(i) {
  if (!await confirmarPerder()) return;
  const a = cnss[i]; if (!a) return;
  cargarCns(a.nombre, await (await a.handle.getFile()).text(), a.handle);
}
/** Los campos de la TRN de la consulta (título, dominio), para las columnas propias y para agregar columnas. */
async function leerTrnQ() {
  if (!Q) return;
  const trn = Q.m.trn.trim(), q0 = Q;
  let info = { trn, campos: {}, dominios: {}, encontrada: false };
  const a = archivos.find(x => x.nombre.replace(/\.ya?ml$/i, '').toLowerCase() === trn.toLowerCase());
  if (a) {
    try {
      const r = modelar(await (await a.handle.getFile()).text());
      const titWW = {};
      for (const c of r.m.ww.columnas) if (c.titulo) titWW[c.campo] = c.titulo;
      for (const c of r.m.campos) {
        const n = String(c.vals.nombre);
        info.campos[n.toLowerCase()] = { nombre: n, titulo: titWW[n] || strQ(c.vals.etiqueta) || n, dominio: c.vals.dominio };
      }
      info.dominios = r.m.dominios || {};
      info.encontrada = true;
    } catch (e) { aviso('No se pudo leer la TRN ' + trn + ': ' + e.message, true); }
  }
  if (Q !== q0) return;
  Q.info = info;
  pintar();
}
function cambiarQ(fn) {
  Q.hist.push(JSON.stringify(Q.m));
  if (Q.hist.length > 300) Q.hist.shift();
  Q.fut = [];
  fn(Q.m);
  pintar();
}

// ---------- columnas: de dónde salen, título y ancho (como el motor, OptimistConsultaView)
function colSqlQ(m, c) { return m.columnasSql.find(x => x.nombre.toLowerCase() === String(c).toLowerCase()) || null; }
function campoTrnQ(c) { return Q && Q.info ? Q.info.campos[String(c).toLowerCase()] || null : null; }
function origenQ(m, c) {
  if (m.calculo.toLowerCase() === 'stock' && STOCK_Q.includes(c)) return 'stock';
  if (colSqlQ(m, c)) return 'sql';
  if (campoTrnQ(c)) return 'trn';
  return Q && Q.info && Q.info.encontrada ? '?' : 'trn';
}
function tituloQ(m, c) {
  if (m.titulos[c] != null && m.titulos[c] !== '') return m.titulos[c];
  const s = colSqlQ(m, c);
  if (s) return s.titulo || s.nombre;
  const t = campoTrnQ(c);
  return t ? t.titulo : c;
}
function tituloDefectoQ(m, c) {   // el que tendría sin "titulos:"
  const s = colSqlQ(m, c);
  if (s) return s.titulo || s.nombre;
  const t = campoTrnQ(c);
  return t ? t.titulo : c;
}
function pxQ(a) {
  const s = String(a).trim(), n = parseFloat(s);
  if (isNaN(n)) return null;
  return /em$/i.test(s) ? n * 16 : n;
}
/** El ancho con que se ve la columna: el de "anchos:", o 130 las de stock, o el automático (no baja de la caja del filtro). */
function anchoQ(m, c) {
  const a = m.anchos[c] != null ? pxQ(m.anchos[c]) : null;
  if (a != null) return { px: a, auto: false };
  if (origenQ(m, c) === 'stock') return { px: 130, auto: false, defecto: true };
  return { px: AUTO_Q, auto: true };
}
function totalQ(m) { return ACCIONES_Q + m.columnas.reduce((t, c) => t + anchoQ(m, c).px, 0); }
function dominioQ(c) { const t = campoTrnQ(c); return t ? dominio(t.dominio) : null; }
function muestraQ(m, c) {
  const o = origenQ(m, c);
  if (o === 'stock') return '1.234,000';
  if (o === 'sql') { const s = colSqlQ(m, c); return s.tipo === 'numero' ? '12.345,67' : s.tipo === 'fecha' ? '21/10/2026' : 'Texto de ejemplo'; }
  const d = dominioQ(c);
  if (!d) return '…';
  if (d.valores && d.valores.length) return strQ(d.valores[0].texto ?? d.valores[0].valor);
  if (d.tipo === 'num') { const l = Math.max(1, d.largo - d.dec); const ent = '9'.repeat(Math.min(l, 9)).replace(/\B(?=(\d{3})+(?!\d))/g, d.miles || d.dec ? '.' : ''); return d.dec ? ent + ',' + '9'.repeat(d.dec) : ent; }
  if (d.tipo === 'date') return '21/10/2026';
  if (d.tipo === 'datetime') return '21/10/2026 10:30';
  if (d.tipo === 'bool') return 'Sí';
  return 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.slice(0, Math.max(3, Math.min(d.largo || 10, 26)));
}

// ---------- validación
function validarCns(m) {
  const errores = [], avisos = [];
  if (!ID_Q.test(m.consulta)) errores.push('nombre de la consulta inválido: ' + m.consulta);
  if (!m.trn.trim()) errores.push('falta la TRN de la consulta');
  const vistas = new Set();
  for (const c of m.columnas) {
    if (!ID_Q.test(c)) errores.push('columna inválida: ' + c);
    if (vistas.has(c.toLowerCase())) errores.push('columna repetida: ' + c);
    vistas.add(c.toLowerCase());
    if (origenQ(m, c) === '?') avisos.push(c + ' no es un campo de la TRN ' + m.trn + ' ni una columna SQL (no se va a ver)');
  }
  for (const [c, a] of Object.entries(m.anchos)) if (!/^\d+(\.\d+)?(px|em|%)$/.test(String(a).trim())) errores.push('ancho de ' + c + ' inválido: ' + a + ' (ej. 80px)');
  for (const [c, p] of Object.entries(m.procesos)) if (!/^\d+(\s*,\s*\d+)*$/.test(String(p).trim())) errores.push('procesos de ' + c + ': números separados por coma');
  const nsql = new Set();
  for (const s of m.columnasSql) {
    if (!ID_Q.test(s.nombre)) errores.push('columna SQL con nombre inválido: ' + (s.nombre || '(vacío)'));
    if (nsql.has(s.nombre.toLowerCase())) errores.push('columna SQL repetida: ' + s.nombre);
    nsql.add(s.nombre.toLowerCase());
    if (!s.sql.trim()) errores.push('columna SQL ' + s.nombre + ': falta la sentencia');
    if (s.tipo && !['texto', 'numero', 'fecha'].includes(s.tipo)) errores.push('columna SQL ' + s.nombre + ': tipo texto, numero o fecha');
    if (s.sql.trim() && !m.join.trim() && /\bx\w*\./.test(s.sql)) avisos.push('columna SQL ' + s.nombre + ': usa tablas del join y la consulta no tiene join');
  }
  for (const r of m.recibe) {
    if (!ID_Q.test(r.nombre)) errores.push('recibe: nombre inválido ' + (r.nombre || '(vacío)'));

  }
  for (const [c, e] of Object.entries(m.enlaces)) {
    if (e.cns) continue;   // V66l: vínculo a otra consulta (con sus parámetros)
    if (!e.clave.trim()) errores.push('vínculo de ' + c + ': falta la clave');
    if (!e.trn.length) errores.push('vínculo de ' + c + ': falta al menos una TRN');
    e.trn.forEach((x, i) => { if (!x.trn.trim()) errores.push('vínculo de ' + c + ', caso ' + (i + 1) + ': falta la TRN'); });
    if (!m.columnas.includes(c)) avisos.push('el vínculo de ' + c + ' no se usa: no es una columna');
  }
  for (const p of m.parametros) {
    if (!ID_Q.test(p.nombre)) errores.push('parámetro con nombre inválido: ' + (p.nombre || '(vacío)'));
    if (p.valores.trim() && p.valores.split(';').some(x => x.trim() && !x.includes('='))) errores.push('parámetro ' + p.nombre + ': los valores van como 1=Texto; 2=Texto');
  }
  if (m.subtitulo && !m.subtitulo.sql.trim()) errores.push('el subtítulo no tiene la sentencia SQL');
  if (totalQ(m) > ANCHO_UTIL_Q) avisos.push('la grilla mide ' + totalQ(m) + ' px y el ancho útil es ' + ANCHO_UTIL_Q + ' px: va a tener barra horizontal');
  return { errores, avisos };
}

// ---------- YAML: escritura
/** Un escalar de YAML, sin comillas si no hacen falta (también dentro de [] y {}). */
function yv(v) {
  if (typeof v === 'number' || typeof v === 'boolean') return String(v);
  const s = strQ(v);
  let plano = false;
  try { plano = s !== '' && s.trim() === s && !/[\n\t,\[\]{}#&*!|>'"%@`\\]/.test(s) && !/:(\s|$)/.test(s) && !/^[-?:]/.test(s) && YAML.parse(s) === s; } catch {}
  return plano ? s : JSON.stringify(s);
}
const numYv = s => /^-?\d+(\.\d+)?$/.test(String(s).trim()) ? String(s).trim() : yv(s);
function procesosYv(p) { const l = String(p).split(',').map(x => x.trim()).filter(Boolean); return l.length === 1 ? l[0] : '[' + l.join(', ') + ']'; }
function flowMapaQ(o) { return '{' + Object.entries(o).map(([k, v]) => (ID_Q.test(k) ? k : yv(k)) + ': ' + v).join(', ') + '}'; }
/** [a, b, ...] o {a: 1, ...} en varios renglones de hasta 120 caracteres, con la sangría del primero. */
function envolverQ(prefijo, items, abre, cierra) {
  const ind = ' '.repeat(prefijo.length + 1), lineas = [];
  let l = prefijo + abre;
  items.forEach((it, i) => {
    const t = it + (i < items.length - 1 ? ',' : '');
    if (l.length + t.length > 120 && l.trim().length > abre.length && !l.endsWith(abre)) { lineas.push(l.replace(/\s+$/, '')); l = ind; }
    l += t + ' ';
  });
  lineas.push(l.replace(/\s+$/, '') + cierra);
  return lineas.join('\n');
}
function itemSqlQ(s) {
  const o = { nombre: yv(s.nombre) };
  if (s.titulo) o.titulo = yv(s.titulo);
  if (s.tipo) o.tipo = yv(s.tipo);
  if (s.formato) o.formato = yv(s.formato);
  if (s.oculta) o.oculta = 'true';
  o.sql = yv(s.sql);
  return flowMapaQ(o);
}
/** Un parámetro en renglones (el primero es "nombre: ..."; los demás van con la sangría del primero). */
function lineasParQ(p) {
  const l = ['nombre: ' + yv(p.nombre)];
  if (p.etiqueta) l.push('etiqueta: ' + yv(p.etiqueta));
  const vals = p.valores.split(';').map(x => x.trim()).filter(Boolean).map(x => { const i = x.indexOf('='); return [x.slice(0, i).trim(), x.slice(i + 1).trim()]; });
  if (vals.length) l.push('valores: {' + vals.map(([a, b]) => numYv(a) + ': ' + yv(b)).join(', ') + '}');
  if (p.tabla && (p.tabla.tabla || p.tabla.valor || p.tabla.texto)) {
    const tb = { tabla: yv(p.tabla.tabla), valor: yv(p.tabla.valor), texto: yv(p.tabla.texto) };
    if (p.tabla.donde) tb.donde = yv(p.tabla.donde);
    l.push('tabla: ' + flowMapaQ(tb));
  }
  if (p.tipo) l.push('tipo: ' + yv(p.tipo));
  if (p.default !== '') l.push('default: ' + numYv(p.default));
  if (p.vacio === 'true' || p.vacio === 'false') l.push('vacio: ' + p.vacio);
  if (p.recordar === 'true' || p.recordar === 'false') l.push('recordar: ' + p.recordar);
  return l;
}
function itemRecQ(r) { const o = { nombre: yv(r.nombre) }; if (r.obligatorio) o.obligatorio = 'true'; if (r.sql.trim()) o.sql = yv(r.sql); return flowMapaQ(o); }
function valorMapaQ(k, v) { return k === 'procesos' ? procesosYv(v) : yv(v); }
function itemQ(k, x) { return k === 'columnasSql' ? itemSqlQ(x) : k === 'recibe' ? itemRecQ(x) : yv(x); }
/** El texto de una sección entera (null = se borra). flow: la sección estaba escrita como {…} o […]. */
function seccionQ(k, m, flow) {
  const v = m[k];
  switch (k) {
    case 'titulo': case 'plural': case 'trn': case 'calculo': case 'consulta':
      return v === '' && k !== 'consulta' ? null : k + ': ' + yv(v);
    case 'columnas': case 'ocultas':
      return v.length ? envolverQ(k + ': ', v.map(yv), '[', ']') : null;
    case 'titulos': case 'anchos': case 'procesos': {
      const e = Object.entries(v).filter(([, x]) => x !== '');
      if (!e.length) return null;
      const par = ([c, x]) => (ID_Q.test(c) ? c : yv(c)) + ': ' + valorMapaQ(k, x);
      if (flow ?? k === 'anchos') return envolverQ(k + ': ', e.map(par), '{', '}');
      return k + ':\n' + e.map(x => '  ' + par(x)).join('\n');
    }
    case 'recibe': case 'columnasSql':
      return v.length ? k + ':\n' + v.map(x => '  - ' + itemQ(k, x)).join('\n') : null;
    case 'join':
      return v.trim() ? 'join: |\n' + v.split('\n').map(l => l.trim() ? '  ' + l : '').join('\n') : null;
    case 'subtitulo':
      if (!v || !v.sql.trim()) return null;
      return 'subtitulo:\n  sql: ' + yv(v.sql) + (v.parametros.length ? '\n  parametros: [' + v.parametros.map(yv).join(', ') + ']' : '');
    case 'enlaces': {
      const e = Object.entries(v);
      if (!e.length) return null;
      const l = ['enlaces:'];
      for (const [c, x] of e) {
        if (x.cns) {   // V66l: a otra consulta
          const o = { cns: yv(x.cns) };
          const ps = String(x.parametros || '').split(',').map(y => y.trim()).filter(Boolean);
          if (ps.length) o.parametros = '[' + ps.map(yv).join(', ') + ']';
          if (x.si) o.si = yv(x.si);
          l.push('  ' + c + ': ' + flowMapaQ(o));
          continue;
        }
        l.push('  ' + c + ':', '    clave: ' + yv(x.clave), '    trn:');
        for (const t of x.trn) l.push('      - ' + flowMapaQ(t.si.trim() ? { si: yv(t.si), trn: yv(t.trn) } : { trn: yv(t.trn) }));
      }
      return l.join('\n');
    }
    case 'parametros':
      return v.length ? 'parametros:\n' + v.map(x => '  - ' + lineasParQ(x).join('\n    ')).join('\n') : null;
  }
  return null;
}
/**
 * Solo lo que cambió de una sección: los valores cambiados, los que se quitaron (con su renglón o su coma) y los
 * agregados al final. Lo demás del texto (comentarios, cortes de renglón) queda igual. null = hay que reescribirla entera.
 */
function parcialQ(txt, k, nuevo, viejo) {
  if (!['columnas', 'ocultas', 'titulos', 'anchos', 'procesos', 'recibe', 'columnasSql', 'parametros'].includes(k)) return null;
  const doc = YAML.parseDocument(txt);
  const n = doc.get(k, true);
  if (!n || !n.items || !n.items.length) return null;
  const esMapa = YAML.isMap(n);
  if (!esMapa && !YAML.isSeq(n)) return null;
  if (esMapa && Object.values(nuevo).some(x => x === '')) return null;
  const vk = esMapa ? Object.keys(viejo) : viejo.map(x => JSON.stringify(x));
  const nk = esMapa ? Object.keys(nuevo) : nuevo.map(x => JSON.stringify(x));
  if (n.items.length !== vk.length) return null;
  const ini = it => esMapa ? it.key.range[0] : it.range[0];
  const fin = it => { let f = esMapa ? (it.value ? it.value.range[1] : it.key.range[1]) : it.range[1]; while (f > ini(it) && /\s/.test(txt[f - 1])) f--; return f; };
  const inicioRenglon = pos => txt.lastIndexOf('\n', pos - 1) + 1;
  const finRenglon = pos => { const j = txt.indexOf('\n', pos); return j < 0 ? txt.length : j + 1; };
  const textoItem = (it, x, clave) => {
    if (k === 'parametros') return lineasParQ(x).join('\n' + ' '.repeat(it.range[0] - inicioRenglon(it.range[0])));
    return esMapa ? valorMapaQ(k, x) : itemQ(k, x);
  };
  const ed = [];
  // cuáles quedan (en el mismo orden) y cuáles se agregan al final

$('#bArchivo').addEventListener('click', async () => {
  if (!await confirmarPerder()) return;
  if (!window.showOpenFilePicker) { $('#inArchivo').click(); return; }
  let fh;
  try { [fh] = await showOpenFilePicker({ id: 'optimist-archivo', types: [{ description: 'YAML de OPTIMIST', accept: { 'text/yaml': ['.yaml', '.yml'] } }] }); }
  catch (e) { return; }   // canceló
  const tx = await (await fh.getFile()).text();
  if (/^panel\s*:/m.test(tx)) { cargarPanel(fh.name, tx, fh); if (P) P.suelto = true; }
  else if (esConsulta(tx)) { cargarCns(fh.name, tx, fh); if (Q) Q.suelto = true; }   // V66k4
  else if (esImpresion(tx)) { cargarImp(fh.name, tx, fh); if (R) R.suelto = true; }   // V64
  else { cargar(fh.name, tx, fh); if (A) A.suelto = true; }
});
/** V49i: antes de grabar, el permiso de escritura del archivo (Chrome lo pregunta la primera vez). */
async function permisoEscritura(handle) {
  try {
    if (!handle.queryPermission) return true;
    if (await handle.queryPermission({ mode: 'readwrite' }) === 'granted') return true;
    return await handle.requestPermission({ mode: 'readwrite' }) === 'granted';
  } catch { return false; }
}
$('#inArchivo').addEventListener('change', async e => {
  const f = e.target.files[0];
  if (f) { const tx = await f.text(); if (/^panel\s*:/m.test(tx)) cargarPanel(f.name, tx, null); else if (esConsulta(tx)) cargarCns(f.name, tx, null); else if (esImpresion(tx)) cargarImp(f.name, tx, null); else cargar(f.name, tx, null); }   // V49h: un web panel
  e.target.value = '';
});
$('#lista').addEventListener('change', e => { const v = e.target.value; if (v === '') return; if (v.startsWith('c')) abrirCns(+v.slice(1)); else if (v.startsWith('i')) abrirImp(+v.slice(1)); else if (v.startsWith('w')) abrirWbp(+v.slice(1)); else abrirTrn(+v); });

document.addEventListener('keydown', e => {
  if (!(e.ctrlKey || e.metaKey)) return;
  const k = e.key.toLowerCase();
  if (k === 's') { e.preventDefault(); guardar(); }
  else if (k === 'z' && !e.target.matches('input')) { e.preventDefault(); e.shiftKey ? rehacer() : deshacer(); }
  else if (k === 'y' && !e.target.matches('input')) { e.preventDefault(); rehacer(); }
});

// ------------------------------------------------------------------ E2: importar de GeneXus (OPTIMIST Engine)
// El XML / XPZ de la KB se lee en el navegador (GXI, importador.js). Cada TRN se convierte en memoria; se puede ver
// (vista previa en el diseñador, sin grabar) e importar a la carpeta trn de la aplicación. En trn/_importacion.json queda
// el checksum de cada TRN importada, para saber después si cambió en GeneXus. En trn/_gx/<Trn>.gx.txt, lo que no se
// tradujo (reglas y eventos) listo para pasarle a la IA de cada desarrollador.
const IMP = { kb: null, archivo: '', lista: [], destino: null, control: { trns: {} }, existentes: new Map(),
              marcadas: new Set(), filtro: '', verWwp: false, avance: null, previa: null, error: '' };
const CONTROL_IMP = '_importacion.json';

function abrirImportador() {
  $('#imp').classList.add('abierto');
  pintarImportador();
  recordadosImp();
}
/** E4e: el último archivo de GeneXus y la última carpeta de la aplicación quedan guardados (en el navegador). Al abrir el
 * importador se usan solos si el navegador ya dio permiso; si no, un clic en "↻ …" los vuelve a abrir (el navegador pregunta). */
async function recordadosImp() {
  if (IMP.recordadosLeidos) return;
  IMP.recordadosLeidos = true;
  IMP.kbRecordada = await leerGuardado('imp-kb');
  IMP.appRecordada = await leerGuardado('imp-app');
  if (IMP.appRecordada && !IMP.destino) {
    try { if (await IMP.appRecordada.queryPermission({ mode: 'readwrite' }) === 'granted') await usarDestinoImp(IMP.appRecordada); } catch {}
  }
  if (IMP.kbRecordada && !IMP.kb && IMP.avance == null) {
    try { if (await IMP.kbRecordada.queryPermission({ mode: 'read' }) === 'granted') { await leerArchivoGx(await IMP.kbRecordada.getFile()); return; } } catch {}
  }
  pintarImportador();
}
async function reabrirImp(handle, modo) {
  try {
    if (await handle.queryPermission({ mode: modo }) !== 'granted' && await handle.requestPermission({ mode: modo }) !== 'granted') return false;
    return true;
  } catch (e) { aviso('No se pudo abrir ' + handle.name + ' (¿lo movieron o borraron?): elegilo de nuevo.', true); return false; }
}
function cerrarImportador() { $('#imp').classList.remove('abierto'); }

async function elegirArchivoGx() {
  let f = null;
  if (window.showOpenFilePicker) {
    try {
      const [fh] = await showOpenFilePicker({ id: 'optimist-gx', types: [{ description: 'Export de GeneXus (XML o XPZ)', accept: { 'application/octet-stream': ['.xml', '.xpz'] } }] });
      f = await fh.getFile();
      IMP.kbRecordada = fh; guardarClave('imp-kb', fh);
    } catch (e) { if (e && e.name === 'AbortError') return; }
  }
  if (!f) { $('#inGx').click(); return; }
  await leerArchivoGx(f);
}
async function leerArchivoGx(f) {
  IMP.avance = 0; IMP.error = ''; IMP.kb = null; IMP.pre = null; IMP.errorPy = ''; IMP.pyKb = null; IMP.lista = []; IMP.marcadas.clear(); IMP.archivo = f.name; pintarImportador();
  await procesandoImp('Leyendo la KB', 'Leyendo ' + f.name + '…', 0);
  try {
    let ult = 0;
    const kb = await GXI.leerArchivo(f, x => { const ahora = Date.now(); if (ahora - ult > 150) { ult = ahora; IMP.avance = x; pintarAvanceImp();
      procesandoImp('Leyendo la KB', 'Leyendo ' + f.name + ' (' + Math.round(x * f.size / 1048576) + ' de ' + Math.max(1, Math.round(f.size / 1048576)) + ' MB)…', x); } });
    await procesandoImp('Leyendo la KB', 'Armando la lista de transacciones…', 1);
    IMP.kb = kb;
    IMP.lista = GXI.listarTrns(kb);
    kbEnPython(f);   // E4e: en segundo plano (el importador completo y el preinforme corren en Python)
    if (!IMP.lista.length) IMP.error = 'En ese archivo no hay transacciones. Exportá la KB (o las TRN que quieras) con sus atributos, dominios y la instancia de WorkWithPlus.';
  } catch (e) { IMP.error = 'No se pudo leer ' + f.name + ': ' + e.message; }
  procesandoImp(null);
  IMP.avance = null;

y (either by the dev server or during the build) -->\n<\/head>\n<body>\n  <!-- This outlet div is where the views are rendered -->\n  <div id=\"outlet\"><\/div>\n<\/body>\n<\/html>\n", "src/main/resources/application.properties": "server.port={{PUERTO}}\nspring.application.name={{NOMBRE}}\n# Cookie de sesión propia: así esta aplicación y otra abiertas en la misma PC no se pisan la sesión\nserver.servlet.session.cookie.name={{NOMBRE}}-sesion\n", "src/main/resources/dominios.yaml": "# Dominios, clases y códigos comunes a todas las TRN de {{TITULO}} (guía de OPTIMIST Engine).\n# Cada TRN importada de GeneXus trae sus propios dominios; acá van los que se quieran compartir.\n\n# Dominios de importes con separador de miles y los que se totalizan al pie de las listas.\nconMiles: []\ntotalizar: []\n\n# Clases de estilo para los campos (clase: Nombre en la TRN).\nclases:\n  Destacado: {negrita: true, tamaño: \"-1px\", color: \"30,100,180\"}\n\n# Código que ve el usuario en lugar de la clave interna (ej. Articulos: {codigo: ArticulosId}).\ncodigos: {}\n\ndominios: {}\n", "src/main/resources/menu.yaml": "# Menú lateral de {{TITULO}} (guía de OPTIMIST Engine, sección 10).\n# Ítem de una TRN:   - {titulo: Clientes, trn: Clientes}\n# Carpeta:           - Nombre:  (y adentro sus ítems, con más sangría)\n# \"Inicio\" se agrega siempre al principio de la primera categoría.\n# El importador de GeneXus del Designer no toca este archivo: agregá acá las TRN que vayas importando.\n\n{{TITULO}}: []\n", "src/main/resources/seguridad.yaml": "# Usuarios de {{TITULO}} (guía de OPTIMIST Engine, sección 24).\n# tipoClave: texto | md5 | sha1 | sha256 (el hash guardado en hexadecimal).\n# Otro sistema de ingreso (ej. GAM de GeneXus): con una extensión en Java (OptimistExtension.autenticar).\nusuarios:\n  tabla: {{U_TABLA}}\n  id: {{U_ID}}\n  nombre: {{U_NOMBRE}}\n  clave: {{U_CLAVE}}\n  tipoClave: {{U_TIPO}}\n", "src/main/resources/trn/LEEME.txt": "Acá van las TRN de {{TITULO}} (un .yaml por TRN). Se importan de GeneXus con OPTIMIST Designer: \"Importar de GeneXus\".\n", "src/test/java/ar/com/datafix/optimist/ValidarYamlTest.java": "package ar.com.datafix.optimist;\n\nimport org.junit.jupiter.api.Test;\nimport org.yaml.snakeyaml.Yaml;\n\nimport java.io.InputStream;\nimport java.nio.file.Files;\nimport java.nio.file.Path;\nimport java.util.*;\nimport java.util.stream.Stream;\n\nimport static org.junit.jupiter.api.Assertions.fail;\n\n/**\n * V29 - Valida TODOS los YAML antes de generar el WAR (corre en `mvn package`, no en `mvn spring-boot:run`).\n * Usa las mismas reglas del motor. Si algo está mal, el WAR NO se genera y se listan los errores.\n * En un apuro: mvn clean package -Pproduction -DskipTests\n */\nclass ValidarYamlTest {\n\n    private static final Path RECURSOS = Path.of(\"src\", \"main\", \"resources\");\n\n    @Test\n    @SuppressWarnings(\"unchecked\")\n    void losYamlSonValidos() throws Exception {\n        List<String> errores = new ArrayList<>();\n\n        // dominios globales\n        Map<String, Object> dominios = Map.of();\n        Path dom = RECURSOS.resolve(\"dominios.yaml\");\n        if (Files.exists(dom)) {\n            try (InputStream in = Files.newInputStream(dom)) {\n                Object o = new Yaml().load(in);\n                if (o instanceof Map<?, ?> m) dominios = (Map<String, Object>) m;\n                else if (o != null) errores.add(\"dominios.yaml: tiene que ser un bloque 'Nombre: tipo'\");\n            } catch (Exception e) { errores.add(\"dominios.yaml: \" + e.getMessage()); }\n        }\n\n        // cada TRN\n        Map<String, String> rutas = new TreeMap<>();   // ruta -> archivo\n        Path dir = RECURSOS.resolve(\"trn\");\n        List<Path> archivos = new ArrayList<>();\n        if (Files.isDirectory(dir)) try (Stream<Path> s = Files.list(dir)) {\n            s.filter(p -> p.getFileName().toString().toLowerCase(Locale.ROOT).endsWith(\".yaml\")).sorted().forEach(archivos::add);\n        }\n        for (Path p : archivos) {\n            String nombre = p.getFileName().toString();\n            try (InputStream in = Files.newInputStream(p)) {\n                Object o = new Yaml().load(in);\n                if (!(o instanceof Map<?, ?> m)) { errores.add(nombre + \": archivo vacío o mal armado\"); continue; }\n                OptimistTrnDefinicion.Trn trn = OptimistTrnDefinicion.desde((Map<String, Object>) m, dominios);\n                String previo = rutas.put(trn.ruta(), nombre);\n                if (previo != null) errores.add(nombre + \": ruta repetida '\" + trn.ruta() + \"' (también en \" + previo + \")\");\n            } catch (Exception e) {\n                errores.add(nombre + \": \" + e.getMessage());\n            }\n        }\n\n        // V59d: las vistas (vistas/*.yaml, V57) también son rutas trn/<vista> a las que puede apuntar el menú\n        Path dirVistas = RECURSOS.resolve(\"vistas\");\n        if (Files.isDirectory(dirVistas)) try (Stream<Path> s = Files.list(dirVistas)) {\n            for (Path p : s.filter(x -> x.getFileName().toString().toLowerCase(Locale.ROOT).endsWith(\".yaml\")).sorted().toList()) {\n                try (InputStream in = Files.newInputStream(p)) {\n                    Object o = new Yaml().load(in);\n                    Object v = o instanceof Map<?, ?> m ? m.get(\"vista\") : null;\n                    if (v == null) errores.add(\"vistas/\" + p.getFileName() + \": falta 'vista:'\");\n                    else rutas.put(String.valueOf(v).trim().toLowerCase(Locale.ROOT), \"vistas/\" + p.getFileName());\n                } catch (Exception e) { errores.add(\"vistas/\" + p.getFileName() + \": \" + e.getMessage()); }\n            }\n        }\n\n        // menú\n        Path menu = RECURSOS.resolve(\"menu.yaml\");\n        if (Files.exists(menu)) {\n            try (InputStream in = Files.newInputStream(menu)) {\n                Object o = new Yaml().load(in);\n                if (!(o instanceof Map<?, ?> m)) errores.add(\"menu.yaml: tiene que empezar con las categorías (Nombre:)\");\n                else for (Map.Entry<?, ?> e : m.entrySet()) {\n                    // V59d: \"Ocultar:\" es una lista de títulos / programas que el menú no muestra, no una categoría\n                    if (String.valueOf(e.getKey()).trim().equalsIgnoreCase(\"ocultar\")) {\n                        if (!(e.getValue() instanceof List<?> l) || l.stream().anyMatch(x -> x instanceof Map<?, ?> || x instanceof List<?>))\n                            errores.add(\"menu.yaml, Ocultar: tiene que ser una lista de títulos o programas (- Favoritos)\");\n                        continue;\n                    }\n                    carpeta(String.valueOf(e.getKey()), e.getValue(), rutas.keySet(), errores);\n                }\n            } catch (Exception e) { errores.add(\"menu.yaml: \" + e.getMessage()); }\n        }\n\n        if (!errores.isEmpty()) {\n            StringBuilder b = new StringBuilder(\"\\n\\nHay \" + errores.size() + \" error(es) en los YAML. El WAR NO se generó:\\n\");\n            errores.forEach(x -> b.append(\"  - \").append(x).append('\\n'));\n            b.append(\"\\nCorregilos y volvé a generar (en un apuro: -DskipTests).\\n\");\n            fail(b.toString());\n        }\n    }\n\n    private static void carpeta(String donde, Object contenido, Set<String> rutas, List<String> errores) {\n        if (contenido == null) return;\n        if (contenido instanceof Map<?, ?> m) {\n            for (Map.Entry<?, ?> e : m.entrySet()) carpeta(donde + \" / \" + e.getKey(), e.getValue(), rutas, errores);\n        } else if (contenido instanceof List<?> lista) {\n            for (Object o : lista) {\n                if (!(o instanceof Map<?, ?> mm)) { errores.add(\"menu.yaml, \" + donde + \": elemento inválido: \" + o); continue; }\n                if (mm.containsKey(\"titulo\")) {\n                    Object titulo = mm.get(\"titulo\"), trn = mm.get(\"trn\"), ruta = mm.get(\"ruta\");\n                    if (titulo == null || String.valueOf(titulo).isBlank()) errores.add(\"menu.yaml, \" + donde + \": ítem sin título: \" + mm);\n                    if (trn != null) {\n                        String r = String.valueOf(trn).trim().toLowerCase(Locale.ROOT);\n                        if (!rutas.contains(r)) errores.add(\"menu.yaml, \" + donde + \": '\" + titulo + \"' apunta a la TRN \" + trn + \", que no existe (o tiene errores)\");\n                    } else if (ruta == null && mm.get(\"pendiente\") == null)   // V49v: {titulo, pendiente: prog} = todavía no migrado (se ve en gris)\n                        errores.add(\"menu.yaml, \" + donde + \": ítem '\" + titulo + \"' sin trn, ruta ni pendiente\");\n                } else if (mm.size() == 1) {\n                    Map.Entry<?, ?> e = mm.entrySet().iterator().next();\n                    carpeta(donde + \" / \" + e.getKey(), e.getValue(), rutas, errores);\n                } else errores.add(\"menu.yaml, \" + donde + \": elemento sin título: \" + mm);\n            }\n        } else errores.add(\"menu.yaml, \" + donde + \": contenido inválido: \" + contenido);\n    }\n}\n"};

async function nuevaAplicacion() {

    h('label', { style: 'align-self:center' }, 'Clave guardada'),
    h('select', { onchange: e => { v.tipo = e.target.value; } }, ...['texto', 'md5', 'sha1', 'sha256'].map(t => h('option', { value: t }, t === 'texto' ? 'en texto plano' : 'hash ' + t.toUpperCase()))));

  const cuerpo = [

    const yamlTexto = t => /^[\w áéíóúñÁÉÍÓÚÑ.-]+$/.test(t) ? t : '"' + t.replace(/\\/g, '\\\\').replace(/"/g, '\\"') + '"';

      const contenido = texto.replace(/\{\{(\w+)\}\}/g, (m, k) => k in marcas ? (k === 'TITULO' ? esc(marcas[k]) : marcas[k]) : m);
      const partes = ruta.split('/'); let d = raiz;
      for (const p of partes.slice(0, -1)) d = await d.getDirectoryHandle(p, { create: true });
      const w = await (await d.getFileHandle(partes.at(-1), { create: true })).createWritable();
      await w.write(contenido); await w.close();
    }
    procesandoImp(null);
    let trn = raiz; for (const p of ['src', 'main', 'resources', 'trn']) trn = await trn.getDirectoryHandle(p, { create: true });
    IMP.destino = trn; IMP.destinoPadre = v.nombre; await leerDestinoImp();
    const seguir = await dialogoImp({ titulo: 'Aplicación creada', cuerpo: [
      h('p', null, 'Se creó ', h('b', null, padre.name + '/' + v.nombre), ' con ', total, ' archivos.'),
      h('p', null, 'Para arrancarla: copiar ', h('code', null, 'optimist.cfg.ejemplo'), ' afuera del proyecto con los datos de la base y seguir el ', h('code', null, 'README.md'), '.'),
      h('p', null, '¿Importás ahora las TRN de GeneXus? Van a ir a esta aplicación.')],
      botones: [{ texto: '⬇ Importar de GeneXus', clase: 'primario', valor: true }, { texto: 'Más tarde', valor: false }] });
    if (seguir) abrirImportador();
  } catch (e) {
    procesandoImp(null);
    aviso('No se pudo crear la aplicación: ' + ((e && e.message) || e), true);
  }
}

// ------------------------------------------------------------------ E4 · AYUDA (manual del desarrollador y guía de los YAML)
// armar.py mete los .md del motor (MANUAL_DESARROLLADOR.md y GUIA_CONFIGURACION_TRN.md): funciona sin internet y es siempre la
// documentación de esta versión. Se abre en el tema de lo que se está haciendo.
const DOCS_AYUDA = {"manual": "# OPTIMIST Engine — Manual del desarrollador\n\nVersión del manual: **E4e** (29/10/2026). Se actualiza con cada versión del motor (ver `CAMBIOS.md`).\nEl detalle de cada YAML está en `GUIA_CONFIGURACION_TRN.md` (la \"guía\"); este manual es el camino de punta a punta.\nLos dos se leen desde el Designer con **❓ Ayuda** (o F1), que abre en el tema de lo que se está haciendo.\n\n---\n\n## 1. Qué es\n\nOPTIMIST Engine ejecuta aplicaciones definidas en archivos YAML: transacciones (TRN) con su WorkWith y sus lupas, web panels,\nprocedimientos escritos en lenguaje GeneXus, consultas, impresiones y menú. Las TRN se importan de una KB de GeneXus con\n**OPTIMIST Designer**, que también sirve para retocarlas a mano (formulario, WorkWith, propiedades).\n\nUna aplicación tiene:\n- el **motor** (`optimist-engine.jar`), igual para todas;\n- sus **YAML** (`src/main/resources`), lo que la hace distinta;\n- opcionalmente, **Java propio** enchufado al motor (extensiones, sección 9) para lo que no se resuelve con YAML.\n\nEl resultado es un WAR que corre en Tomcat, o solo con `java -jar`.\n\n## 2. Requisitos\n\n| Qué | Versión | Para qué |\n|---|---|---|\n| Java (JDK) | 25 | compilar y ejecutar |\n| Maven | 3.9 o posterior | armar el motor y las aplicaciones |\n| MySQL | 5.6 o posterior (o MariaDB) | la base de la aplicación. *SQL Server: en preparación* |\n| Tomcat | 11 (opcional) | servidor de producción; también corre sin Tomcat |\n| Chrome o Edge | actual | OPTIMIST Designer |\n\nLa base es la misma que usaba la aplicación GeneXus: el motor lee y graba sus tablas tal como están.\n\n## 3. Instalar el motor\n\nEn la carpeta del motor (`engine`):\n\n```\nmvn install\n```\n\nDeja `optimist-engine.jar` en el repositorio Maven de la PC. Se hace **una vez por cada versión del motor** que se baja; las\naplicaciones lo toman de ahí.\n\nCarpetas recomendadas, una al lado de la otra:\n\n```\nOPTIMIST\\\n  engine\\          el motor y el Designer\n  mi-aplicacion\\   cada aplicación en su carpeta (y su repositorio Git)\n```\n\n## 4. Crear una aplicación\n\n1. Abrir `engine/herramientas/disenador/OPTIMIST-Designer.html` en Chrome o Edge.\n2. **✨ Nueva aplicación**: carpeta (ej. `mi-aplicacion`, también es el nombre del WAR), título, grupo Maven (ej. `com.miempresa`),\n   puerto para probar, nombre de la base y de dónde salen los usuarios (la tabla `SecUser` de WorkWithPlus u otra).\n3. Elegir dónde crearla (la carpeta `OPTIMIST`, al lado de `engine`).\n4. Al terminar ofrece **importar las TRN de GeneXus** (sección 5).\n\nQueda armada con: `pom.xml`, `src/main/resources/` (`menu.yaml`, `dominios.yaml`, `seguridad.yaml`, `trn/`,\n`application.properties`), `optimist.cfg.ejemplo`, `README.md` y `CAMBIOS.md`.\n\n## 5. Importar de GeneXus\n\n1. En GeneXus: **Knowledge Manager → Export** de las transacciones con sus instancias de WorkWithPlus y los procedimientos,\n   web panels y Data Providers que usan (XML o XPZ; lo más simple es exportar la KB entera).\n2. En el Designer: **⬇ Importar de GeneXus** → elegir el archivo exportado y la **carpeta de la aplicación** (no la `trn`).\n3. La lista muestra cada TRN con su estado (*nueva*, *ya migrada*, *cambió en GeneXus* o *no se puede*) y **⚠ N** con lo que ya se\n   sabe que no se va a migrar (pasando el mouse, qué). Tildar las que se quieren migrar (👁 muestra cómo queda, sin grabar).\n   Avisa las TRN que usan otras todavía no migradas.\n4. **Importar**: corre el mismo flujo con que se migró OPTIMIST ERP: la TRN, fórmulas, paneles, reglas, evento Start, acciones del\n   WorkWith y todo lo que llaman (procedimientos, impresiones, Data Providers, web panels), hasta el final.\n5. Al terminar muestra **el informe de lo que no se pudo migrar**. Leerlo siempre: hasta resolver eso, la aplicación no hace todo\n   lo que hacía GeneXus. Queda en `trn/_gx/_informe_importacion.txt`, al final de cada TRN (bloque `SIN MIGRAR`, que el Designer\n   muestra en una franja amarilla) y en `trn/_gx/<TRN>.gx.txt`, con el código de GeneXus, para pasárselo a la IA de cada uno.\n6. Agregar las TRN al `menu.yaml`:\n   ```yaml\n   Mi Aplicación:\n     - {titulo: Clientes, trn: Clientes}\n     - Tablas:\n         - {titulo: Países, trn: Paises}\n   ```\n\nVolver a importar una TRN ya migrada **pisa** lo que se haya cambiado a mano en su YAML (pide confirmación y deja un `.bak`).\nLos procedimientos, web panels e impresiones que la aplicación ya tiene **no se pisan** (el informe dice cuáles difieren de GeneXus).\n\nSi un procedimiento manda mails, configurar el servidor de correo en el `optimist.cfg` (`mail.*`, sección 8).\n\nProbado con GeneXus 17 + WorkWithPlus. *GeneXus 15, 16, 18, Evolution y K2BTools: en validación.*\n\n## 6. Arrancar la aplicación en la PC\n\n1. Copiar `optimist.cfg.ejemplo` **afuera** del proyecto (ej. `C:/optimist/config/mi-aplicacion/optimist.cfg`) y completar:\n   ```\n   database.host=localhost\n   database.port=3306\n   database.name=MiBase\n   database.user=usuario\n   database.password=clave\n   sistema.nombre=Mi Aplicación\n   ```\n2. En la carpeta de la aplicación:\n   ```\n   mvn spring-boot:run \"-Dspring-boot.run.arguments=--server.port=18082 --optimist.config=C:/optimist/config/mi-aplicacion/optimist.cfg\"\n   ```\n3. Entrar a `http://localhost:18082` con un usuario de la tabla de `seguridad.yaml`.\n\nLa primera vez tarda más (Vaadin arma la pantalla). Mientras corre, **un cambio en un YAML se ve al reabrir la pantalla**, sin\nreiniciar.\n\n## 7. Usuarios\n\n`src/main/resources/seguridad.yaml` dice dónde están los usuarios (guía, 24.1):\n\n```yaml\nusuarios:\n  tabla: SecUser\n  id: SecUserId\n  nombre: SecUserName\n  clave: SecUserPassword\n  tipoClave: texto      # texto | md5 | sha1 | sha256\n```\n\nEn los YAML el usuario conectado es `&SecUserId` / `&SecUserName`. Si la KB usa **GAM** u otro sistema, el ingreso se resuelve con\nuna extensión (sección 9).\n\n## 8. Armar y publicar el WAR\n\n```\nmvn clean package -Pproduction\n```\n\n- Antes de armarlo **se validan todos los YAML**; si hay errores, el WAR no se genera y Maven los lista.\n- Queda en `target/mi-aplicacion.war`. Se copia a `webapps` de Tomcat 11, o se ejecuta con `java -jar mi-aplicacion.war`.\n- En el servidor, la configuración va en `/usr/optimist/<nombre del WAR>/optimist.cfg` (o donde diga `-Doptimist.config`).\n\nOpciones útiles del `optimist.cfg` (guía para el resto):\n\n| Clave | Qué hace |\n|---|---|\n| `sistema.nombre` | nombre que muestra la pantalla |\n| `sistema.postits` / `sistema.mensajes` | prende o apaga esos módulos (guía 24.2) |\n| `application.precalentar` / `application.precalentarTrn` | deja armadas las TRN al arrancar |\n| `application.<Condicion>=true` | condiciones de `visibleSi` de los YAML |\n| `totales.usuarios` | quién ve el botón Σ de totales (`*` = todos) |\n| `mail.host`, `mail.puerto`, `mail.usuario`, `mail.clave`… | servidor de correo de los procedimientos que mandan mails (guía 16.1) |\n\n## 9. Java propio: extensiones\n\nLo que no se resuelve con YAML se enchufa en Java, sin tocar el motor. En la aplicación:\n\n1. Una clase que implementa `ar.com.datafix.optimist.OptimistExtension` (en `src/main/java`):\n   ```java\n   package com.miempresa;\n\n   import ar.com.datafix.optimist.*;\n   import java.sql.*;\n   import java.util.*;\n\n   public class MiExtension implements OptimistExtension {\n       @Override public List<String> variablesContexto() { return List.of(\"Sucursal\"); }\n\n       @Override public void alIniciarSesion(Connection cn, String usuario, OptimistContexto ctx) throws SQLException {\n           try (PreparedStatement p = cn.prepareStatement(\"SELECT SucursalId FROM Usuarios WHERE Nombre=?\")) {\n               p.setString(1, usuario);\n               try (ResultSet r = p.executeQuery()) { if (r.next()) ctx.poner(\"Sucursal\", r.getObject(1)); }\n           }\n       }\n   }\n   ```\n   Con eso, los YAML pueden usar `\"&Sucursal\"` (ej. `default: \"&Sucursal\"` o en el filtro del WorkWith).\n2. Anotarla en `src/main/resources/META-INF/services/ar.com.datafix.optimist.OptimistExtension` (un renglón por clase):\n   ```\n   com.miempresa.MiExtension\n   ```\n\nTodos los enchufes disponibles están en la guía, sección 23: validar el ingreso, variables de contexto, procedimientos en Java,\nparámetros globales, procesos habilitados por usuario, módulos, cálculos propios de las consultas, etc. Si una extensión anotada\nno se puede cargar, la aplicación no arranca (para no quedar andando a medias).\n\n## 10. Actualizar el motor\n\n1. Bajar la versión nueva del motor (en la carpeta `engine`).\n2. `mvn install` en `engine`.\n3. Si el `CAMBIOS.md` del motor lo pide, cambiar `optimist.engine.version` en el `pom.xml` de la aplicación.\n4. Volver a arrancar la aplicación (o armar el WAR).\n\n## 11. Problemas comunes\n\n| Síntoma | Causa |\n|---|---|\n| Maven: `Could not find artifact ar.com.datafix:optimist-engine` | falta `mvn install` en `engine` (sección 3) |\n| \"Falta configurar los usuarios de la aplicación\" | falta `src/main/resources/seguridad.yaml` |\n| \"No encontré …optimist.cfg\" | la ruta de `--optimist.config` no existe |\n| Una TRN no abre y muestra un error de YAML | el mensaje dice archivo y motivo; corregir y reabrir la pantalla |\n| Un cambio en un YAML no se ve | la aplicación corre desde otra carpeta: arrancarla desde la carpeta del proyecto |\n| Importar: \"falta el archivo optimist-python.js\" | el Designer se copió solo: `optimist-python.js` tiene que estar al lado de `OPTIMIST-Designer.html` |\n", "guia": "# OPTIMIST Engine — Guía de configuración de TRN (YAML)\n\n**Versión del motor: E4** · Esta guía se actualiza con cada versión (el paso a paso está en `MANUAL_DESARROLLADOR.md`).\n\n> **Desde la separación de OPTIMIST Engine (28/10/2026):** esta guía vive en el repositorio `engine`, junto con el motor,\n> el Designer y las herramientas. Donde dice `herramientas/...` es `engine/herramientas/...`; donde dice `src/main/resources/...`\n> es la carpeta de recursos de cada aplicación (por ejemplo `optimist-erp/src/main/resources/...`). Los ejemplos salen de\n> OPTIMIST ERP, la primera aplicación hecha con el motor.\n\n---\n\n## 1. Qué archivos intervienen\n\n| Archivo | Para qué |\n|---|---|\n| `src/main/resources/trn/<Trn>.yaml` | Una transacción completa: tabla, campos, referencias, detalles, pantalla y WorkWith. **Una TRN nueva = un archivo nuevo. Sin Java.** |\n| `src/main/resources/dominios.yaml` | Dominios compartidos por todas las TRN. |\n| `src/main/resources/menu.yaml` | Menú lateral: categorías, carpetas e ítems. Una TRN no aparece en el menú hasta que se la agrega acá. |\n| `herramientas/gx2yaml.py` | Genera el YAML de una TRN leyendo el export XML de la KB GeneXus. |\n| `src/main/resources/proc/<Nombre>.proc` | (V34) Un procedimiento, en el lenguaje de GeneXus. Lo usan las fórmulas (y más adelante reglas y botones). Ver sección 16. |\n| `herramientas/gx2proc.py` | (V34) Traduce procedimientos de la KB GeneXus a `.proc`. |\n| `herramientas/parchar_reglas.py` | (V35) Pasa las reglas y el evento Start de la KB a las secciones `reglas:` e `inicio:` de los YAML. Ver sección 17. |\n| `src/main/resources/consultas/<Nombre>.yaml` | (V52) Una consulta: WorkWith de solo lectura con parámetros y columnas calculadas por el motor (ej. el stock). Ver sección 21. |\n\nLa TRN se abre en `/trn/<transaccion en minúsculas>` (por ejemplo `/trn/articulos`).\nDespués de tocar un YAML hay que volver a generar el WAR (o recargar recursos en desarrollo).\n\n---\n\n## 2. Ejemplo mínimo (2 niveles)\n\n```yaml\ntransaccion: Monedas\ntitulo: Monedas\nsingular: moneda\nplural: monedas\ngenero: f\ntabla: Monedas\norden: [MonedasDescrip]\n\ncampos:\n  - {nombre: MonedasId,      dominio: C04,          etiqueta: Moneda, clave: true}\n  - {nombre: MonedasDescrip, dominio: Descrip,      etiqueta: Descripción, obligatorio: true}\n  - {nombre: MonedasCodAFIP, dominio: Character(3), etiqueta: Código según AFIP}\n\ndetalles:\n  - nombre: Cotizacion\n    titulo: Cotizaciones\n    tabla: MonedasCotizacion\n    orden: [MonedasCotizacionFecha DESC]\n    campos:\n      - {nombre: MonedasCotizacionFecha, dominio: Fecha,       etiqueta: Fecha, clave: true}\n      - {nombre: MonedasCotizacionValor, dominio: Importe4Dec, etiqueta: Cotización, obligatorio: true}\n\nworkwith:\n  columnas: [MonedasId, MonedasDescrip, MonedasCodAFIP]\n```\n\nY en `menu.yaml`:\n```yaml\nMenú General:\n  - {titulo: Monedas, trn: Monedas}\n```\n\n---\n\n## 3. Datos generales de la TRN\n\n| Clave | Obligatoria | Descripción |\n|---|---|---|\n| `transaccion` | sí | Nombre de la TRN. Define la ruta `/trn/<nombre en minúsculas>`. |\n| `titulo` | no | Título de la pantalla (por defecto, el nombre). |\n| `singular` / `plural` | no | Para los textos: \"Nueva **moneda**\", \"4 **monedas**\". |\n| `genero` | no | `f` para femenino (Nueva / guardada / borrada). Por defecto masculino. |\n| `ruta` | no | Otra URL en lugar del nombre (minúsculas, números, `-`, `_`). |\n| `tabla` | no | Tabla física de la cabecera (por defecto, el nombre de la TRN). |\n| `orden` | no | Orden del WorkWith: `[Campo]` o `[Campo DESC]`. Por defecto, la clave. (V41) También un campo inferido, ej. la razón social del cliente; en los detalles, solo campos propios. |\n| `auditoria` | no | Campos que el motor completa solo al grabar (ver 3.1). |\n| `encabezado` | no | Título del formulario con campos entre llaves (ver 3.2). |\n\n### 3.1 Auditoría\n```yaml\nauditoria: {altaFecha: ArticulosCreateDate, altaUsuario: ArticulosCreateUserName,\n            modificacionFecha: ArticulosLastModifiedDate, modificacionUsuario: ArticulosLastModifiedUserName}\n```\nEn el alta se completan `altaFecha`/`altaUsuario`; en cada modificación, `modificacionFecha`/`modificacionUsuario`. El usuario es el que inició sesión. (V61b) En el alta, `modificacionFecha` queda en la fecha vacía de GeneXus (1000-01-01) y `modificacionUsuario` vacío, también en una duplicación (antes la copia se quedaba con los del original).\n\n**En la pantalla (V61c)**, la auditoría va siempre en dos renglones (en todas las TRN con `auditoria:`, y así la genera `gx2yaml.py`):\n```\n  <solapa Auditoría>\n    <tabla anchos=300px,1fr>\n      TcbteCreateDate          TcbteCreateUserName\n      TcbteLastModifiedDate    TcbteLastModifiedUserName\n    <endtable>\n  <endsolapa>\n```\n\n`anchos=300px,1fr` deja la primera columna (las fechas) de ancho fijo, así el usuario queda al lado y no en el otro extremo del formulario. Va en una tabla propia: si los renglones de auditoría compartieran tabla con otros campos, el ancho cambiaría también los demás.\n\n**Fecha vacía (V61b):** como en GeneXus, una fecha vacía se graba como `1000-01-01`, aunque el campo tenga `nulo: true` (en un procedimiento, `SetEmpty()` también; `SetNull()` deja NULL). Al leer, cualquier fecha del año 1000 o anterior se toma como vacía: no se muestra en el formulario, los web panels, el WorkWith ni el Excel, y `IsEmpty()` da verdadero.\n\n### 3.2 Encabezado (título del formulario)\n```yaml\nencabezado: \"Artículo {ArticulosId} - {ArticulosDescrip}\"\nencabezado: \"Pedido {PedidosNumero} de {ClientesRazonSocial}\"     # -> Pedido 45.345 de Industrias Meloni S.A.\n```\n- Va arriba de todo, fuera de las solapas: siempre sabés en qué registro estás.\n- Admite campos propios e inferidos, todos los que quieras.\n- Números enteros con separador de miles, fechas dd/MM/yyyy, combos con su texto.\n- Se actualiza mientras se edita (al cambiar el cliente, cambia la razón social del título).\n- En un alta muestra \"Nuevo artículo\" hasta que se completen los campos del encabezado.\n- Sin `encabezado`: singular + clave (\"Artículo 436\").\n\n---\n\n## 4. Dominios\n\nSe definen en `dominios.yaml` (para todas las TRN) o en un bloque `dominios:` dentro de la TRN (pisa al global).\n\n**Notación GeneXus** (lo más cómodo):\n```yaml\ndominios:\n  Fecha: Date\n  N09: Numeric(9)\n  Importe4Dec: Numeric(14.4)     # 14 dígitos en total, 4 decimales\n  Descrip: VarChar(50)\n  C04: Character(4)\n```\n\n**Punto de miles** (V33): el número se muestra `1.234.567,89` en el formulario, el WorkWith y los detalles. Se escribe como uno quiera (`1234,5`, `1.234,50` o con el punto del teclado numérico) y al salir del campo queda formateado.\n- Para todas las TRN, en `dominios.yaml`: `conMiles: [Precio, Total, Cantidad]` (vale aunque la TRN defina el dominio en su archivo). Ya vienen los que en GeneXus tienen \"Thousands separator\", más Precio.\n- Para uno solo: `Precio: Numeric(14.4) miles` o, como bloque, `miles: true`.\n\n**Como bloque** (necesario para combos):\n```yaml\n  ManejoStock:\n    tipo: Numeric(1)\n    valores:                      # combo: se guarda 'valor', se muestra 'texto'\n      - {valor: 1, texto: Por Bulto}\n      - {valor: 2, texto: Por Cantidad}\n      - {valor: 3, texto: Por Bulto y Cantidad}\n```\n\n| Tipo | Control en pantalla | MySQL |\n|---|---|---|\n| `Character(n)` | texto, máximo n | CHAR |\n| `VarChar(n)` / `LongVarChar(n)` | texto, máximo n | VARCHAR |\n| `Numeric(n)` | número entero, alineado a la derecha | INT / BIGINT / DECIMAL |\n| `Numeric(n.d)` | número con d decimales (formato argentino) | DECIMAL(n,d) |\n| `Date` | fecha dd/MM/yyyy | DATE |\n| `DateTime` | fecha y hora | DATETIME |\n| `Boolean` | casilla | TINYINT(1) / BIT |\n| cualquiera con `valores` | combo | el del tipo |\n\nEn un campo también se puede poner el tipo directo: `dominio: Character(3)`.\n\n**Ojo con los códigos con cero adelante** (V59f): en `valores`, un código como `001` o `010` va **entre comillas** (`valor: \"001\"`). Sin comillas YAML lo lee como número (y en octal: `010` es 8) y el combo no coincide con lo grabado (\"valor no permitido\").\n\n**Dominio `Password`** (V59d): un dominio de texto que se llame `Password` (en `dominios.yaml`, en la TRN o en el web panel: `Password: VarChar(100)`) se ve como campo de contraseña: no se ve lo que se escribe (el ojo lo muestra). Sirve en las TRN y en los web panels. **Necesita el motor V59d** (con un motor anterior se ve como texto común).\n\n---\n\n## 5. Campos\n\nCada campo es una línea `- {nombre: ..., dominio: ..., etiqueta: ..., <opciones>}`.\n`nombre` es el nombre de la columna en MySQL.\n\n| Opción | Qué hace |\n|---|---|\n| `etiqueta` | Texto que ve el usuario. |\n| `clave: true` | Parte de la clave primaria. Es obligatoria y no se modifica una vez grabada. |\n| `autonumerico: true` | Clave numerada por MySQL (AUTO_INCREMENT). En el alta muestra \"automático\". |\n| `siguiente: true` | (V65) Clave numérica entera: en el alta propone el mayor de la tabla + 1 y se puede cambiar (si otro graba antes el mismo número, avisa \"Ya existe\"). Con clave compuesta, entre los registros con las demás claves en su `default` (ej. `&Empresa`). En la clave de un **detalle**: el renglón nuevo toma el mayor de la grilla + 1 al empezar a cargarlo (ej. el número de cuota de CondPago). |\n| `obligatorio: true` | No se puede grabar vacío. |\n| `mensaje: \"...\"` | Mensaje propio cuando falta un obligatorio (el `Error(...)` de GeneXus). |\n| `default: valor` | Valor inicial en el alta. En combos, el `valor` (no el texto). Con `\"&Empresa\"` (entre comillas) toma el valor del contexto del usuario: ver sección 9.1. Con `\"&Today\"` la fecha del día y con `\"&Now\"` la fecha y hora (V48c); con `\"&NewGuid\"` un UUID nuevo (V83, el `GUID.NewGuid()` de GeneXus); vale también para las altas que hace un procedimiento con Business Components (ej. Generar Pedido). |\n| `soloLectura: true` | Se ve pero no se edita (el `NoAccept` de GeneXus). |\n| `oculto: true` | Se guarda pero no se muestra. Al modificar conserva su valor; en el alta va vacío o con su `default`. Para volver a mostrarlo, se borra el `oculto: true` (no hace falta escribir `false`). |\n| `inferido: true` | Viene de otra tabla por una referencia (ver 6). No se guarda en esta tabla. |\n| `formula: \"...\"` | (V34) Atributo fórmula de GeneXus: **se muestra de solo lectura y se recalcula en vivo** con cada cambio del formulario. No se guarda. Ver 5.1. |\n| `guardar: true` | Junto con `formula`: fórmula **redundante** (GeneXus la guarda en la tabla). El motor la calcula al grabar, con todo lo de 5.1. (V42) Si no se puede calcular, no se graba: queda lo que había. Como está en la tabla, puede ser columna, oculta u orden del WorkWith. Puede sumar campos de los detalles. |\n| `nulo: true` | Vacío se graba como NULL (por defecto: `''` en textos, `0` en números, NULL en fechas). |\n| `editableEnModificacion: false` | Solo se carga en el alta. |\n| `visibleSi: ModuloMutual` | Solo se ve si el `optimist.cfg` del cliente dice `application.ModuloMutual=true` (E4: cualquier nombre; sin la línea, no se ve). |\n| `ancho: 300px` | Ancho del campo (también `30%`, `20ch`; `300` = `300px`). Por defecto, según el dominio. |\n| `estilo: {negrita: true, italica: true, letra: Consolas, tamaño: \"+2px\", color: \"30,100,180\"}` | (V33) Letra de la etiqueta y del contenido del campo. (V46) **El `tamaño:` es relativo a la letra que eligió el usuario**: ver 5.3. Cualquier combinación; tiene prioridad sobre Apariencia. El color entre comillas: `\"30,100,180\"` (rojo, verde, azul, V45), `\"#1e64b4\"` o un nombre (`red`). (V45) `letra:` es la familia de letra (Arial, Calibri, \"Courier New\"...; varias separadas por coma, se usa la primera que tenga la PC) y **manda sobre la letra que eligió el usuario**. `negrita: false` / `italica: false` le sacan a un campo lo que le pone su clase. Manda sobre la clase (ver 5.2). En los detalles se aplica a cada línea. |\n| `clase: Importe` | (V45) Estilo con nombre, definido una vez en `clases:` (ver 5.2). Varias: `clase: [Importe, Rojo]` (la de la derecha manda). |\n| `insignia: {Aprobado: verde, Perdido: rojo}` | (V40) El valor se ve como una **pastilla** (recuadro redondeado de color) en el WorkWith y en el formulario. Cada valor del combo (por su texto o su código) con un color; los que no figuran, en gris. Colores: `azul, verde, verde-oscuro, rojo, marron, magenta, celeste, turquesa, violeta, naranja, amarillo, gris, gris-oscuro` (cada uno con su tono para modo claro y oscuro). |\n| `insignia: {colorDe: StatusLogisticoColor}` | (V40) El color sale de otro campo de la misma fila, cuyo texto es un color (\"Azul\", \"Marrón\"...): así lo elige el cliente desde su tabla. Ese campo puede estar oculto; el WorkWith lo trae solo. |\n| `renglones: 4` | Alto de un campo de texto, en renglones (1 a 30). **Automático:** los textos de 512 caracteres o más (`VarChar(512)`, `LongVarChar`) ya salen con 3 renglones sin escribir nada. `renglones: 1` fuerza una sola línea. En las grillas de detalle siempre es una línea. |\n\n**GUID (V83)**: `dominio: GUID` es el GUID de GeneXus: texto de 36 caracteres. Con `default: \"&NewGuid\"` se genera solo en el alta.\n\n### 5.4 Archivos (el Blob de GeneXus, V83)\n\nLos atributos Blob de la cabecera NO van en `campos`: van en `archivos:`. El formulario los muestra al pie, en el panel **Archivos**:\npor cada uno, el nombre del archivo grabado, **Bajar**, **Elegir otro…** y **Quitar**. Lo elegido o quitado se graba al **Confirmar**\n(en la misma transacción que el resto; en el alta también), antes de las reglas de después de grabar (AfterInsert,\nAfterUpdate, BeforeComplete), que ya ven el archivo nuevo, como en GeneXus. Bajar trae lo que está grabado en la base en ese momento.\n\n```yaml\narchivos:\n  - {nombre: SistemaDDLMini, etiqueta: DDL Mini, nombreArchivo: SistemaDDLMiniFileName, tipoArchivo: SistemaDDLMiniFileType}\n```\n\n| Opción | Qué hace |\n|---|---|\n| `nombre` | La columna (Blob) de la tabla de la cabecera. |\n| `etiqueta` | Texto que ve el usuario. |\n| `nombreArchivo` | (optativo) Campo de `campos` donde va el nombre del archivo, sin la extensión (el `AttFileNameAtt` de GeneXus). |\n| `tipoArchivo` | (optativo) Campo de `campos` donde va la extensión (el `AttFileTypeAtt` de GeneXus). |\n\nEl contenido queda en la columna como lo deja GeneXus, así cualquier otro programa que lea la tabla lo sigue leyendo igual.\n`gx2yaml.py` los arma solo desde la KB.\n\n**En un detalle (E4c)**: el mismo `archivos:`, dentro del detalle (el Blob tampoco va en sus `campos`). En cada renglón aparece una\ncolumna con **👁 Ver** (en una ventana, si el navegador lo puede mostrar: PDF, imágenes, texto; si no, se baja), **⬇ Bajar**,\n**⬆ Subir** y **✕ Quitar** (en modo ver, solo Ver y Bajar). Lo subido o quitado se graba al Confirmar, en la misma transacción,\ncon la clave definitiva del renglón (también la numerada). El contenido no se lee con la lista: recién al pedir Ver o Bajar.\n\n```yaml\ndetalles:\n  - nombre: Archivos\n    tabla: IncidentesArchivos\n    numerador: IncidentesLastArchivo\n    campos:\n      - {nombre: IncidentesArchivosId, dominio: Numeric(4), clave: true}\n      - {nombre: IncidentesArchivosDescrip, dominio: Descrip, etiqueta: Descripción}\n      - {nombre: IncidentesArchivosFileName, dominio: VarChar(100), etiqueta: Nombre Archivo, soloLectura: true}\n      - {nombre: IncidentesArchivosFileType, dominio: VarChar(10), etiqueta: Tipo Archivo, soloLectura: true}\n    archivos:\n      - {nombre: IncidentesArchivosFile, etiqueta: Archivo, nombreArchivo: IncidentesArchivosFileName, tipoArchivo: IncidentesArchivosFileType}\n```\n\n**Ocultar un campo: `oculto` vs. `visibleSi`**\n\n| Caso | Cómo se hace |\n|---|---|\n| No se usa en ningún cliente | `oculto: true` en el campo. Puede quedar en la `pantalla` (su lugar queda vacío) o sacarse de ahí. |\n| Se ve o no según el cliente | Se deja en la `pantalla` y se pone `visibleSi: Condicion`. Cada cliente lo ve o no según su `optimist.cfg`: `application.Condicion=true` (E4). |\n\nEjemplo:\n```yaml\n  - {nombre: ArticulosHH, dominio: Numeric(4), etiqueta: HH, nulo: true, oculto: true}\n```\n\n---\n\n### 5.1 Fórmulas (V34)\n\nSe escriben como en GeneXus, en una sola línea:\n\n| Qué | Ejemplo |\n|---|---|\n| Operadores | `+ - * / ^`, paréntesis, `= <> < > <= >=`, `and`, `or
