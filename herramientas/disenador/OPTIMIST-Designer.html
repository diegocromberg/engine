<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OPTIMIST Designer</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230e8f7a'/%3E%3Ccircle cx='32' cy='32' r='18' fill='none' stroke='%23fff' stroke-width='8'/%3E%3Crect x='42' y='42' width='16' height='16' rx='3' fill='%23ffd54a' stroke='%230e8f7a' stroke-width='3'/%3E%3C/svg%3E">
<style>
:root {
  --fondo: #f4f6f8; --panel: #ffffff; --borde: #d7dde3; --texto: #1d2733; --suave: #6b7785;
  --acento: #0e8f7a; --acento-2: #e6f4f1; --peligro: #c0392b; --sel: #fff4c2; --oculto: #9aa5b1;
  --celda: #fbfcfd; --drop: #d8f1ea;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { font: 13px/1.35 "Segoe UI", system-ui, sans-serif; color: var(--texto); background: var(--fondo);
       display: grid; grid-template-rows: auto 1fr auto; }
button, select, input { font: inherit; }
button { border: 1px solid var(--borde); background: #fff; border-radius: 6px; padding: 5px 10px; cursor: pointer; }
button:hover:not(:disabled) { border-color: var(--acento); }
button:disabled { opacity: .45; cursor: default; }
button.primario { background: var(--acento); color: #fff; border-color: var(--acento); }
button.chico { padding: 2px 7px; font-size: 12px; }
input[type=text], input[type=number], select { border: 1px solid var(--borde); border-radius: 5px; padding: 4px 6px; background: #fff; width: 100%; }

/* barra superior */
#barra { display: flex; gap: 8px; align-items: center; padding: 8px 12px; background: #0f2a33; color: #fff; flex-wrap: wrap; }
#barra .marca { font-weight: 700; letter-spacing: .5px; margin-right: 8px; color: #7fd3c3; }
#barra button { background: #1d3f4a; color: #fff; border-color: #2e5a67; }
#barra button.primario { background: var(--acento); border-color: var(--acento); }
#barra select { width: 260px; background: #fff; }
#barra .estado { margin-left: auto; opacity: .85; font-size: 12px; }
#barra .sucio { color: #ffd166; font-weight: 600; }
#barra .orden { display: flex; gap: 4px; align-items: center; flex: 1 1 320px; max-width: 460px; }
#barra .orden input { width: 100%; background: #fff; }
#bVoz.escuchando { background: #c0392b; border-color: #c0392b; animation: latido 1.2s infinite; }
@keyframes latido { 50% { opacity: .6; } }

/* tres paneles */
#cuerpo { display: grid; grid-template-columns: 290px 1fr 320px; min-height: 0; }
.panel { background: var(--panel); border-right: 1px solid var(--borde); overflow: auto; min-height: 0; }
#props { border-right: 0; border-left: 1px solid var(--borde); padding: 12px; }
#centro { overflow: auto; padding: 14px 18px 40px; min-width: 0; }
.titulo-panel { font-weight: 700; text-transform: uppercase; font-size: 11px; letter-spacing: .6px; color: var(--suave); padding: 10px 12px 4px; }

/* árbol */
#arbol ul { list-style: none; margin: 0; padding-left: 14px; }
#arbol > ul { padding-left: 6px; }
#arbol li > .nodo { display: flex; align-items: center; gap: 5px; padding: 2px 6px; border-radius: 4px; cursor: pointer; white-space: nowrap; }
#arbol li > .nodo:hover { background: var(--acento-2); }
#arbol li > .nodo.sel { background: var(--sel); }
#arbol .flecha { width: 12px; color: var(--suave); font-size: 10px; flex: none; }
#arbol .ico { width: 16px; text-align: center; flex: none; }
#arbol .nodo.oculto .txt { color: var(--oculto); text-decoration: line-through; }
#arbol .nodo .extra { color: var(--suave); font-size: 11px; overflow: hidden; text-overflow: ellipsis; }
#arbol li.cerrado > ul { display: none; }

/* pestañas del centro */
.pestanas { display: flex; gap: 2px; border-bottom: 1px solid var(--borde); margin-bottom: 12px; }
.pestanas .p { padding: 7px 14px; border: 1px solid transparent; border-bottom: 0; border-radius: 6px 6px 0 0; cursor: pointer; color: var(--suave); }
.pestanas .p.act { background: var(--panel); border-color: var(--borde); color: var(--texto); font-weight: 600; margin-bottom: -1px; }

/* formulario */
.form { background: var(--panel); border: 1px solid var(--borde); border-radius: 10px; padding: 12px 16px 16px; }
.solapas { display: flex; flex-wrap: wrap; gap: 2px; border-bottom: 2px solid var(--acento); margin-bottom: 12px; }
.solapa-tab { padding: 6px 12px; border-radius: 6px 6px 0 0; background: #eef1f4; cursor: pointer; user-select: none; }
.solapa-tab.act { background: var(--acento); color: #fff; }
.solapa-tab.drop, .zona.drop, .celda.drop, .bloque-det.drop { outline: 2px dashed var(--acento); background: var(--drop) !important; }
.solapa-tab.nueva { background: transparent; color: var(--acento); border: 1px dashed var(--acento); }
.tabla { border: 1px dashed transparent; border-radius: 8px; padding: 6px; margin-bottom: 10px; position: relative; }
.tabla:hover { border-color: var(--borde); }
.tabla.sel { border-color: #e0b400; background: #fffdf2; }
.tabla .cab-tabla { display: flex; gap: 6px; align-items: center; font-size: 11px; color: var(--suave); margin-bottom: 4px; }
.tabla .cab-tabla .t { font-weight: 600; color: var(--texto); font-size: 12px; }
.grilla { display: grid; gap: 6px 14px; }
.celda { min-height: 34px; border: 1px solid transparent; border-radius: 6px; padding: 3px 6px; display: flex; flex-wrap: wrap; align-items: center; gap: 2px 8px; background: var(--celda); cursor: grab; }
.celda:hover { border-color: var(--borde); }
.celda.sel { border-color: #e0b400; background: var(--sel); }
.celda.vacia { background: repeating-linear-gradient(45deg, #fafbfc, #fafbfc 6px, #f1f3f5 6px, #f1f3f5 12px); cursor: default; justify-content: center; color: #c3cad2; font-size: 11px; }
.celda .et { flex: 0 1 auto; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #34495e; }
.celda .ctl { flex: 1 1 90px; min-width: 60px; height: 24px; border: 1px solid #c9d1d9; border-radius: 4px; background: #fff; display: flex; align-items: center; padding: 0 6px; color: var(--suave); font-size: 11px; overflow: hidden; white-space: nowrap; }
.celda .ctl.multi { height: 46px; align-items: flex-start; padding-top: 3px; }
.celda .marcas { flex: none; font-size: 11px; color: var(--suave); }
.celda.por-regla { border: 1px dashed #9aa5b1; opacity: .75; }   /* V64c: visible según una regla (X.Visible = ...) */
.celda.oculto { opacity: .45; }
.celda.oculto .et { text-decoration: line-through; }
.celda.inferido .ctl { background: #f3f5f7; font-style: italic; }
.celda.lectura .ctl { background: #f3f5f7; }
.celda.error { border-color: var(--peligro); }
.agregar { display: flex; gap: 6px; margin-top: 6px; }
.zona { border: 1px dashed #c9d1d9; border-radius: 6px; padding: 6px; text-align: center; color: var(--suave); font-size: 12px; flex: 1; }
.bloque-det { border: 1px solid var(--borde); border-radius: 8px; margin: 8px 0 12px; background: #fff; cursor: grab; }
.bloque-det .cab { padding: 6px 10px; background: #eef1f4; border-radius: 8px 8px 0 0; font-weight: 600; display: flex; justify-content: space-between; }
.bloque-det .cols { display: flex; gap: 4px; padding: 8px; flex-wrap: wrap; }
.bloque-det .col { background: #f6f8fa; border: 1px solid #e2e6ea; border-radius: 4px; padding: 3px 8px; font-size: 12px; }
.bloque-det .col.oculto { opacity: .45; text-decoration: line-through; }
.bloque-det.sel { outline: 2px solid #e0b400; }
/* V34: grilla simulada del detalle */
.gs-scroll { overflow-x: auto; padding: 6px 8px 8px; }
.gs { display: inline-block; min-width: 100%; }
.gs-fila { display: flex; gap: 6px; align-items: center; margin-bottom: 4px; }
.gs-tacho { width: 30px; min-width: 30px; text-align: center; font-size: 12px; opacity: .6; }
.gs-tit { font-size: 12px; color: #4a5a68; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 2px 2px; cursor: pointer; box-sizing: border-box; }
.gs-celda { height: 24px; border: 1px solid #d5dbe1; border-radius: 4px; background: #fff; box-sizing: border-box; cursor: pointer; }
.gs-celda.ro { background: #e4e8ec; border-style: dashed; }
.gs-tit.sel, .gs-celda.sel { outline: 2px solid #e0b400; }
.coment { color: #7a8794; font-style: italic; font-size: 12px; margin: 2px 0 6px; }

/* paneles y renglones */
.panel-d { border: 1px solid #9fcfc5; border-radius: 10px; margin: 6px 0 10px; background: #fff; min-width: 0; }
.panel-d > .cab { display: flex; align-items: center; gap: 8px; padding: 6px 10px; background: #eef8f5; border-radius: 10px 10px 0 0; cursor: grab; font-weight: 600; }
.panel-d > .cab .tg { color: var(--acento); width: 16px; cursor: pointer; }
.panel-d > .cab .badge { font-weight: 400; font-size: 11px; color: var(--suave); background: #fff; border: 1px solid var(--borde); border-radius: 10px; padding: 0 7px; }
.panel-d > .cuerpo { padding: 8px 10px; }
.panel-d.sel { outline: 2px solid #e0b400; }
.panel-d.plegado > .cuerpo { display: none; }
.panel-d > .cab.drop { outline: 2px dashed var(--acento); }
.renglon-d { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-start; border: 1px dashed #c9d1d9; border-radius: 10px; padding: 6px; margin: 6px 0 10px; position: relative; }
.renglon-d > * { flex: 1 1 260px; min-width: 0; }
.renglon-d > .zona { flex: 0 0 110px; align-self: stretch; display: flex; align-items: center; justify-content: center; }
.renglon-d.sel { outline: 2px solid #e0b400; }
.renglon-d .etq { position: absolute; top: -9px; left: 10px; background: var(--fondo); font-size: 10px; color: var(--suave); padding: 0 4px; cursor: grab; }
.cab-tabla.drop { outline: 2px dashed var(--acento); }

/* sin ubicar + papelera */
.paleta { margin-top: 16px; background: var(--panel); border: 1px solid var(--borde); border-radius: 10px; padding: 10px 12px; }
.paleta h4 { margin: 0 0 6px; font-size: 12px; color: var(--suave); text-transform: uppercase; letter-spacing: .5px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--borde); background: #fff; border-radius: 14px; padding: 3px 10px; cursor: grab; font-size: 12px; }
.chip.oculto { color: var(--oculto); }
.chip.aviso { border-color: #e0b400; }
#papelera { margin-top: 10px; border: 2px dashed #e3b5ae; color: var(--peligro); border-radius: 8px; padding: 10px; text-align: center; }
#papelera.drop { background: #fbe9e7; }

/* workwith */
.ww { background: var(--panel); border: 1px solid var(--borde); border-radius: 10px; padding: 12px; }
.ww-cols { display: flex; gap: 0; overflow-x: auto; border: 1px solid var(--borde); border-radius: 6px; }
.ww-col { min-width: 90px; padding: 8px 10px; border-right: 1px solid var(--borde); background: #f6f8fa; cursor: grab; user-select: none; }
.ww-col:last-child { border-right: 0; }
.ww-col .t { font-weight: 600; }
.ww-col .n { font-size: 11px; color: var(--suave); }
.ww-col.sel { background: var(--sel); }
.ww-col.drop { box-shadow: inset 3px 0 0 var(--acento); }
.ww-filas div { height: 26px; border-bottom: 1px solid #eef1f4; }
.ww-filas div:nth-child(even) { background: #f7f8fa; }
/* V48e: renglones de muestra de cada columna del WorkWith (con su clase) */
.ww-col { display: flex; flex-direction: column; padding-bottom: 0; --letra-usuario: 13px; }
.ww-celdas { margin: 8px -10px 0; background: #fff; }
.ww-celdas div { height: 26px; line-height: 26px; padding: 0 10px; border-top: 1px solid #eef1f4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ww-celdas div:nth-child(even) { background: #f7f8fa; }

/* propiedades */
#props h3 { margin: 0 0 2px; font-size: 15px; }
#props .sub { color: var(--suave); font-size: 12px; margin-bottom: 12px; }
#props .campo { margin-bottom: 9px; }
#props label.l { display: block; font-size: 11px; color: var(--suave); margin-bottom: 2px; }
#props .check { display: flex; align-items: center; gap: 7px; margin: 5px 0; }
#props .grupo { border-top: 1px solid var(--borde); margin-top: 12px; padding-top: 10px; }
#props .grupo > .gt { font-size: 11px; font-weight: 700; color: var(--suave); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 6px; }
#props .ro { background: #f3f5f7; border-radius: 5px; padding: 4px 6px; color: var(--suave); }
#props .fila { display: flex; gap: 8px; }
#props .fila > * { flex: 1; }
#props .ayuda { color: var(--suave); font-size: 12px; }
.vacio-props { color: var(--suave); padding: 20px 4px; }

/* menú contextual */
#menu { position: fixed; z-index: 50; background: #fff; border: 1px solid var(--borde); border-radius: 8px; box-shadow: 0 8px 24px #0002; padding: 4px; min-width: 210px; display: none; }
#menu .it { padding: 6px 10px; border-radius: 5px; cursor: pointer; display: flex; gap: 8px; align-items: center; }
#menu .it:hover { background: var(--acento-2); }
#menu .it.off { color: #b0b8c1; cursor: default; background: none; }
#menu .sep { height: 1px; background: var(--borde); margin: 4px 2px; }
#menu .tilde { width: 14px; text-align: center; color: var(--acento); font-weight: 700; }

/* pie */
#pie { padding: 5px 12px; font-size: 12px; color: var(--suave); background: var(--panel); border-top: 1px solid var(--borde); display: flex; gap: 16px; }
#pie .err { color: var(--peligro); }
#bienvenida { max-width: 620px; margin: 60px auto; background: var(--panel); border: 1px solid var(--borde); border-radius: 12px; padding: 26px 30px; }
#bienvenida h2 { margin-top: 0; }
#bienvenida li { margin: 6px 0; }
.toast { position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%); background: #0f2a33; color: #fff; padding: 9px 16px; border-radius: 8px; z-index: 60; box-shadow: 0 6px 20px #0003; max-width: 80vw; }
.toast.err { background: var(--peligro); }
/* V48e: editor de clases (ventana flotante sobre la Estructura; el formulario se sigue viendo y cambia en vivo) */
#clases { position: fixed; top: 58px; left: 10px; width: 430px; max-height: calc(100vh - 100px); overflow: auto; z-index: 55;
          background: var(--panel); border: 1px solid var(--borde); border-radius: 10px; box-shadow: 0 10px 34px #0004; }
#clases .cab { cursor: move; user-select: none; display: flex; align-items: center; gap: 8px; padding: 9px 12px; background: #0f2a33; color: #fff; border-radius: 10px 10px 0 0; position: sticky; top: 0; z-index: 1; }
#clases .cab b { flex: 1; }
#clases .cab button { background: transparent; color: #fff; border-color: #2e5a67; }
#clases .sec { padding: 10px 12px; border-top: 1px solid var(--borde); }
#clases .sec:first-of-type { border-top: 0; }
#clases .st { font-size: 11px; font-weight: 700; color: var(--suave); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 6px; }
#clases .lista { display: flex; flex-direction: column; gap: 2px; max-height: 190px; overflow: auto; }
#clases .lista .it { display: flex; align-items: center; gap: 8px; padding: 4px 6px; border-radius: 5px; cursor: pointer; --letra-usuario: 13px; }
#clases .lista .it:hover { background: var(--acento-2); }
#clases .lista .it.sel { background: var(--sel); }
#clases .lista .nom { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#clases .lista .donde { font-size: 11px; color: var(--suave); white-space: nowrap; }
#clases .campo { margin-bottom: 8px; }
#clases .campo > label.l { display: block; font-size: 12px; color: var(--suave); margin-bottom: 2px; }
#clases .fila { display: flex; gap: 8px; align-items: flex-end; }
#clases .fila > * { flex: 1; }
#clases .ayuda { color: var(--suave); font-size: 12px; }
#clases .err { color: var(--peligro); font-size: 12px; margin-top: 4px; }
#clases .muestra { --letra-usuario: 13px; background: #fbfcfd; border: 1px dashed var(--borde); border-radius: 8px; padding: 10px 12px; display: grid; grid-template-columns: auto 1fr; gap: 8px 12px; align-items: center; }
#clases .muestra .ctl { border: 1px solid var(--borde); border-radius: 4px; padding: 4px 8px; background: #fff; min-height: 26px; }
#clases .muestra .tit { grid-column: 1 / -1; font-size: 11px; color: var(--suave); }
#clases .botones { display: flex; gap: 8px; justify-content: flex-end; }
#clases .botones .izq { margin-right: auto; }
/* V49h: web panels: código de los eventos */
.renglon-w { margin-top: 14px; }
.renglon-w > .celda { flex: 0 1 auto; }
.renglon-w > .celda .ctl { min-width: 90px; }
.renglon-w > .zona { flex: 0 0 90px; margin-left: auto; }
textarea.codigo { width: 100%; height: calc(100vh - 230px); min-height: 300px; font: 12.5px/1.45 Consolas, "Cascadia Mono", monospace; tab-size: 4;
                  border: 1px solid var(--borde); border-radius: 6px; padding: 8px 10px; white-space: pre; resize: vertical; }
#clases label.chk { display: flex; align-items: center; gap: 6px; margin: 3px 0; }
/* V64: impresiones */
.rb-barra { position: sticky; top: -14px; z-index: 5; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; background: var(--fondo); padding: 6px 0 10px; }
.rb-barra .chk { display: flex; align-items: center; gap: 4px; }
.rb-barra .rb-ayuda { color: var(--suave); font-size: 12px; }
.rb-banda { margin: 0 0 14px; width: max-content; }
.rb-cab { font-size: 12px; color: var(--suave); padding: 2px 4px; cursor: pointer; }
.rb-cab b { color: var(--texto); }
.rb-banda.sel .rb-cab { background: var(--sel); border-radius: 4px 4px 0 0; }
.rb-area { position: relative; background: #fff; border: 1px solid var(--borde); box-shadow: 0 1px 2px #0001;
  background-image: linear-gradient(#eef1f4 1px, transparent 1px), linear-gradient(90deg, #eef1f4 1px, transparent 1px); background-size: 15px 15px; }
.rb-banda.sel .rb-area { border-color: #e0b400; }
.rb-margen { position: absolute; top: 0; bottom: 0; border-left: 1px dashed #c8d0d8; pointer-events: none; }
.rb-alto { height: 7px; cursor: ns-resize; background: repeating-linear-gradient(90deg, #c8d0d8 0 6px, transparent 6px 10px); opacity: .6; }
.rb-alto:hover { opacity: 1; background: var(--acento); }
.rb-el { position: absolute; cursor: move; white-space: pre; overflow: visible; line-height: 1; color: #111; user-select: none; outline: 1px dotted transparent; }
.rb-el:hover { outline-color: #8fb3c4; }
.rb-el.sel { outline: 2px solid #e0b400; z-index: 3; }
.rb-campo { color: #0b5f8a; background: #eaf5fb99; }
.rb-texto { color: #222; }
.rb-recuadro { border: 1px solid #333; }
.rb-linea { background: #333; min-height: 1px; min-width: 1px; }
.rb-imagen { background: #f0f2f4; border: 1px dashed #9aa5b1; font-size: 11px; color: var(--suave); overflow: hidden; display: flex; align-items: center; justify-content: center; }
.rb-tirador { position: absolute; right: -5px; bottom: -5px; width: 9px; height: 9px; background: #e0b400; border: 1px solid #fff; cursor: nwse-resize; }
.rb-fila { display: flex; gap: 8px; }
#props .agregar { flex-wrap: wrap; }
#props .agregar button { white-space: nowrap; }
.rb-fila > * { flex: 1; min-width: 0; }
/* V66k4: consultas */
.q-titulo { font-size: 15px; margin-bottom: 4px; }
.q-titulo span { color: var(--suave); font-size: 12px; }
.q-barra { position: sticky; top: -14px; left: 0; z-index: 5; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; background: var(--fondo); padding: 6px 0 10px; }
.q-barra .total { font-weight: 600; }
.q-barra .total.excede { color: var(--peligro); }
.q-ayuda { color: var(--suave); font-size: 12px; }
.q-marco { padding: 8px 0 12px; overflow-x: auto; }
.q-grilla { position: relative; display: inline-flex; background: #fff; border: 1px solid var(--borde); border-radius: 6px; box-shadow: 0 1px 2px #0001; }
.q-col { box-sizing: border-box; flex: 0 0 auto; border-right: 1px solid #e3e7eb; position: relative; min-width: 0; }
.q-cab { padding: 6px 8px; background: #f6f8fa; border-bottom: 1px solid var(--borde); cursor: grab; min-height: 62px; box-sizing: border-box; overflow: hidden; }
.q-cab .t { font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.q-cab .f { margin-top: 4px; height: 22px; box-sizing: border-box; border: 1px solid #cfd6dd; border-radius: 4px; background: #fff; font-size: 11px; color: #9aa5b1; padding: 3px 5px; white-space: nowrap; overflow: hidden; }
.q-cab .a { font-size: 10px; color: var(--suave); margin-top: 3px; white-space: nowrap; }
.q-col.auto .q-cab { background: repeating-linear-gradient(45deg, #f6f8fa 0 6px, #e9edf1 6px 12px); }
.q-col.sel .q-cab { background: var(--sel); }
.q-col.mal .q-cab .t { color: var(--peligro); }
.q-acc .q-cab { cursor: default; }
.q-celda { padding: 6px 8px; font-size: 12px; border-bottom: 1px solid #eef1f4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #334; }
.q-celda.num { text-align: right; }
.q-celda.enl { color: var(--acento); text-decoration: underline; }
.q-tirador { position: absolute; top: 0; right: -4px; width: 8px; height: 62px; cursor: col-resize; z-index: 2; }
.q-tirador:hover { background: var(--acento); opacity: .45; }
.q-col.drop-izq { box-shadow: inset 3px 0 0 var(--acento); }
.q-col.drop-der { box-shadow: inset -3px 0 0 var(--acento); }
.q-guia { position: absolute; top: -8px; bottom: -8px; border-left: 2px dashed var(--peligro); pointer-events: none; z-index: 3; }
.q-guia span { position: absolute; bottom: -18px; left: 4px; font-size: 11px; color: var(--peligro); white-space: nowrap; }
textarea.q-sql { width: 100%; box-sizing: border-box; font: 12px/1.4 Consolas, "Cascadia Mono", monospace; border: 1px solid var(--borde); border-radius: 5px; padding: 5px 7px; resize: vertical; }
button.peligro { color: var(--peligro); }
</style>
</head>
<body>
<div id="barra">
  <span class="marca">OPTIMIST Designer</span>
  <button id="bAbrir" title="Elegir la carpeta del proyecto o src/main/resources/trn">📂 Abrir carpeta</button>
  <button id="bArchivo" title="Abrir un solo YAML (TRN, web panel, impresión o consulta); se graba en el mismo lugar">📄 Abrir archivo</button>
  <select id="lista" disabled><option>— sin carpeta —</option></select>
  <button id="bDeshacer" disabled title="Ctrl+Z">↶ Deshacer</button>
  <button id="bRehacer" disabled title="Ctrl+Y">↷ Rehacer</button>
  <button id="bGuardar" class="primario" disabled title="Ctrl+S">💾 Guardar</button>
  <button id="bClases" title="Crear o cambiar clases (estilos con nombre) y ver cómo quedan">🎨 Clases</button>
  <span class="orden"><button id="bVoz" title="Dictale al diseñador: «poné AlmacenesDescrip en negrita»">🎤</button><input id="orden" type="text" placeholder="Decime qué hacer… (ej: poné AlmacenesDescrip en negrita)"></span>
  <span class="estado" id="estado"></span>
</div>
<div id="cuerpo">
  <div class="panel" id="izq"><div class="titulo-panel">Estructura</div><div id="arbol"></div></div>
  <div id="centro"></div>
  <div class="panel" id="props"><div class="vacio-props">Elegí un elemento del árbol o del formulario para ver sus propiedades.</div></div>
</div>
<div id="pie"><span id="pieInfo">Arrastrá campos para moverlos · Botón derecho para sus propiedades rápidas</span><span id="pieErr" class="err"></span></div>
<div id="menu"></div>
<input type="file" id="inArchivo" accept=".yaml,.yml" hidden>

<script>
"use strict";
/* ============================================================================================
   OPTIMIST Designer · diseñador de TRN de OPTIMIST ERP (programa aparte, se abre en Chrome o Edge)
   - Lee los YAML de src/main/resources/trn, muestra el formulario y el WorkWith.
   - Arrastrar y soltar campos, detalles y solapas; botón derecho = propiedades rápidas;
     panel de propiedades (como el de WorkWithPlus).
   - Guardar: SOLO reescribe lo que cambió (cada campo modificado, el bloque pantalla, las
     columnas del WorkWith, títulos). Comentarios, orden y formato del resto quedan igual.
   ============================================================================================ */

const $ = (s, el = document) => el.querySelector(s);
function h(tag, attrs, ...hijos) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'style') e.style.cssText = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k === 'text') e.textContent = v;
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const c of hijos.flat()) if (c != null && c !== false) e.append(c.nodeType ? c : document.createTextNode(String(c)));
  return e;
}
function aviso(msg, error) {
  const t = h('div', { class: 'toast' + (error ? ' err' : '') }, msg);
  document.body.append(t); setTimeout(() => t.remove(), error ? 6000 : 2500);
}

// ------------------------------------------------------------------ estado
let dir = null;           // carpeta trn (FileSystemDirectoryHandle)
let archivos = [];        // [{nombre, handle}]
let A = null;             // archivo abierto: {nombre, handle, texto, orig, m, hist, fut, bak}
let sel = null;           // selección: {tipo, ...}
let vista = 'form';       // 'form' | 'ww'
let solapaAct = 0;
const cerrados = new Set(); // nodos del árbol cerrados
let CLASES_POS = null;    // V48e: dónde quedó la ventana de clases (se puede arrastrar)
let CLASE_ED = null;      // V48e: clase en edición {nombre, orig, donde: 'trn'|'global', est, campo: {nivel, nombre}|null, usar}

// ------------------------------------------------------------------ YAML: lectura
const FLAGS = ['clave', 'autonumerico', 'inferido', 'oculto', 'soloLectura', 'obligatorio', 'nulo', 'guardar'];

function modelar(texto) {
  const doc = YAML.parseDocument(texto);
  if (doc.errors.length) throw new Error('El YAML tiene errores: ' + doc.errors[0].message.split('\n')[0]);
  const js = doc.toJS() || {};
  const rangos = { campos: {}, top: {}, detTitulo: {}, pantalla: null, columnas: null, anchos: null, ocultas: null, filtro: null, workwith: null };
  const leerCampos = (seq, nivel) => (seq && seq.items ? seq.items : []).map(n => {
    const vals = {}, src = {};
    for (const p of n.items || []) {
      const k = String(p.key && p.key.value);
      vals[k] = p.value ? p.value.toJSON() : null;
      if (p.value && p.value.range) {
        // V49u: un valor en bloque (ej. 'lupa:' en varios renglones) se reescribe en una línea {…}: el campo se graba como {…}
        const bloque = (YAML.isMap(p.value) || YAML.isSeq(p.value)) && !p.value.flow;

    top: {},
    campos: leerCampos(doc.get('campos'), '#cab'),
    detalles: [],
    pantalla: typeof js.pantalla === 'string' ? leerPantalla(js.pantalla) : null,
    ww: { columnas: [], anchos: {}, ocultas: [], filtro: [], clases: {}, clase: null },
    orden: leerOrden(js.orden),   // V66: [{campo, desc}] (antes solo se mostraba)
    transaccion: js.transaccion, tabla: js.tabla,
    dominios: (js.dominios && typeof js.dominios === 'object') ? js.dominios : {},
    clases: (js.clases && typeof js.clases === 'object') ? js.clases : {},   // V45: clases de campo de la TRN
    clase: js.clase == null ? null : String(js.clase),                        // V45: clase de los campos de la cabecera
    // V49o: campos con una regla "X.Visible = ..." (ej. las columnas que muestra VERCampo): el motor los muestra según la regla
    porRegla: [...new Set([...String(js.reglas || '').matchAll(/^[ \t]*([A-Za-z_]\w*)\s*\.\s*Visible\s*=/gmi)].map(x => x[1].toLowerCase()))],
    // V64c: la condición de cada regla "X.Visible = ..." (para mostrarla en el formulario)
    visibleRegla: Object.fromEntries([...String(js.reglas || '').matchAll(/^[ \t]*([A-Za-z_]\w*)\s*\.\s*Visible\s*=\s*([^;\n]+)/gmi)].map(x => [x[1].toLowerCase(), x[2].trim()]))
  };
  for (const k of ['titulo', 'singular', 'plural', 'genero', 'encabezado']) {
    m.top[k] = js[k] == null ? '' : String(js[k]);
    const n = doc.get(k, true);
    if (n && n.range) rangos.top[k] = [n.range[0], n.range[1]];
  }
  const dets = doc.get('detalles');
  for (const dn of (dets && dets.items) || []) {
    const nom = String(dn.get('nombre'));
    const tn = dn.get('titulo', true);   // V65f: dónde está el título del detalle (para grabarlo si se cambia)
    if (tn && tn.range) rangos.detTitulo[nom] = [tn.range[0], tn.range[1]];
    m.detalles.push({ nombre: nom, titulo: String(dn.get('titulo') ?? nom), oculto: !!dn.get('oculto'), numerador: dn.get('numerador') || null,
                      clase: dn.get('clase') == null ? null : String(dn.get('clase')), campos: leerCampos(dn.get('campos'), nom) });
  }
  const pn = doc.get('pantalla', true);
  if (pn && pn.range) rangos.pantalla = [pn.range[0], pn.range[1]];
  const on = doc.get('orden', true);   // V66
  if (on && on.range) rangos.orden = [on.range[0], on.range[1]];
  const ww = doc.get('workwith', true);
  if (ww && ww.range) rangos.workwith = [ww.range[0], ww.range[2]];
  if (ww && ww.get) {
    const c = ww.get('columnas', true);
    if (c && c.range) rangos.columnas = [c.range[0], c.range[1]];
    const a = ww.get('anchos', true);
    if (a && a.range) rangos.anchos = [a.range[0], a.range[1]];
    const oc = ww.get('ocultas', true);
    if (oc && oc.range) rangos.ocultas = [oc.range[0], oc.range[1]];
    const fi = ww.get('filtro', true);
    if (fi && fi.range) rangos.filtro = [fi.range[0], fi.range[1]];
    const wc = ww.get('clases', true);   // V48e: clases propias del WorkWith
    if (wc && wc.range) rangos.wwClases = [wc.range[0], wc.range[1]];
    const wk = ww.get('clase', true);
    if (wk && wk.range) rangos.wwClase = [wk.range[0], wk.range[1]];
  }
  // V48e: clases del WorkWith (propias, no las del campo en el formulario): por columna y de toda la grilla
  for (const [k, v] of Object.entries((js.workwith && js.workwith.clases) || {})) if (v != null && v !== '') m.ww.clases[k] = Array.isArray(v) ? v.join(', ') : String(v);
  m.ww.clase = js.workwith && js.workwith.clase != null ? String(js.workwith.clase) : null;
  // V43: filtro fijo del WorkWith: [{campo, op, valor}] ("&Empresa", ">0"...)
  for (const [k, v] of Object.entries((js.workwith && js.workwith.filtro) || {})) {
    const s = String(v), mm = s.match(/^\s*(<>|!=|>=|<=|>|<|=)\s*(.+)$/);
    m.ww.filtro.push(mm ? { campo: k, op: mm[1] === '!=' ? '<>' : mm[1], valor: mm[2].trim() } : { campo: k, op: '=', valor: s });
  }
  // V41: campos que el WorkWith trae pero no muestra
  const ocs = js.workwith && js.workwith.ocultas;
  m.ww.ocultas = Array.isArray(ocs) ? ocs.map(x => String(x).trim()) : ocs ? String(ocs).split(',').map(x => x.trim()).filter(Boolean) : [];
  for (const c of (js.workwith && js.workwith.columnas) || []) {
    if (c && typeof c === 'object') { const [k, v] = Object.entries(c)[0]; m.ww.columnas.push({ campo: k, titulo: v == null ? '' : String(v) }); }
    else { const s = String(c); const i = s.indexOf(':'); m.ww.columnas.push(i < 0 ? { campo: s.trim(), titulo: '' } : { campo: s.slice(0, i).trim(), titulo: s.slice(i + 1).trim() }); }
  }
  for (const [k, v] of Object.entries((js.workwith && js.workwith.anchos) || {})) m.ww.anchos[k] = String(v);
  return { m, rangos };
}

// pantalla: texto -> estructura
function leerPantalla(txt) {
  const raiz = { items: [] }, pila = [raiz];
  let tabla = null, implicita = false;
  const tope = () => pila[pila.length - 1];
  const cerrarImplicita = () => { if (implicita) { tabla = null; implicita = false; } };
  const cerrar = tipo => { cerrarImplicita(); tabla = null; for (let i = pila.length - 1; i > 0; i--) if (pila[i].t === tipo) { pila.length = i; return; } };
  for (const crudo of txt.split('\n')) {
    let s = crudo.trim();
    if (!s) continue;
    let m;
    // <fin panel> y </panel> = <endpanel> (igual para tabla, solapa y renglon)
    if ((m = s.match(/^<\s*(?:fin\s+|\/)(\w+)\s*>$/i))) s = '<end' + m[1].toLowerCase() + '>';
    if (s.startsWith('#')) { cerrarImplicita(); (tabla ? tabla.coments = (tabla.coments || []).concat(s) : tope().items.push({ t: 'coment', texto: s })); continue; }
    if ((m = s.match(/^<solapa\s+(.*)>$/i))) { cerrarImplicita(); tabla = null; pila.length = 1; const so = { t: 'solapa', titulo: m[1].trim(), items: [] }; tope().items.push(so); pila.push(so); continue; }
    if (/^<endsolapa>$/i.test(s)) { cerrar('solapa'); continue; }
    if ((m = s.match(/^<panel(\s[^>]*)?>$/i))) {
      cerrarImplicita(); tabla = null;
      const pa = { t: 'panel', titulo: '', abierto: true, ancho: '', items: [] }, tit = [];
      for (const tok of (m[1] || '').trim().split(/\s+/).filter(Boolean)) {
        if (/^cerrado$/i.test(tok)) pa.abierto = false;
        else if (/^abierto$/i.test(tok)) pa.abierto = true;
        else if (/^ocultarVacio$/i.test(tok)) pa.ocultarVacio = true;   // V49t
        else if (/^ancho=/i.test(tok)) pa.ancho = tok.slice(6);
        else if (/^alinear=/i.test(tok)) pa.alinear = tok.slice(8).toLowerCase();
        else tit.push(tok);
      }
      pa.titulo = tit.join(' ');
      tope().items.push(pa); pila.push(pa); continue;
    }
    if (/^<endpanel>$/i.test(s)) { cerrar('panel'); continue; }
    if (/^<rengl[oó]n>$/i.test(s)) { cerrarImplicita(); tabla = null; const r = { t: 'renglon', items: [] }; tope().items.push(r); pila.push(r); continue; }
    if (/^<endrengl[oó]n>$/i.test(s)) { cerrar('renglon'); continue; }
    if ((m = s.match(/^<tabla(\s[^>]*)?>$/i))) { cerrarImplicita(); tabla = Object.assign({ t: 'tabla', filas: [] }, opcionesTabla(m[1] || '')); tope().items.push(tabla); continue; }
    if (/^<end(table|tabla)>$/i.test(s)) { tabla = null; implicita = false; continue; }
    if ((m = s.match(/^<detalle\s+(\S+)((?:\s+\S+)*)\s*>$/i))) {   // V38: <detalle Det completo alinear=derecha>
      cerrarImplicita();
      const de = { t: 'detalle', nombre: m[1] };
      for (const tok of (m[2] || '').trim().split(/\s+/).filter(Boolean)) {
        if (/^completo$/i.test(tok)) de.completo = true;
        else if (/^sintitulo$/i.test(tok)) de.sinTitulo = true;   // V65f
        else if (/^alinear=/i.test(tok)) de.alinear = tok.slice(8).toLowerCase();
      }
      tope().items.push(de); continue;
    }
    if (!tabla) { tabla = { t: 'tabla', implicita: true, filas: [] }; implicita = true; tope().items.push(tabla); }
    tabla.filas.push(s.split(/\s+/).map(tok => {
      if (tok === '-') return { v: 1 };
      const mm = tok.match(/^([A-Za-z_]\w*)(?::(\d+))?$/);
      return mm ? { c: mm[1], n: mm[2] ? +mm[2] : 1 } : { c: tok, n: 1 };
    }));
  }
  return raiz;
}
function opcionesTabla(s) {
  const o = { titulo: '', anchos: '', etiquetas: '', anchoEtiquetas: '', alinear: '' };
  const titulo = [];
  for (const tok of s.trim().split(/\s+/).filter(Boolean)) {
    const m = tok.match(/^(anchos|etiquetas|anchoEtiquetas|alinear)=(.*)$/i);
    if (m) o[m[1].toLowerCase() === 'anchoetiquetas' ? 'anchoEtiquetas' : m[1].toLowerCase()] = m[2];
    else titulo.push(tok);
  }
  o.titulo = titulo.join(' ');
  return o;
}

// ------------------------------------------------------------------ YAML: escritura (solo lo que cambió)
function q(s) {
  s = String(s);
  if (s === '' || /[:#\[\]{},&*!|>'"%@`?\\]/.test(s) || s.trim() !== s || /^(true|false|null|yes|no|on|off|~)$/i.test(s)
      || /^[-+.]?\d/.test(s) || /^[-?]/.test(s))
    return '"' + s.replace(/\\/g, '\\\\').replace(/"/g, '\\"') + '"';
  return s;
}
function escalar(v) {
  if (v === true || v === false) return String(v);
  if (typeof v === 'number') return String(v);
  if (Array.isArray(v)) return '[' + v.map(escalar).join(', ') + ']';
  if (v && typeof v === 'object') return '{' + Object.entries(v).map(([a, b]) => a + ': ' + escalar(b)).join(', ') + '}';
  return q(v);
}
const igual = (a, b) => JSON.stringify(a) === JSON.stringify(b);

function mapaCampo(c, o) {
  // orden: el de las claves originales, después las nuevas
  const claves = Object.keys(o ? o.vals : {}).filter(k => k in c.vals).concat(Object.keys(c.vals).filter(k => !o || !(k in o.vals)));
  return '{' + claves.map(k => k + ': ' + (o && k in o.src && igual(o.vals[k], c.vals[k]) ? o.src[k] : escalar(c.vals[k]))).join(', ') + '}';
}

function textoPantalla(p) {
  const L = [];
  const sp = n => ' '.repeat(n);
  const emitir = (items, ind) => {
    for (const it of items) {
      if (it.t === 'solapa') {
        if (L.length && L[L.length - 1] !== '') L.push('');
        L.push(sp(ind) + '<solapa ' + it.titulo + '>'); emitir(it.items, ind + 2); L.push(sp(ind) + '<endsolapa>');
      } else if (it.t === 'tabla') {
        const ri = it.implicita ? ind : ind + 2;
        if (!it.implicita) {
          const op = [it.titulo, it.anchos && 'anchos=' + it.anchos, it.etiquetas && 'etiquetas=' + it.etiquetas,
                      it.anchoEtiquetas && 'anchoEtiquetas=' + it.anchoEtiquetas, it.alinear && 'alinear=' + it.alinear].filter(Boolean).join(' ');
          L.push(sp(ind) + '<tabla' + (op ? ' ' + op : '') + '>');
        }
        for (const c of it.coments || []) L.push(sp(ri) + c);
        const tx = it.filas.map(f => f.map(c => c.v ? '-' : c.c + (c.n > 1 ? ':' + c.n : '')));
        const w = [];
        tx.forEach(f => f.forEach((t, i) => { w[i] = Math.max(w[i] || 0, t.length + 2); }));
        for (const f of tx) L.push((sp(ri) + f.map((t, i) => i < f.length - 1 ? t.padEnd(w[i]) : t).join('')).trimEnd());
        if (!it.implicita) L.push(sp(ind) + '<endtable>');
      } else if (it.t === 'panel') {
        const op = [it.titulo, it.abierto === false && 'cerrado', it.ancho && 'ancho=' + it.ancho, it.alinear && 'alinear=' + it.alinear, it.ocultarVacio && 'ocultarVacio'].filter(Boolean).join(' ');
        L.push(sp(ind) + '<panel' + (op ? ' ' + op : '') + '>'); emitir(it.items, ind + 2); L.push(sp(ind) + '<endpanel>');
      } else if (it.t === 'renglon') {
        L.push(sp(ind) + '<renglon>'); emitir(it.items, ind + 2); L.push(sp(ind) + '<endrenglon>');
      } else if (it.t === 'detalle') L.push(sp(ind) + '<detalle ' + [it.nombre, it.completo && 'completo', it.sinTitulo && 'sinTitulo', it.alinear && 'alinear=' + it.alinear].filter(Boolean).join(' ') + '>');
      else if (it.t === 'coment') L.push(sp(ind) + it.texto);
    }
  };
  emitir(p.items, 2);
  return '|\n' + L.join('\n') + '\n';
}

function textoColumnas(ww) {
  return '[' + ww.columnas.map(c => c.titulo ? q(c.campo + ': ' + c.titulo) : c.campo).join(', ') + ']';
}

function generarTexto() {
  const t = A.texto, m = A.m, o = A.orig, r = A.rangos;
  const cambios = [];     // {ini, fin, txt}
  const todos = (mm) => mm.campos.concat(...mm.detalles.map(d => d.campos));
  const origPor = new Map(todos(o).map(c => [c.nivel + '|' + c.vals.nombre, c]));
  // V49o: el orden de las columnas de un detalle es el orden de sus campos: si cambió, cada renglón de campo del YAML
  // (en su lugar de siempre) recibe el campo que ahora va en esa posición
  const reordenados = new Set();
  for (const d of m.detalles) {
    const od = o.detalles.find(x => x.nombre === d.nombre); if (!od) continue;
    const a = d.campos.map(c => c.vals.nombre), b = od.campos.map(c => c.vals.nombre);
    if (igual(a, b) || a.length !== b.length || !od.campos.every(c => r.campos[d.nombre + '|' + c.vals.nombre])) continue;
    reordenados.add(d.nombre);
    const lugares = od.campos.map(c => r.campos[d.nombre + '|' + c.vals.nombre]).sort((x, y) => x[0] - y[0]);
    d.campos.forEach((c, i) => {
      const k = d.nombre + '|' + c.vals.nombre, oc = origPor.get(k);
      const txt = oc && !igual(oc.vals, c.vals) ? mapaCampo(c, oc) : t.slice(r.campos[k][0], r.campos[k][1]);
      cambios.push({ ini: lugares[i][0], fin: lugares[i][1], txt });
    });
  }
  for (const c of todos(m)) {
    if (reordenados.has(c.nivel)) continue;
    const k = c.nivel + '|' + c.vals.nombre, oc = origPor.get(k);
    if (oc && !igual(oc.vals, c.vals) && r.campos[k]) cambios.push({ ini: r.campos[k][0], fin: r.campos[k][1], txt: mapaCampo(c, oc) });
  }
  // V65f: el título de cada detalle (el que se ve arriba de su grilla y en los mensajes)
  for (const d of m.detalles) {
    const od = o.detalles.find(x => x.nombre === d.nombre);
    if (od && od.titulo !== d.titulo && r.detTitulo[d.nombre] && d.titulo.trim()) cambios.push({ ini: r.detTitulo[d.nombre][0], fin: r.detTitulo[d.nombre][1], txt: q(d.titulo.trim()) });
  }
  const faltan = [];
  for (const k of Object.keys(m.top)) {
    if (m.top[k] === o.top[k]) continue;
    if (r.top[k]) cambios.push({ ini: r.top[k][0], fin: r.top[k][1], txt: m.top[k] === '' ? '""' : q(m.top[k]) });
    else if (m.top[k] !== '') faltan.push(k + ': ' + q(m.top[k]));
  }
  if (faltan.length) {
    const ancla = r.top.titulo || r.top.singular;
    const fin = ancla ? t.indexOf('\n', ancla[1]) : -1;
    if (fin >= 0) cambios.push({ ini: fin, fin: fin, txt: '\n' + faltan.join('\n') });
  }
  if (!igual(m.pantalla, o.pantalla) && m.pantalla) {
    if (r.pantalla) cambios.push({ ini: r.pantalla[0], fin: r.pantalla[1], txt: textoPantalla(m.pantalla) });
    else {
      const w = t.search(/^workwith:/m);
      const pos = w >= 0 ? w : t.length;
      cambios.push({ ini: pos, fin: pos, txt: 'pantalla: ' + textoPantalla(m.pantalla) });
    }
  }
  if (!igual(m.ww.columnas, o.ww.columnas) && r.columnas)
    cambios.push({ ini: r.columnas[0], fin: r.columnas[1], txt: textoColumnas(m.ww) });
  if (!igual(m.ww.anchos, o.ww.anchos)) {
    const hay = Object.keys(m.ww.anchos).length;
    const txt = '{' + Object.entries(m.ww.anchos).map(([k, v]) => k + ': ' + v).join(', ') + '}';
    if (r.anchos) {
      if (hay) cambios.push({ ini: r.anchos[0], fin: r.anchos[1], txt });
      else { // borrar el renglón entero de anchos
        const ini = t.lastIndexOf('\n', r.anchos[0]), fin = t.indexOf('\n', r.anchos[1]);
        cambios.push({ ini, fin: fin < 0 ? t.length : fin, txt: '' });
      }
    } else if (hay && r.columnas) {
      const fin = t.indexOf('\n', r.columnas[1]);
      cambios.push({ ini: fin < 0 ? t.length : fin, fin: fin < 0 ? t.length : fin, txt: '\n  anchos: ' + txt });
    }
  }
  if (!igual(m.orden, o.orden)) {   // V66: orden inicial del WorkWith (renglón 'orden:' de arriba de todo)
    const txt = '[' + m.orden.map(x => x.campo + (x.desc ? ' DESC' : '')).join(', ') + ']';
    if (r.orden) {
      if (m.orden.length) cambios.push({ ini: r.orden[0], fin: r.orden[1], txt });
      else {   // sin orden: se borra el renglón entero
        const ini = t.lastIndexOf('\n', r.orden[0]), fin = t.indexOf('\n', r.orden[1]);
        cambios.push({ ini: Math.max(0, ini), fin: fin < 0 ? t.length : fin, txt: '' });
      }
    } else if (m.orden.length) {
      // va después del bloque workwith (como en las TRN que ya lo tienen); si no hay, al final
      let pos = t.length;
      if (r.workwith) { const re = /\n(?=[A-Za-z_])/g; re.lastIndex = r.workwith[0]; const mm = re.exec(t); if (mm) pos = mm.index + 1; }
      cambios.push({ ini: pos, fin: pos, txt: (pos === t.length && !t.endsWith('\n') ? '\n' : '') + 'orden: ' + txt + (pos === t.length ? '' : '\n') });
    }
  }
  if (!igual(m.ww.filtro, o.ww.filtro)) {   // V43
    const hay = m.ww.filtro.length;
    const val = f => { const v = (f.op === '=' ? '' : f.op) + f.valor; return /^-?\d+(\.\d+)?$/.test(v) ? v : '"' + v.replace(/"/g, '\\"') + '"'; };
    const txt = '{' + m.ww.filtro.map(f => f.campo + ': ' + val(f)).join(', ') + '}';
    if (r.filtro) {
      if (hay) cambios.push({ ini: r.filtro[0], fin: r.filtro[1], txt });
      else {
        const ini = t.lastIndexOf('\n', r.filtro[0]), fin = t.indexOf('\n', r.filtro[1]);
        cambios.push({ ini, fin: fin < 0 ? t.length : fin, txt: '' });
      }
    } else if (hay && r.columnas) {
      const fin = t.indexOf('\n', r.columnas[1]);
      cambios.push({ ini: fin < 0 ? t.length : fin, fin: fin < 0 ? t.length : fin, txt: '\n  filtro: ' + txt });
    }
  }
  if (!igual(m.ww.clases, o.ww.clases)) {   // V48e
    const cl = Object.entries(m.ww.clases).filter(([k, v]) => v && m.ww.columnas.some(c => c.campo === k));
    const txt = '{' + cl.map(([k, v]) => k + ': ' + (listaClases(v).length > 1 ? '[' + listaClases(v).join(', ') + ']' : q(listaClases(v)[0]))).join(', ') + '}';
    if (r.wwClases) {
      if (cl.length) cambios.push({ ini: r.wwClases[0], fin: r.wwClases[1], txt });
      else { const ini = t.lastIndexOf('\n', r.wwClases[0]), fin = t.indexOf('\n', r.wwClases[1]); cambios.push({ ini, fin: fin < 0 ? t.length : fin, txt: '' }); }
    } else if (cl.length && r.columnas) {
      const fin = t.indexOf('\n', r.columnas[1]);
      cambios.push({ ini: fin < 0 ? t.length : fin, fin: fin < 0 ? t.length : fin, txt: '\n  clases: ' + txt });
    }
  }
  if (m.ww.clase !== o.ww.clase) {   // V48e
    if (r.wwClase) {
      if (m.ww.clase) cambios.push({ ini: r.wwClase[0], fin: r.wwClase[1], txt: q(m.ww.clase) });
      else { const ini = t.lastIndexOf('\n', r.wwClase[0]), fin = t.indexOf('\n', r.wwClase[1]); cambios.push({ ini, fin: fin < 0 ? t.length : fin, txt: '' }); }
    } else if (m.ww.clase && r.columnas) {
      const fin = t.indexOf('\n', r.columnas[1]);
      cambios.push({ ini: fin < 0 ? t.length : fin, fin: fin < 0 ? t.length : fin, txt: '\n  clase: ' + q(m.ww.clase) });
    }
  }
  if (!igual(m.ww.ocultas, o.ww.ocultas)) {   // V41
    const hay = m.ww.ocultas.length, txt = '[' + m.ww.ocultas.join(', ') + ']';
    if (r.ocultas) {
      if (hay) cambios.push({ ini: r.ocultas[0], fin: r.ocultas[1], txt });
      else {
        const ini = t.lastIndexOf('\n', r.ocultas[0]), fin = t.indexOf('\n', r.ocultas[1]);
        cambios.push({ ini, fin: fin < 0 ? t.length : fin, txt: '' });
      }
    } else if (hay && r.columnas) {
      const fin = t.indexOf('\n', r.columnas[1]);
      cambios.push({ ini: fin < 0 ? t.length : fin, fin: fin < 0 ? t.length : fin, txt: '\n  ocultas: ' + txt });
    }
  }
  cambios.sort((a, b) => b.ini - a.ini);
  let s = t;
  for (const c of cambios) s = s.slice(0, c.ini) + c.txt + s.slice(c.fin);
  // V48e: clases de la TRN (se cambia solo el renglón de cada clase; los comentarios quedan)
  if (!igual(m.clases || {}, o.clases || {})) s = editarClasesEnTexto(s, difClases(o.clases || {}, m.clases || {}), /^campos:/m);
  return s;
}

// ------------------------------------------------------------------ validación (la del motor, en lo que toca el diseñador)
function validar(m) {
  const errores = [], avisos = [];
  const cab = new Map(m.campos.map(c => [c.vals.nombre, c]));
  const vistos = new Set(), detsPant = new Set();
  const detNombres = new Set(m.detalles.map(d => d.nombre));
  const recorrer = items => {
    for (const it of items) {
      if (it.items) recorrer(it.items);
      else if (it.t === 'detalle') {
        if (!detNombres.has(it.nombre)) errores.push('La pantalla usa el detalle ' + it.nombre + ', que no existe');
        if (detsPant.has(it.nombre)) errores.push('El detalle ' + it.nombre + ' está dos veces en la pantalla');
        detsPant.add(it.nombre);
      } else if (it.t === 'tabla') for (const f of it.filas) for (const c of f) {
        if (c.v) continue;
        if (!cab.has(c.c)) errores.push('La pantalla usa ' + c.c + ', que no es un campo de la cabecera');
        else if (vistos.has(c.c)) errores.push(c.c + ' está dos veces en la pantalla');
        vistos.add(c.c);
      }
    }
  };
  if (m.pantalla) recorrer(m.pantalla.items);
  const wv = new Set();
  for (const c of m.ww.columnas) {
    const f = cab.get(c.campo);
    if (!f) errores.push('WorkWith: ' + c.campo + ' no es un campo de la cabecera');
    else if (f.vals.formula && !f.vals.guardar) errores.push('WorkWith: ' + c.campo + ' es fórmula (no se puede mostrar)');
    if (wv.has(c.campo)) errores.push('WorkWith: ' + c.campo + ' está repetida');
    wv.add(c.campo);
  }
  for (const k of m.ww.ocultas) {   // V41
    const f = cab.get(k);
    if (!f) errores.push('WorkWith: oculta ' + k + ', que no es un campo de la cabecera');
    else if (f.vals.formula) errores.push('WorkWith: oculta ' + k + ' es fórmula');
    if (wv.has(k)) errores.push('WorkWith: ' + k + ' está en columnas y en ocultas');
  }
  for (const [k, v] of Object.entries(m.ww.anchos)) {
    if (!wv.has(k)) errores.push('WorkWith: ancho de ' + k + ', que no es una columna');
    if (!/^\d{1,4}(px|em|rem|ch|%)?$/.test(v)) errores.push('WorkWith: ancho inválido "' + v + '" en ' + k + ' (ej. 120px)');
  }
  if (m.pantalla) for (const c of m.campos) {
    const v = c.vals;
    if (!vistos.has(v.nombre) && !v.oculto && !v.clave && !v.formula && !v.inferido)
      avisos.push(v.nombre);
  }
  // V45: clases de campo que no existen (el motor no abriría la TRN)
  const cls = clasesDisponibles();
  // V49o: una clase que el archivo ya usaba no frena el guardado (con "Abrir archivo" puede no estar leído dominios.yaml)
  const yaUsadas = new Set();
  if (A && A.orig) for (const c of A.orig.campos.concat(...A.orig.detalles.map(d => d.campos))) for (const k of listaClases(c.vals.clase)) yaUsadas.add(k.toLowerCase());
  for (const c of m.campos.concat(...m.detalles.map(d => d.campos)))
    for (const k of listaClases(c.vals.clase))
      if (!buscarClase(cls, k) && !yaUsadas.has(k.toLowerCase())) errores.push(c.vals.nombre + ': la clase ' + k + ' no existe (se definen en dominios.yaml o en "clases:" de la TRN)');
  for (const [col, v] of Object.entries(limpiasWW(m)))   // V48e
    for (const k of listaClases(v)) if (!buscarClase(cls, k)) errores.push('WorkWith, columna ' + col + ': la clase ' + k + ' no existe');
  if (m.ww.clase && !/^ninguna$/i.test(m.ww.clase) && !buscarClase(cls, m.ww.clase)) errores.push('WorkWith: la clase ' + m.ww.clase + ' no existe');
  return { errores, avisos };
}

/** Aplica los cambios al bloque "clases:" del texto: cambia, agrega o borra el renglón de cada clase; el resto queda igual. */
function editarClasesEnTexto(texto, cambios, ancla) {

  const esc = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  let i = L.findIndex(l => /^clases:\s*(#.*)?$/.test(l));

    let viejas = {}; try { viejas = (YAML.parse(L[enLinea]) || {}).clases || {}; } catch {}
    L.splice(enLinea, 1, 'clases:', ...Object.entries(viejas).map(([k, v]) => '  ' + q(k) + ': ' + flowClase(v)));

  const primera = L.slice(i + 1, finBloque()).find(l => l.trim() && !l.trim().startsWith('#'));
  const sangria = primera ? primera.match(/^\s*/)[0] : '  ';

    const j = finBloque();

    const p = L.slice(i + 1, j).findIndex(l => re.test(l));

      const ini = i + 1 + p;
      let fin = ini + 1;
      while (fin < j && (L[fin].trim() === '' || ind(L[fin]) > ind(L[ini]))) fin++;
      while (fin > ini + 1 && L[fin - 1].trim() === '') fin--;
      if (v) L.splice(ini, fin - ini, sangria + q(k) + ': ' + flowClase(v)); else L.splice(ini, fin - ini);
    } else if (v) L.splice(j, 0, sangria + q(k) + ': ' + flowClase(v));
  }
  if (!L.slice(i + 1, finBloque()).some(l => l.trim())) L.splice(i, 1);   // bloque vacío: se saca "clases:"
  return L.join('\n');
}

/** Graba cambios de clases en dominios.yaml: relee el archivo, cambia solo esos renglones, controla que el YAML quede sano. */
async function grabarDominios(cambios) {
  try {
    if (!DOM_HANDLE) DOM_HANDLE = await leerGuardado('dominios');
    if (!DOM_HANDLE) {
      if (!window.showOpenFilePicker) { aviso('Abrí la carpeta del proyecto (📂) para poder grabar en dominios.yaml.', true); return false; }
      aviso('Elegí el archivo dominios.yaml (src/main/resources)');
      const [fh] = await showOpenFilePicker({ id: 'optimist-dominios', types: [{ description: 'dominios.yaml', accept: { 'text/yaml': ['.yaml', '.yml'] } }] });
      if (!/^dominios\.ya?ml$/i.test(fh.name)) { aviso('Ese archivo no es dominios.yaml', true); return false; }
      DOM_HANDLE = fh; guardarClave('dominios', fh);
    }
    if (DOM_HANDLE.queryPermission && await DOM_HANDLE.queryPermission({ mode: 'readwrite' }) !== 'granted'
        && await DOM_HANDLE.requestPermission({ mode: 'readwrite' }) !== 'granted') { aviso('Sin permiso para grabar dominios.yaml', true); return false; }
    const viejo = await (await DOM_HANDLE.getFile()).text();
    const nuevo = editarClasesEnTexto(viejo, cambios, /^dominios:/m);
    const js = YAML.parse(nuevo) || {};
    const cl = (js.clases && typeof js.clases === 'object') ? js.clases : {};
    for (const [k, v] of Object.entries(cambios)) {
      const hay = Object.keys(cl).find(x => x.toLowerCase() === k.toLowerCase());
      if (v ? !hay || !igual(normalEst(cl[hay]), normalEst(v)) : !!hay) throw new Error('el archivo generado no quedó bien (clase ' + k + ')');
    }
    if (!DOM_BAK && DOM_DIR) {   // copia del original, una vez por sesión
      const b = await DOM_DIR.getFileHandle('dominios.yaml.bak', { create: true });
      const wb = await b.createWritable(); await wb.write(viejo); await wb.close(); DOM_BAK = true;
    }
    const w = await DOM_HANDLE.createWritable(); await w.write(nuevo); await w.close();
    DOM_GLOBALES.clases = cl;
    try { localStorage.setItem('optimist-dominios', JSON.stringify(DOM_GLOBALES)); } catch {}
    return true;
  } catch (e) {
    if (e && e.name === 'AbortError') return false;
    aviso('No se pudo grabar dominios.yaml: ' + e.message, true);
    return false;
  }
}

function camposMencionados(txt) {

    else if (/ancho (normal|automatico)/.test(t)) { fijar('ancho', ''); hechos.push('ancho automático'); }

  const nombres = new Set();
  for (const v of m.variables) {
    if (!/^[A-Za-z_][A-Za-z0-9_]*$/.test(v.nombre)) err.push('nombre de variable inválido: ' + v.nombre);
    if (nombres.has(v.nombre.toLowerCase())) err.push('variable repetida: ' + v.nombre);
    nombres.add(v.nombre.toLowerCase());
    if (!v.dominio) err.push(v.nombre + ': falta el dominio');
  }
  for (const r of m.pantalla) for (const x of r) if (!esSecc(r) && !nombres.has(x.toLowerCase())) err.push('la pantalla usa ' + x + ', que no es una variable');
  for (const b of m.botones) if (!b.titulo || !b.evento) err.push('botón sin título o sin evento');
  for (const p of m.prompts) {
    if (!p.variable || !nombres.has(String(p.variable).toLowerCase())) err.push('lupa de una variable que no está: ' + p.variable);
    if (!p.tabla) err.push('lupa de ' + p.variable + ': falta la tabla');
    if (!p.devuelve || !Object.keys(p.devuelve).length) err.push('lupa de ' + p.variable + ': falta qué devuelve');
  }
  return err;
}

// ---------- texto: solo se reemplazan las secciones que cambiaron (el resto del archivo queda letra por letra igual)
function textoPanel() {
  const m = P.m, o = P.orig;
  const ordenarVar = v => {
    const r = {};
    for (const k of VAR_ORDEN) if (v[k] != null && v[k] !== '') r[k] = v[k];
    for (const [k, x] of Object.entries(v)) if (!VAR_ORDEN.includes(k) && x != null && x !== '' && x !== false) r[k] = x;
    return r;
  };
  // el texto de una sección sola ("clave: ..."), con el mismo formato que usa el resto del archivo
  const seccion = (k, armar) => {
    const d = new YAML.Document({});
    d.set(k, armar(d));
    return d.toString({ lineWidth: 0, flowCollectionPadding: false }).replace(/\n+$/, '');
  };
  const flujo = (d, v) => { const n = d.createNode(v); if (n && n.items) n.flow = true; return n; };
  const cambios = [];   // [clave, texto | null (borrar)]
  if (m.titulo !== o.titulo) cambios.push(['titulo', seccion('titulo', () => m.titulo)]);
  if (!igual(m.parm, o.parm)) cambios.push(['parm', seccion('parm', d => flujo(d, m.parm))]);
  if (!igual(m.variables, o.variables)) cambios.push(['variables', seccion('variables', d => {
    const s = d.createNode([]); for (const v of m.variables) s.items.push(flujo(d, ordenarVar(v))); return s; })]);
  if (!igual(m.pantalla, o.pantalla)) cambios.push(['pantalla', seccion('pantalla', d => {
    const s = d.createNode([]);
    for (const r of m.pantalla) {
      if (esSecc(r)) { const n = d.createNode({ seccion: r[0].slice(1) }); n.flow = true; s.items.push(n); }   // V66t
      else s.items.push(flujo(d, r));
    }
    return s; })]);
  if (!igual(m.prompts, o.prompts)) cambios.push(['prompts', !m.prompts.length ? null : seccion('prompts', d => {
    const s = d.createNode([]);
    for (const p0 of m.prompts) {
      const p = {};   // en el orden de siempre y sin lo vacío
      for (const k of ['variable', 'tabla', 'codigo', 'descripcion', 'donde', 'devuelve']) if (p0[k] != null && p0[k] !== '') p[k] = p0[k];
      for (const [k, x] of Object.entries(p0)) if (!(k in p) && x != null && x !== '') p[k] = x;
      const n = d.createNode(p); for (const it of n.items) if (it.value && it.value.items) it.value.flow = true; s.items.push(n); }
    return s; })]);
  if (!igual(m.botones, o.botones)) cambios.push(['botones', seccion('botones', d => {
    const s = d.createNode([]); for (const b of m.botones) s.items.push(flujo(d, { titulo: b.titulo, evento: b.evento })); return s; })]);
  const bloque = t => d => { const n = d.createNode(t.endsWith('\n') ? t : t + '\n'); n.type = 'BLOCK_LITERAL'; return n; };
  if (m.internas !== o.internas) cambios.push(['internas', seccion('internas', bloque(m.internas))]);
  if (m.eventos !== o.eventos) cambios.push(['eventos', seccion('eventos', bloque(m.eventos))]);

  let txt = P.texto;
  const ubicar = (texto, k) => {   // [desde, hasta) de "k: ..." en el texto (sin el salto final)
    const doc = YAML.parseDocument(texto);
    const par = doc.contents.items.find(x => x.key && x.key.value === k);
    if (!par) return null;
    let hasta = par.value ? par.value.range[1] : par.key.range[1];
    while (hasta > 0 && texto[hasta - 1] === '\n') hasta--;
    return [par.key.range[0], hasta];
  };
  for (const [k, nuevo] of cambios) {
    const r = ubicar(txt, k);
    if (r) {
      if (nuevo == null) { let h2 = r[1]; if (txt[h2] === '\n') h2++; txt = txt.slice(0, r[0]) + txt.slice(h2); }
      else txt = txt.slice(0, r[0]) + nuevo + txt.slice(r[1]);
    } else if (nuevo != null) {   // sección nueva (ej. la primera lupa): después de la pantalla
      const ant = ubicar(txt, k === 'prompts' ? 'pantalla' : 'variables') || [0, txt.length];
      txt = txt.slice(0, ant[1]) + '\n' + nuevo + txt.slice(ant[1]);
    }
  }
  return txt;
}

async function guardarPanel() {
  if (!P || !sucio()) return;
  const errs = validarPanel(P.m);
  if (errs.length) { aviso('No se guardó: ' + errs.join(' · '), true); return; }
  let nuevo;
  try {
    nuevo = textoPanel();
    const r = modelarPanel(nuevo);
    const cmp = x => JSON.stringify({ t: x.titulo, p: x.parm, v: x.variables, s: x.pantalla, b: x.botones, l: x.prompts,
      i: x.internas.replace(/\n+$/, ''), e: x.eventos.replace(/\n+$/, '') });
    if (cmp(r) !== cmp(P.m)) throw new Error('el archivo generado no coincide con el diseño');
  } catch (e) { aviso('No se guardó (' + e.message + '). Avisale a Claude con el nombre del panel.', true); return; }
  try {
    if (P.handle && P.handle.createWritable) {
      if (!await permisoEscritura(P.handle)) { aviso('No se guardó: el navegador no dio permiso para grabar ' + P.nombre, true); return; }
      const dirBak = P.dirBak || WBP_DIR;
      if (!P.bak && dirBak && !P.suelto) {
        const b = await dirBak.getFileHandle(P.nombre + '.bak', { create: true });
        const wb = await b.createWritable(); await wb.write(P.texto); await wb.close(); P.bak = true;
      }
      const w = await P.handle.createWritable(); await w.write(nuevo); await w.close();
      aviso('Guardado ' + P.nombre);
    } else {
      const url = URL.createObjectURL(new Blob([nuevo], { type: 'text/yaml' }));
      const a = h('a', { href: url, download: P.nombre }); document.body.append(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 5000);
      aviso('Se descargó ' + P.nombre + ': copialo sobre el original en src/main/resources/wbp');
    }
  } catch (e) { aviso('No se pudo guardar: ' + e.message, true); return; }
  const hist = P.hist, fut = P.fut, s = sel, bak = P.bak, vp = vistaP, suelto = P.suelto, db = P.dirBak;
  cargarPanel(P.nombre, nuevo, P.handle);
  P.hist = hist; P.fut = fut; P.bak = bak; P.suelto = suelto; P.dirBak = db; sel = s; vistaP = vp; pintar();
}

function editorCodigo(k) {
  const ta = h('textarea', { class: 'codigo', spellcheck: 'false' });
  ta.value = P.m[k];
  ta.addEventListener('keydown', e => {
    if (e.key === 'Tab') {   // tabulador dentro del código (como en GeneXus)
      e.preventDefault();
      const s = ta.selectionStart, f = ta.selectionEnd;
      ta.value = ta.value.slice(0, s) + '\t' + ta.value.slice(f);
      ta.selectionStart = ta.selectionEnd = s + 1;
    }
  });
  // se aplica sin volver a dibujar la pantalla (si no, el clic que sacó el foco, ej. en otra pestaña, se perdía)
  ta.addEventListener('change', () => {
    if (ta.value === P.m[k]) return;
    P.hist.push(JSON.stringify(P.m)); if (P.hist.length > 200) P.hist.shift(); P.fut = [];
    P.m[k] = ta.value;
    pintarBarra(); pintarArbolP();
  });
  const ayuda = k === 'eventos'
    ? 'Código GeneXus de los eventos (Event Start, Event Enter, Event \'DoAlgo\', Event &Variable.IsValid, Sub ...). Se aplica al salir del cuadro.'
    : 'Variables que usan los eventos y no se ven en la pantalla: &Nombre Tipo (ej. &Importe Numeric(14.2)). Se aplica al salir del cuadro.';
  return h('div', { class: 'form' }, h('div', { class: 'coment' }, ayuda), ta);
}

function celdaVar(n, fila, col) {
  const v = varP(n);
  const cl = 'celda' + (v && v.soloLectura ? ' lectura' : '') + (v && v.oculto ? ' oculto' : '') + (!v ? ' error' : '')
    + (esSel({ tipo: 'wvar', nombre: n }) ? ' sel' : '');
  const lupa = P.m.prompts.some(p => String(p.variable).toLowerCase() === n.toLowerCase());
  const d = v ? dominio(v.dominio) : null;
  const et = h('span', { class: 'et', style: v && v.estilo && v.estilo.negrita ? 'font-weight:700' : '' }, v ? (v.etiqueta || n) : n + ' (no existe)');
  const ctl = h('span', { class: 'ctl', style: 'max-width:' + (v ? anchoGrilla(v) : '120px') }, d && d.valores ? '▾ ' + n : n);
  const el = h('div', { class: cl, title: n + (v ? ' · ' + v.dominio : '') }, et, ctl, lupa ? h('span', { class: 'marcas' }, '🔍') : null);
  el.addEventListener('click', ev => { ev.stopPropagation(); seleccionar({ tipo: 'wvar', nombre: n }); });
  el.addEventListener('contextmenu', ev => menuVarP(ev, n));
  arrastrable(el, { tipo: 'wvar', nombre: n });
  destino(el, d2 => d2.tipo === 'wvar' && d2.nombre !== n, d2 => moverVarP(d2.nombre, fila, col));
  return el;
}

function moverVarP(nombre, fila, col) {   // la deja antes de [fila][col] (col = largo del renglón: al final)
  cambiarP(m => {
    let f = fila, c = col;
    m.pantalla.forEach((r, i) => { const k = r.findIndex(x => x.toLowerCase() === nombre.toLowerCase()); if (k >= 0) { r.splice(k, 1); if (i === f && k < c) c--; } });
    if (f >= m.pantalla.length) m.pantalla.push([]);
    if (esSecc(m.pantalla[f])) { m.pantalla.splice(f + 1, 0, []); f++; c = 0; }   // V66t: sobre una sección: renglón nuevo debajo
    m.pantalla[f].splice(Math.max(0, c), 0, nombre);
    const antes = m.pantalla.length;
    m.pantalla = m.pantalla.filter(r => r.length);
    if (m.pantalla.length < antes && sel && sel.tipo === 'wfila') sel = null;
  });
}

  // botones

    style: esSel({ tipo: 'wboton', idx: i }) ? 'outline:2px solid #e0b400' : '', onclick: () => seleccionar({ tipo: 'wboton', idx: i }) }, b.titulo)));
  bs.append(h('button', { class: 'chico', onclick: () => { cambiarP(mm => mm.botones.push({ titulo: 'Nuevo', evento: "'DoNuevo'" })); sel = { tipo: 'wboton', idx: P.m.botones.length - 1 }; pintar(); } }, '+ Botón'));
  form.append(bs);
  // sin ubicar + papelera
  const sueltas = m.variables.filter(v => !enPantalla(v.nombre));

  destino(pap, d => d.tipo === 'wvar' && enPantalla(d.nombre), d => cambiarP(mm => sacarDePantalla(mm, d.nombre)));
  pal.append(pap);
  return [form, pal];
}

function menuVarP(e, n) {
  const v = varP(n); if (!v) return;
  menu(e, [
    { txt: 'Solo lectura', tilde: !!v.soloLectura, fn: () => cambiarP(() => { const x = varP(n); if (x.soloLectura) delete x.soloLectura; else x.soloLectura = true; }) },
    { txt: 'Oculta', tilde: !!v.oculto, fn: () => cambiarP(() => { const x = varP(n); if (x.oculto) delete x.oculto; else x.oculto = true; }) },
    { txt: 'Negrita', tilde: !!(v.estilo && v.estilo.negrita), fn: () => cambiarP(() => negritaP(varP(n))) },
    '-',
    { txt: 'Sacar de la pantalla', off: !enPantalla(n), fn: () => cambiarP(mm => sacarDePantalla(mm, n)) }
  ]);
}
function negritaP(x) {
  const e = Object.assign({}, x.estilo || {});
  if (e.negrita) delete e.negrita; else e.negrita = true;
  if (Object.keys(e).length) x.estilo = e; else delete x.estilo;
}

function nuevaVarP() {
  const n = prompt('Nombre de la variable nueva (sin &):', '');
  if (!n) return;
  if (!/^[A-Za-z_][A-Za-z0-9_]*$/.test(n)) { aviso('Nombre inválido: letras, números y _', true); return; }
  if (varP(n)) { aviso('Ya existe ' + n, true); return; }
  cambiarP(m => m.variables.push({ nombre: n, dominio: 'VarChar(40)', etiqueta: n }));
  sel = { tipo: 'wvar', nombre: n }; pintar();
}

const mapaATexto = o => Object.entries(o || {}).map(([k, v]) => k + ': ' + v).join(', ');
function textoAMapa(t) {
  const r = {};
  for (const par of String(t || '').split(',')) {
    const i = par.indexOf(':'); if (i < 0) continue;
    const k = par.slice(0, i).trim(), v = par.slice(i + 1).trim();
    if (k) r[k] = /^-?\d+(\.\d+)?$/.test(v) ? Number(v) : v.replace(/^["']|["']$/g, '');

  return r;
}

// ------------------------------------------------------------------ V64: impresiones (impresiones/*.yaml)
/* El diseño de un reporte: la hoja (márgenes y dónde empieza el pie), la letra y los bloques (print blocks) con sus

   los web panels (P). El lienzo dibuja cada bloque a escala; los elementos se arrastran, se estiran y se mueven con las
   flechas. Guardar reescribe SOLO lo que cambió (hoja, letra, números, bloques); los comentarios de arriba quedan.
   Qué bloque se imprime y cuándo sigue en proc/<Nombre>.proc ("print Bloque"). */
let IMP_DIR = null;       // carpeta impresiones (al lado de trn)

let MUESTRA_R = false;    // los campos con un valor de ejemplo en lugar del nombre

async function buscarImpresiones(recursos) {

}
async function leerImpresiones() {
  imps = [];
  if (!IMP_DIR) return;
  try {
    for await (const [nombre, handle] of IMP_DIR.entries())
      if (handle.kind === 'file' && /\.ya?ml$/i.test(nombre)) imps.push({ nombre, handle });
  } catch {}
  imps.sort((a, b) => a.nombre.localeCompare(b.nombre));
}
const esImpresion = tx => /^bloques\s*:/m.test(tx) && /^hoja\s*:/m.test(tx);

function tipoEl(e) { return TIPOS_R.find(t => t in e) || '?'; }

const r2 = v => Math.round(v * 100) / 100;

function modelarImp(texto) {
  const doc = YAML.parseDocument(texto);
  if (doc.errors.length) throw new Error('El YAML tiene errores: ' + doc.errors[0].message.split('\n')[0]);
  const js = doc.toJS() || {};
  if (!js.bloques || typeof js.bloques !== 'object') throw new Error('no es un diseño de impresión (falta "bloques:")');
  const bloques = [];
  for (const [nombre, b] of Object.entries(js.bloques)) {
    const bb = b && typeof b === 'object' ? b : {};
    bloques.push({ nombre: String(nombre), alto: Number(bb.alto) || 0,
      elementos: (Array.isArray(bb.elementos) ? bb.elementos : []).filter(e => e && typeof e === 'object').map(e => Object.assign({}, e)) });
  }
  const hoja = Object.assign({ ancho: 210, alto: 297, izquierda: 7.57, arriba: 9.7 }, js.hoja || {});
  if (hoja.pie == null) hoja.pie = r2(hoja.alto - 20);
  return {
    nombre: String(js.nombre ?? ''), hoja,
    letra: Object.assign({ familia: 'Helvetica', 'tamaño': 8 }, js.letra || {}),
    numeros: js.numeros && typeof js.numeros === 'object' ? Object.assign({}, js.numeros) : null,
    bloques

}

function cargarImp(nombre, texto, handle) {
  let m;
  try { m = modelarImp(texto); } catch (e) { aviso(nombre + ': ' + e.message, true); return; }
  A = null; P = null; Q = null;
  R = { nombre, handle, texto, m, orig: JSON.parse(JSON.stringify(m)), hist: [], fut: [], bak: false };
  sel = { tipo: 'rep' };

}
async function abrirImp(i) {

}
function cambiarR(fn) {

  R.fut = [];

}
const bloqueR = n => R && R.m.bloques.find(b => b.nombre === n);
const elR = s => { const b = s && bloqueR(s.b); return b ? b.elementos[s.i] : null; };

function validarImp(m) {
  const err = [];
  const nombres = new Set();
  for (const b of m.bloques) {
    if (!/^[A-Za-z_][A-Za-z0-9_]*$/.test(b.nombre)) err.push('nombre de bloque inválido: ' + b.nombre);
    if (nombres.has(b.nombre.toLowerCase())) err.push('bloque repetido: ' + b.nombre);
    nombres.add(b.nombre.toLowerCase());
    if (!(b.alto >= 0)) err.push(b.nombre + ': el alto tiene que ser un número');
    b.elementos.forEach((e, i) => {
      const t = tipoEl(e);
      if (t === '?') err.push(b.nombre + ', elemento ' + (i + 1) + ': sin texto, campo, imagen, línea ni recuadro');
      if ((t === 'campo' || t === 'imagen') && !valorEl(e).trim()) err.push(b.nombre + ': un ' + t + ' sin la variable o el atributo');
      for (const k of ['x', 'y', 'ancho', 'alto', 'tamaño', 'grosor']) if (e[k] != null && isNaN(Number(e[k]))) err.push(b.nombre + ': ' + k + ' no es un número');
    });
  }
  const hj = m.hoja;
  for (const k of ['ancho', 'alto', 'izquierda', 'arriba', 'pie']) if (isNaN(Number(hj[k]))) err.push('hoja: ' + k + ' no es un número');
  if (Number(hj.pie) > Number(hj.alto)) err.push('hoja: el pie empieza más abajo que el alto de la hoja');
  return err;
}

// ---------- texto: se reescriben solo las secciones que cambiaron
function ordenarEl(e) {
  const t = tipoEl(e), r = {};
  if (t !== '?') r[t] = (t === 'linea' || t === 'recuadro') ? true : e[t];
  for (const k of ORDEN_EL) if (e[k] != null && e[k] !== '' && e[k] !== false) r[k] = e[k];
  for (const [k, v] of Object.entries(e)) if (!(k in r) && !TIPOS_R.includes(k) && v != null && v !== '' && v !== false) r[k] = v;
  return r;
}
function flujoR(obj) {
  const d = new YAML.Document(obj);
  if (d.contents && d.contents.items) {
    d.contents.flow = true;
    // con las comillas de gx2prn (q): sin comillas solo los textos simples; el resto entre comillas ("99/99/99", "&Var")
    const simple = v => /^[A-Za-zÁÉÍÓÚáéíóúÑñ_][\wÁÉÍÓÚáéíóúÑñ .()\/-]*$/.test(v) && v.trim() === v && !/^(true|false|null|yes|no|si|sí)$/i.test(v);
    for (const it of d.contents.items) if (it.value && typeof it.value.value === 'string') it.value.type = simple(it.value.value) ? 'PLAIN' : 'QUOTE_DOUBLE';
  }

}
function textoBloques(m, coments = {}) {
  const l = ['bloques:'];
  const clave = k => /^[A-Za-z_][A-Za-z0-9_]*$/.test(k) ? k : JSON.stringify(k);
  for (const b of m.bloques) {
    l.push('  ' + clave(b.nombre) + ':' + (coments[b.nombre] || ''), '    alto: ' + r2(b.alto));
    if (!b.elementos.length) l.push('    elementos: []');
    else { l.push('    elementos:'); for (const e of b.elementos) l.push('      - ' + flujoR(ordenarEl(e))); }
  }

}
/** El comentario del renglón de cada bloque ("  Pie:   # ..."), para no perderlo al reescribir todos los bloques. */
function comentariosBloques(texto) {
  const r = {};
  try {
    const bs = YAML.parseDocument(texto).get('bloques', true);
    for (const par of (bs && bs.items) || []) {
      const ini = par.key.range[0], fin = texto.indexOf('\n', ini);
      const c = texto.slice(ini, fin < 0 ? undefined : fin).match(/:(\s+#.*)$/);
      if (c) r[String(par.key.value)] = c[1];
    }
  } catch {}

}
/** Reescribe solo lo que cambió de los bloques: el alto, cada elemento cambiado y, si un bloque cambió de elementos (agregados,
    borrados, otro orden), ese bloque entero (con el comentario de su renglón). null si cambiaron los bloques (nombres u orden). */
function textoBloquesParcial(texto, m, o) {
  if (!igual(m.bloques.map(b => b.nombre), o.bloques.map(b => b.nombre))) return null;
  const doc = YAML.parseDocument(texto);
  const bs = doc.get('bloques', true);
  if (!bs || !bs.items || bs.flow) return null;
  const ed = [];   // [desde, hasta, texto]
  for (let i = 0; i < m.bloques.length; i++) {
    const nb = m.bloques[i], ob = o.bloques[i];
    if (igual(nb, ob)) continue;
    const par = bs.items.find(x => x.key && String(x.key.value) === nb.nombre);
    if (!par || !par.value || !par.value.items) return null;
    const nAlto = par.value.get('alto', true), nEls = par.value.get('elementos', true);
    const mismos = nb.elementos.length === ob.elementos.length && nEls && nEls.items && nEls.items.length === ob.elementos.length && !nEls.flow;
    if (mismos) {
      if (r2(nb.alto) !== r2(ob.alto)) { if (!nAlto || !nAlto.range) return null; ed.push([nAlto.range[0], nAlto.range[1], String(r2(nb.alto))]); }
      nb.elementos.forEach((e, j) => {
        if (igual(e, ob.elementos[j])) return;
        const it = nEls.items[j];
        ed.push([it.range[0], it.range[1], flujoR(ordenarEl(e))]);
      });
    } else {
      // el bloque entero, desde su nombre hasta el final de sus elementos (el comentario del renglón del nombre queda)
      const ini = par.key.range[0];
      let fin = par.value.range[1];
      while (fin > ini && /\s/.test(texto[fin - 1])) fin--;
      const finNombre = texto.indexOf('\n', ini);
      const coment = (texto.slice(ini, finNombre < 0 ? undefined : finNombre).match(/\s#.*$/) || [''])[0];
      const una = textoBloques({ bloques: [nb] }).split('\n').slice(1);   // sin "bloques:"
      una[0] = una[0] + coment;
      ed.push([ini, fin, una.join('\n').replace(/^  /, '')]);
    }
  }
  ed.sort((x, y) => y[0] - x[0]);

function textoImp() {
  const m = R.m, o = R.orig;

  if (!igual(m.letra, o.letra)) cambios.push(['letra', 'letra: ' + flujoR(m.letra)]);
  if (!igual(m.numeros, o.numeros)) cambios.push(['numeros', m.numeros ? 'numeros: ' + flujoR(m.numeros) : null]);
  let txt = R.texto;
  if (!igual(m.bloques, o.bloques)) {
    const parcial = textoBloquesParcial(txt, m, o);   // solo los renglones que cambiaron (quedan los comentarios)
    if (parcial != null) txt = parcial; else cambios.push(['bloques', textoBloques(m, comentariosBloques(txt))]);
  }
  const ubicar = (texto, k) => {
    const doc = YAML.parseDocument(texto);
    const par = doc.contents.items.find(x => x.key && x.key.value === k);
    if (!par) return null;
    let hasta = par.value ? par.value.range[1] : par.key.range[1];

    } else if (nuevo != null) {   // sección nueva (ej. numeros): antes de los bloques

// ---------- modelo
function normalParQ(p, nodo) {
  p = p && typeof p === 'object' ? p : {};

  const r = { nombre: strQ(p.nombre), etiqueta: strQ(p.etiqueta), valores: '', tabla: null, default: strQ(p.default),
    tipo: strQ(p.tipo), vacio: p.vacio == null ? '' : String(p.vacio), recordar: p.recordar == null ? '' : String(p.recordar) };

  const vn = nodo && nodo.get ? nodo.get('valores', true) : null;
  if (vn && vn.items) r.valores = vn.items.map(x => strQ(x.key && (x.key.value ?? x.key.source)) + '=' + strQ(x.value ? x.value.toJSON() : '')).join('; ');
  else if (p.valores && typeof p.valores === 'object') r.valores = Object.entries(p.valores).map(([k, v]) => k + '=' + strQ(v)).join('; ');
  if (p.tabla && typeof p.tabla === 'object') r.tabla = { tabla: strQ(p.tabla.tabla), valor: strQ(p.tabla.valor), texto: strQ(p.tabla.texto), donde: strQ(p.tabla.donde) };

}
function modelarCns(texto) {

  const mapa = o => { const r = {}; if (o && typeof o === 'object' && !Array.isArray(o)) for (const [k, v] of Object.entries(o)) r[String(k)] = strQ(v); return r; };
  const lista = o => Array.isArray(o) ? o.map(x => String(x).trim()) : o == null ? [] : String(o).split(',').map(x => x.trim()).filter(Boolean);
  const procesos = {};

        cns: strQ(vv.cns), parametros: (Array.isArray(vv.parametros) ? vv.parametros : []).map(x => String(x).trim()).join(', '), si: strQ(vv.si) };   // V66l
    }
  return {
    consulta: strQ(js.consulta), titulo: strQ(js.titulo), plural: strQ(js.plural), trn: strQ(js.trn), calculo: strQ(js.calculo),
    parametros: (Array.isArray(js.parametros) ? js.parametros : []).map((x, i) => { const pn = doc.get('parametros', true); return normalParQ(x, pn && pn.items ? pn.items[i] : null); }),
    recibe: (Array.isArray(js.recibe) ? js.recibe : []).map(r => ({ nombre: strQ(r && r.nombre), obligatorio: !!(r && r.obligatorio === true), sql: strQ(r && r.sql) })),
    // V66l: las demás claves (variables, condicion, estilos, acciones, botones, cabecera, orden) no se editan acá: quedan como están en el archivo
    subtitulo: js.subtitulo && typeof js.subtitulo === 'object' ? { sql: strQ(js.subtitulo.sql), parametros: lista(js.subtitulo.parametros) } : null,
    join: js.join == null ? '' : String(js.join).replace(/\s+$/, ''),
    columnasSql: (Array.isArray(js.columnasSql) ? js.columnasSql : []).map(c => ({ nombre: strQ(c && c.nombre), titulo: strQ(c && c.titulo),
      tipo: strQ(c && c.tipo), formato: strQ(c && c.formato), sql: strQ(c && c.sql), oculta: !!(c && c.oculta === true) })),
    enlaces, columnas: lista(js.columnas), titulos: mapa(js.titulos), anchos: mapa(js.anchos), ocultas: lista(js.ocultas), procesos
  };
}
function cargarCns(nombre, texto, handle) {

  A = null; P = null; R = null;

/** Los campos de la TRN de la consulta (título, dominio), para las columnas propias y para agregar columnas. */

function cambiarQ(fn) {

// ---------- columnas: de dónde salen, título y ancho (como el motor, OptimistConsultaView)
function colSqlQ(m, c) { return m.columnasSql.find(x => x.nombre.toLowerCase() === String(c).toLowerCase()) || null; }
function campoTrnQ(c) { return Q && Q.info ? Q.info.campos[String(c).toLowerCase()] || null : null; }
function origenQ(m, c) {
  if (m.calculo.toLowerCase() === 'stock' && STOCK_Q.includes(c)) return 'stock';
  if (colSqlQ(m, c)) return 'sql';
  if (campoTrnQ(c)) return 'trn';
  return Q && Q.info && Q.info.encontrada ? '?' : 'trn';
}
function tituloQ(m, c) {
  if (m.titulos[c] != null && m.titulos[c] !== '') return m.titulos[c];
  const s = colSqlQ(m, c);
  if (s) return s.titulo || s.nombre;
  const t = campoTrnQ(c);
  return t ? t.titulo : c;
}
function tituloDefectoQ(m, c) {   // el que tendría sin "titulos:"
  const s = colSqlQ(m, c);
  if (s) return s.titulo || s.nombre;
  const t = campoTrnQ(c);
  return t ? t.titulo : c;
}
function pxQ(a) {

}
/** El ancho con que se ve la columna: el de "anchos:", o 130 las de stock, o el automático (no baja de la caja del filtro). */
function anchoQ(m, c) {

  if (origenQ(m, c) === 'stock') return { px: 130, auto: false, defecto: true };

function totalQ(m) { return ACCIONES_Q + m.columnas.reduce((t, c) => t + anchoQ(m, c).px, 0); }

function muestraQ(m, c) {
  const o = origenQ(m, c);
  if (o === 'stock') return '1.234,000';
  if (o === 'sql') { const s = colSqlQ(m, c); return s.tipo === 'numero' ? '12.345,67' : s.tipo === 'fecha' ? '21/10/2026' : 'Texto de ejemplo'; }
  const d = dominioQ(c);
  if (!d) return '…';
  if (d.valores && d.valores.length) return strQ(d.valores[0].texto ?? d.valores[0].valor);
  if (d.tipo === 'num') { const l = Math.max(1, d.largo - d.dec); const ent = '9'.repeat(Math.min(l, 9)).replace(/\B(?=(\d{3})+(?!\d))/g, d.miles || d.dec ? '.' : ''); return d.dec ? ent + ',' + '9'.repeat(d.dec) : ent; }

  if (d.tipo === 'datetime') return '21/10/2026 10:30';
