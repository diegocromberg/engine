<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OPTIMIST Designer</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230e8f7a'/%3E%3Ccircle cx='32' cy='32' r='18' fill='none' stroke='%23fff' stroke-width='8'/%3E%3Crect x='42' y='42' width='16' height='16' rx='3' fill='%23ffd54a' stroke='%230e8f7a' stroke-width='3'/%3E%3C/svg%3E">
<style>
:root {
  --fondo: #f4f6f8; --panel: #ffffff; --borde: #d7dde3; --texto: #1d2733; --suave: #6b7785;
  --acento: #0e8f7a; --acento-2: #e6f4f1; --peligro: #c0392b; --sel: #fff4c2; --oculto: #9aa5b1;
  --celda: #fbfcfd; --drop: #d8f1ea;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { font: 13px/1.35 "Segoe UI", system-ui, sans-serif; color: var(--texto); background: var(--fondo);
       display: grid; grid-template-rows: auto 1fr auto; }
button, select, input { font: inherit; }
button { border: 1px solid var(--borde); background: #fff; border-radius: 6px; padding: 5px 10px; cursor: pointer; }
button:hover:not(:disabled) { border-color: var(--acento); }
button:disabled { opacity: .45; cursor: default; }
button.primario { background: var(--acento); color: #fff; border-color: var(--acento); }
button.chico { padding: 2px 7px; font-size: 12px; }
input[type=text], input[type=number], select { border: 1px solid var(--borde); border-radius: 5px; padding: 4px 6px; background: #fff; width: 100%; }

/* barra superior */
#barra { display: flex; gap: 8px; align-items: center; padding: 8px 12px; background: #0f2a33; color: #fff; flex-wrap: wrap; }
#barra .marca { font-weight: 700; letter-spacing: .5px; margin-right: 8px; color: #7fd3c3; }
#barra button { background: #1d3f4a; color: #fff; border-color: #2e5a67; }
#barra button.primario { background: var(--acento); border-color: var(--acento); }
#barra select { width: 260px; background: #fff; }
#barra .estado { margin-left: auto; opacity: .85; font-size: 12px; }
#barra .sucio { color: #ffd166; font-weight: 600; }
#barra .orden { display: flex; gap: 4px; align-items: center; flex: 1 1 320px; max-width: 460px; }
#barra .orden input { width: 100%; background: #fff; }
#bVoz.escuchando { background: #c0392b; border-color: #c0392b; animation: latido 1.2s infinite; }
@keyframes latido { 50% { opacity: .6; } }

/* tres paneles */
#cuerpo { display: grid; grid-template-columns: 290px 1fr 320px; min-height: 0; }
.panel { background: var(--panel); border-right: 1px solid var(--borde); overflow: auto; min-height: 0; }
#props { border-right: 0; border-left: 1px solid var(--borde); padding: 12px; }
#centro { overflow: auto; padding: 14px 18px 40px; min-width: 0; }
.titulo-panel { font-weight: 700; text-transform: uppercase; font-size: 11px; letter-spacing: .6px; color: var(--suave); padding: 10px 12px 4px; }

/* árbol */
#arbol ul { list-style: none; margin: 0; padding-left: 14px; }
#arbol > ul { padding-left: 6px; }
#arbol li > .nodo { display: flex; align-items: center; gap: 5px; padding: 2px 6px; border-radius: 4px; cursor: pointer; white-space: nowrap; }
#arbol li > .nodo:hover { background: var(--acento-2); }
#arbol li > .nodo.sel { background: var(--sel); }
#arbol .flecha { width: 12px; color: var(--suave); font-size: 10px; flex: none; }
#arbol .ico { width: 16px; text-align: center; flex: none; }
#arbol .nodo.oculto .txt { color: var(--oculto); text-decoration: line-through; }
#arbol .nodo .extra { color: var(--suave); font-size: 11px; overflow: hidden; text-overflow: ellipsis; }
#arbol li.cerrado > ul { display: none; }

/* pestañas del centro */
.pestanas { display: flex; gap: 2px; border-bottom: 1px solid var(--borde); margin-bottom: 12px; }
.pestanas .p { padding: 7px 14px; border: 1px solid transparent; border-bottom: 0; border-radius: 6px 6px 0 0; cursor: pointer; color: var(--suave); }
.pestanas .p.act { background: var(--panel); border-color: var(--borde); color: var(--texto); font-weight: 600; margin-bottom: -1px; }

/* formulario */
.form { background: var(--panel); border: 1px solid var(--borde); border-radius: 10px; padding: 12px 16px 16px; }
.solapas { display: flex; flex-wrap: wrap; gap: 2px; border-bottom: 2px solid var(--acento); margin-bottom: 12px; }
.solapa-tab { padding: 6px 12px; border-radius: 6px 6px 0 0; background: #eef1f4; cursor: pointer; user-select: none; }
.solapa-tab.act { background: var(--acento); color: #fff; }
.solapa-tab.drop, .zona.drop, .celda.drop, .bloque-det.drop { outline: 2px dashed var(--acento); background: var(--drop) !important; }
.solapa-tab.nueva { background: transparent; color: var(--acento); border: 1px dashed var(--acento); }
.tabla { border: 1px dashed transparent; border-radius: 8px; padding: 6px; margin-bottom: 10px; position: relative; }
.tabla:hover { border-color: var(--borde); }
.tabla.sel { border-color: #e0b400; background: #fffdf2; }
.tabla .cab-tabla { display: flex; gap: 6px; align-items: center; font-size: 11px; color: var(--suave); margin-bottom: 4px; }
.tabla .cab-tabla .t { font-weight: 600; color: var(--texto); font-size: 12px; }
.grilla { display: grid; gap: 6px 14px; }
.celda { min-height: 34px; border: 1px solid transparent; border-radius: 6px; padding: 3px 6px; display: flex; flex-wrap: wrap; align-items: center; gap: 2px 8px; background: var(--celda); cursor: grab; }
.celda:hover { border-color: var(--borde); }
.celda.sel { border-color: #e0b400; background: var(--sel); }
.celda.vacia { background: repeating-linear-gradient(45deg, #fafbfc, #fafbfc 6px, #f1f3f5 6px, #f1f3f5 12px); cursor: default; justify-content: center; color: #c3cad2; font-size: 11px; }
.celda .et { flex: 0 1 auto; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #34495e; }
.celda .ctl { flex: 1 1 90px; min-width: 60px; height: 24px; border: 1px solid #c9d1d9; border-radius: 4px; background: #fff; display: flex; align-items: center; padding: 0 6px; color: var(--suave); font-size: 11px; overflow: hidden; white-space: nowrap; }
.celda .ctl.multi { height: 46px; align-items: flex-start; padding-top: 3px; }
.celda .marcas { flex: none; font-size: 11px; color: var(--suave); }
.celda.por-regla { border: 1px dashed #9aa5b1; opacity: .75; }   /* V64c: visible según una regla (X.Visible = ...) */
.celda.oculto { opacity: .45; }
.celda.oculto .et { text-decoration: line-through; }
.celda.inferido .ctl { background: #f3f5f7; font-style: italic; }
.celda.lectura .ctl { background: #f3f5f7; }
.celda.error { border-color: var(--peligro); }
.agregar { display: flex; gap: 6px; margin-top: 6px; }
.zona { border: 1px dashed #c9d1d9; border-radius: 6px; padding: 6px; text-align: center; color: var(--suave); font-size: 12px; flex: 1; }
.bloque-det { border: 1px solid var(--borde); border-radius: 8px; margin: 8px 0 12px; background: #fff; cursor: grab; }
.bloque-det .cab { padding: 6px 10px; background: #eef1f4; border-radius: 8px 8px 0 0; font-weight: 600; display: flex; justify-content: space-between; }
.bloque-det .cols { display: flex; gap: 4px; padding: 8px; flex-wrap: wrap; }
.bloque-det .col { background: #f6f8fa; border: 1px solid #e2e6ea; border-radius: 4px; padding: 3px 8px; font-size: 12px; }
.bloque-det .col.oculto { opacity: .45; text-decoration: line-through; }
.bloque-det.sel { outline: 2px solid #e0b400; }
/* V34: grilla simulada del detalle */
.gs-scroll { overflow-x: auto; padding: 6px 8px 8px; }
.gs { display: inline-block; min-width: 100%; }
.gs-fila { display: flex; gap: 6px; align-items: center; margin-bottom: 4px; }
.gs-tacho { width: 30px; min-width: 30px; text-align: center; font-size: 12px; opacity: .6; }
.gs-tit { font-size: 12px; color: #4a5a68; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 2px 2px; cursor: pointer; box-sizing: border-box; }
.gs-celda { height: 24px; border: 1px solid #d5dbe1; border-radius: 4px; background: #fff; box-sizing: border-box; cursor: pointer; }
.gs-celda.ro { background: #e4e8ec; border-style: dashed; }
.gs-tit.sel, .gs-celda.sel { outline: 2px solid #e0b400; }
.coment { color: #7a8794; font-style: italic; font-size: 12px; margin: 2px 0 6px; }

/* paneles y renglones */
.panel-d { border: 1px solid #9fcfc5; border-radius: 10px; margin: 6px 0 10px; background: #fff; min-width: 0; }
.panel-d > .cab { display: flex; align-items: center; gap: 8px; padding: 6px 10px; background: #eef8f5; border-radius: 10px 10px 0 0; cursor: grab; font-weight: 600; }
.panel-d > .cab .tg { color: var(--acento); width: 16px; cursor: pointer; }
.panel-d > .cab .badge { font-weight: 400; font-size: 11px; color: var(--suave); background: #fff; border: 1px solid var(--borde); border-radius: 10px; padding: 0 7px; }
.panel-d > .cuerpo { padding: 8px 10px; }
.panel-d.sel { outline: 2px solid #e0b400; }
.panel-d.plegado > .cuerpo { display: none; }
.panel-d > .cab.drop { outline: 2px dashed var(--acento); }
.renglon-d { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-start; border: 1px dashed #c9d1d9; border-radius: 10px; padding: 6px; margin: 6px 0 10px; position: relative; }
.renglon-d > * { flex: 1 1 260px; min-width: 0; }
.renglon-d > .zona { flex: 0 0 110px; align-self: stretch; display: flex; align-items: center; justify-content: center; }
.renglon-d.sel { outline: 2px solid #e0b400; }
.renglon-d .etq { position: absolute; top: -9px; left: 10px; background: var(--fondo); font-size: 10px; color: var(--suave); padding: 0 4px; cursor: grab; }
.cab-tabla.drop { outline: 2px dashed var(--acento); }

/* sin ubicar + papelera */
.paleta { margin-top: 16px; background: var(--panel); border: 1px solid var(--borde); border-radius: 10px; padding: 10px 12px; }
.paleta h4 { margin: 0 0 6px; font-size: 12px; color: var(--suave); text-transform: uppercase; letter-spacing: .5px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--borde); background: #fff; border-radius: 14px; padding: 3px 10px; cursor: grab; font-size: 12px; }
.chip.oculto { color: var(--oculto); }
.chip.aviso { border-color: #e0b400; }
#papelera { margin-top: 10px; border: 2px dashed #e3b5ae; color: var(--peligro); border-radius: 8px; padding: 10px; text-align: center; }
#papelera.drop { background: #fbe9e7; }

/* workwith */
.ww { background: var(--panel); border: 1px solid var(--borde); border-radius: 10px; padding: 12px; }
.ww-cols { display: flex; gap: 0; overflow-x: auto; border: 1px solid var(--borde); border-radius: 6px; }
.ww-col { min-width: 90px; padding: 8px 10px; border-right: 1px solid var(--borde); background: #f6f8fa; cursor: grab; user-select: none; }
.ww-col:last-child { border-right: 0; }
.ww-col .t { font-weight: 600; }
.ww-col .n { font-size: 11px; color: var(--suave); }
.ww-col.sel { background: var(--sel); }
.ww-col.drop { box-shadow: inset 3px 0 0 var(--acento); }
.ww-filas div { height: 26px; border-bottom: 1px solid #eef1f4; }
.ww-filas div:nth-child(even) { background: #f7f8fa; }
/* V48e: renglones de muestra de cada columna del WorkWith (con su clase) */
.ww-col { display: flex; flex-direction: column; padding-bottom: 0; --letra-usuario: 13px; }
.ww-celdas { margin: 8px -10px 0; background: #fff; }
.ww-celdas div { height: 26px; line-height: 26px; padding: 0 10px; border-top: 1px solid #eef1f4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ww-celdas div:nth-child(even) { background: #f7f8fa; }

/* propiedades */
#props h3 { margin: 0 0 2px; font-size: 15px; }
#props .sub { color: var(--suave); font-size: 12px; margin-bottom: 12px; }
#props .campo { margin-bottom: 9px; }
#props label.l { display: block; font-size: 11px; color: var(--suave); margin-bottom: 2px; }
#props .check { display: flex; align-items: center; gap: 7px; margin: 5px 0; }
#props .grupo { border-top: 1px solid var(--borde); margin-top: 12px; padding-top: 10px; }
#props .grupo > .gt { font-size: 11px; font-weight: 700; color: var(--suave); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 6px; }
#props .ro { background: #f3f5f7; border-radius: 5px; padding: 4px 6px; color: var(--suave); }
#props .fila { display: flex; gap: 8px; }
#props .fila > * { flex: 1; }
#props .ayuda { color: var(--suave); font-size: 12px; }
.vacio-props { color: var(--suave); padding: 20px 4px; }

/* menú contextual */
#menu { position: fixed; z-index: 50; background: #fff; border: 1px solid var(--borde); border-radius: 8px; box-shadow: 0 8px 24px #0002; padding: 4px; min-width: 210px; display: none; }
#menu .it { padding: 6px 10px; border-radius: 5px; cursor: pointer; display: flex; gap: 8px; align-items: center; }
#menu .it:hover { background: var(--acento-2); }
#menu .it.off { color: #b0b8c1; cursor: default; background: none; }
#menu .sep { height: 1px; background: var(--borde); margin: 4px 2px; }
#menu .tilde { width: 14px; text-align: center; color: var(--acento); font-weight: 700; }

/* pie */
#pie { padding: 5px 12px; font-size: 12px; color: var(--suave); background: var(--panel); border-top: 1px solid var(--borde); display: flex; gap: 16px; }
#pie .err { color: var(--peligro); }
#bienvenida { max-width: 620px; margin: 60px auto; background: var(--panel); border: 1px solid var(--borde); border-radius: 12px; padding: 26px 30px; }
#bienvenida h2 { margin-top: 0; }
#bienvenida li { margin: 6px 0; }
.toast { position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%); background: #0f2a33; color: #fff; padding: 9px 16px; border-radius: 8px; z-index: 60; box-shadow: 0 6px 20px #0003; max-width: 80vw; }
.toast.err { background: var(--peligro); }
/* V48e: editor de clases (ventana flotante sobre la Estructura; el formulario se sigue viendo y cambia en vivo) */
#clases { position: fixed; top: 58px; left: 10px; width: 430px; max-height: calc(100vh - 100px); overflow: auto; z-index: 55;
          background: var(--panel); border: 1px solid var(--borde); border-radius: 10px; box-shadow: 0 10px 34px #0004; }
#clases .cab { cursor: move; user-select: none; display: flex; align-items: center; gap: 8px; padding: 9px 12px; background: #0f2a33; color: #fff; border-radius: 10px 10px 0 0; position: sticky; top: 0; z-index: 1; }
#clases .cab b { flex: 1; }
#clases .cab button { background: transparent; color: #fff; border-color: #2e5a67; }
#clases .sec { padding: 10px 12px; border-top: 1px solid var(--borde); }
#clases .sec:first-of-type { border-top: 0; }
#clases .st { font-size: 11px; font-weight: 700; color: var(--suave); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 6px; }
#clases .lista { display: flex; flex-direction: column; gap: 2px; max-height: 190px; overflow: auto; }
#clases .lista .it { display: flex; align-items: center; gap: 8px; padding: 4px 6px; border-radius: 5px; cursor: pointer; --letra-usuario: 13px; }
#clases .lista .it:hover { background: var(--acento-2); }
#clases .lista .it.sel { background: var(--sel); }
#clases .lista .nom { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#clases .lista .donde { font-size: 11px; color: var(--suave); white-space: nowrap; }
#clases .campo { margin-bottom: 8px; }
#clases .campo > label.l { display: block; font-size: 12px; color: var(--suave); margin-bottom: 2px; }
#clases .fila { display: flex; gap: 8px; align-items: flex-end; }
#clases .fila > * { flex: 1; }
#clases .ayuda { color: var(--suave); font-size: 12px; }
#clases .err { color: var(--peligro); font-size: 12px; margin-top: 4px; }
#clases .muestra { --letra-usuario: 13px; background: #fbfcfd; border: 1px dashed var(--borde); border-radius: 8px; padding: 10px 12px; display: grid; grid-template-columns: auto 1fr; gap: 8px 12px; align-items: center; }
#clases .muestra .ctl { border: 1px solid var(--borde); border-radius: 4px; padding: 4px 8px; background: #fff; min-height: 26px; }
#clases .muestra .tit { grid-column: 1 / -1; font-size: 11px; color: var(--suave); }
#clases .botones { display: flex; gap: 8px; justify-content: flex-end; }
#clases .botones .izq { margin-right: auto; }
/* V49h: web panels: código de los eventos */
.renglon-w { margin-top: 14px; }
.renglon-w > .celda { flex: 0 1 auto; }
.renglon-w > .celda .ctl { min-width: 90px; }
.renglon-w > .zona { flex: 0 0 90px; margin-left: auto; }
textarea.codigo { width: 100%; height: calc(100vh - 230px); min-height: 300px; font: 12.5px/1.45 Consolas, "Cascadia Mono", monospace; tab-size: 4;
                  border: 1px solid var(--borde); border-radius: 6px; padding: 8px 10px; white-space: pre; resize: vertical; }
#clases label.chk { display: flex; align-items: center; gap: 6px; margin: 3px 0; }
/* V64: impresiones */
.rb-barra { position: sticky; top: -14px; z-index: 5; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; background: var(--fondo); padding: 6px 0 10px; }
.rb-barra .chk { display: flex; align-items: center; gap: 4px; }
.rb-barra .rb-ayuda { color: var(--suave); font-size: 12px; }
.rb-banda { margin: 0 0 14px; width: max-content; }
.rb-cab { font-size: 12px; color: var(--suave); padding: 2px 4px; cursor: pointer; }
.rb-cab b { color: var(--texto); }
.rb-banda.sel .rb-cab { background: var(--sel); border-radius: 4px 4px 0 0; }
.rb-area { position: relative; background: #fff; border: 1px solid var(--borde); box-shadow: 0 1px 2px #0001;
  background-image: linear-gradient(#eef1f4 1px, transparent 1px), linear-gradient(90deg, #eef1f4 1px, transparent 1px); background-size: 15px 15px; }
.rb-banda.sel .rb-area { border-color: #e0b400; }
.rb-margen { position: absolute; top: 0; bottom: 0; border-left: 1px dashed #c8d0d8; pointer-events: none; }
.rb-alto { height: 7px; cursor: ns-resize; background: repeating-linear-gradient(90deg, #c8d0d8 0 6px, transparent 6px 10px); opacity: .6; }
.rb-alto:hover { opacity: 1; background: var(--acento); }
.rb-el { position: absolute; cursor: move; white-space: pre; overflow: visible; line-height: 1; color: #111; user-select: none; outline: 1px dotted transparent; }
.rb-el:hover { outline-color: #8fb3c4; }
.rb-el.sel { outline: 2px solid #e0b400; z-index: 3; }
.rb-campo { color: #0b5f8a; background: #eaf5fb99; }
.rb-texto { color: #222; }
.rb-recuadro { border: 1px solid #333; }
.rb-linea { background: #333; min-height: 1px; min-width: 1px; }
.rb-imagen { background: #f0f2f4; border: 1px dashed #9aa5b1; font-size: 11px; color: var(--suave); overflow: hidden; display: flex; align-items: center; justify-content: center; }
.rb-tirador { position: absolute; right: -5px; bottom: -5px; width: 9px; height: 9px; background: #e0b400; border: 1px solid #fff; cursor: nwse-resize; }
.rb-fila { display: flex; gap: 8px; }
#props .agregar { flex-wrap: wrap; }
#props .agregar button { white-space: nowrap; }
.rb-fila > * { flex: 1; min-width: 0; }
/* V66k4: consultas */
.q-titulo { font-size: 15px; margin-bottom: 4px; }
.q-titulo span { color: var(--suave); font-size: 12px; }
.q-barra { position: sticky; top: -14px; left: 0; z-index: 5; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; background: var(--fondo); padding: 6px 0 10px; }
.q-barra .total { font-weight: 600; }
.q-barra .total.excede { color: var(--peligro); }
.q-ayuda { color: var(--suave); font-size: 12px; }
.q-marco { padding: 8px 0 12px; overflow-x: auto; }
.q-grilla { position: relative; display: inline-flex; background: #fff; border: 1px solid var(--borde); border-radius: 6px; box-shadow: 0 1px 2px #0001; }
.q-col { box-sizing: border-box; flex: 0 0 auto; border-right: 1px solid #e3e7eb; position: relative; min-width: 0; }
.q-cab { padding: 6px 8px; background: #f6f8fa; border-bottom: 1px solid var(--borde); cursor: grab; min-height: 62px; box-sizing: border-box; overflow: hidden; }
.q-cab .t { font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.q-cab .f { margin-top: 4px; height: 22px; box-sizing: border-box; border: 1px solid #cfd6dd; border-radius: 4px; background: #fff; font-size: 11px; color: #9aa5b1; padding: 3px 5px; white-space: nowrap; overflow: hidden; }
.q-cab .a { font-size: 10px; color: var(--suave); margin-top: 3px; white-space: nowrap; }
.q-col.auto .q-cab { background: repeating-linear-gradient(45deg, #f6f8fa 0 6px, #e9edf1 6px 12px); }
.q-col.sel .q-cab { background: var(--sel); }
.q-col.mal .q-cab .t { color: var(--peligro); }
.q-acc .q-cab { cursor: default; }
.q-celda { padding: 6px 8px; font-size: 12px; border-bottom: 1px solid #eef1f4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #334; }
.q-celda.num { text-align: right; }
.q-celda.enl { color: var(--acento); text-decoration: underline; }
.q-tirador { position: absolute; top: 0; right: -4px; width: 8px; height: 62px; cursor: col-resize; z-index: 2; }
.q-tirador:hover { background: var(--acento); opacity: .45; }
.q-col.drop-izq { box-shadow: inset 3px 0 0 var(--acento); }
.q-col.drop-der { box-shadow: inset -3px 0 0 var(--acento); }
.q-guia { position: absolute; top: -8px; bottom: -8px; border-left: 2px dashed var(--peligro); pointer-events: none; z-index: 3; }
.q-guia span { position: absolute; bottom: -18px; left: 4px; font-size: 11px; color: var(--peligro); white-space: nowrap; }
textarea.q-sql { width: 100%; box-sizing: border-box; font: 12px/1.4 Consolas, "Cascadia Mono", monospace; border: 1px solid var(--borde); border-radius: 5px; padding: 5px 7px; resize: vertical; }
button.peligro { color: var(--peligro); }

/* E2: importador de GeneXus */
#imp { position: fixed; inset: 0; z-index: 40; background: #0f2a3399; display: none; align-items: center; justify-content: center; }
#imp.abierto { display: flex; }
#imp .ven { background: var(--panel); width: min(1100px, 96vw); height: min(760px, 92vh); border-radius: 10px; box-shadow: 0 12px 40px #0005; display: grid; grid-template-rows: auto auto auto 1fr auto; overflow: hidden; }
#imp .cab { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: #0f2a33; color: #fff; }
#imp .cab b { font-size: 15px; }
#imp .cab .x { margin-left: auto; background: transparent; color: #fff; border: 0; font-size: 18px; line-height: 1; padding: 2px 8px; }
#imp .cab .x:hover { background: var(--peligro); }
#imp .orig { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--borde); }
#imp .orig .dato { color: var(--suave); }
#imp .orig .dato b { color: var(--texto); }
#imp .herr { display: flex; gap: 10px; align-items: center; padding: 8px 14px; border-bottom: 1px solid var(--borde); flex-wrap: wrap; }
#imp .herr input[type=text] { width: 260px; }
#imp .herr label { display: flex; gap: 5px; align-items: center; color: var(--suave); }
#imp .barraAvance { height: 6px; background: var(--acento-2); border-radius: 3px; overflow: hidden; width: 260px; }
#imp .barraAvance div { height: 100%; background: var(--acento); width: 0; transition: width .2s; }
#imp .tabla { overflow: auto; }
#imp table { border-collapse: collapse; width: 100%; }
#imp th { position: sticky; top: 0; background: #eef2f5; text-align: left; font-weight: 600; padding: 6px 8px; border-bottom: 1px solid var(--borde); z-index: 1; }
#imp td { padding: 5px 8px; border-bottom: 1px solid #edf0f3; vertical-align: middle; }
#imp tr.fila { cursor: pointer; }
#imp tr.fila:hover td { background: var(--acento-2); }
#imp tr.fila.marcada td { background: #fffbe6; }
#imp tr.fila.no td { color: var(--oculto); cursor: default; }
#imp .num { text-align: right; }
#imp .vacio { padding: 40px; text-align: center; color: var(--suave); }
#imp .pie { display: flex; gap: 10px; align-items: center; padding: 10px 14px; border-top: 1px solid var(--borde); background: var(--fondo); }
#imp .pie .cuenta { margin-right: auto; color: var(--suave); }
.est { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.est.nueva { background: #e3f4ea; color: #1f7a3b; }
.est.migrada { background: #eceff2; color: #5d6875; }
.est.modificada { background: #fff0d9; color: #a35a00; }
.est.error { background: #fdecea; color: var(--peligro); }
.est.wwp { background: #e8eefc; color: #2c4fa0; }
#dlg { position: fixed; inset: 0; z-index: 70; background: #0f2a3388; display: flex; align-items: center; justify-content: center; }
#dlg .ven { background: #fff; width: min(560px, 94vw); max-height: 86vh; overflow: auto; border-radius: 10px; box-shadow: 0 12px 40px #0006; }
#dlg .cab { display: flex; align-items: center; gap: 8px; padding: 10px 14px; background: #0f2a33; color: #fff; border-radius: 10px 10px 0 0; font-weight: 700; }
#dlg.peligro .cab { background: var(--peligro); }
#dlg .cab .x { margin-left: auto; background: transparent; color: #fff; border: 0; font-size: 17px; padding: 0 6px; }
#dlg .cuerpo { padding: 14px; }
#dlg .cuerpo ul { margin: 6px 0; padding-left: 20px; max-height: 220px; overflow: auto; }
#dlg .botones { display: flex; gap: 8px; justify-content: flex-start; padding: 0 14px 14px; flex-wrap: wrap; }
button.rojo { background: var(--peligro); color: #fff; border-color: var(--peligro); }
button.rojo:disabled { opacity: .4; }
#procImp { position: fixed; inset: 0; z-index: 80; background: #0f2a3355; display: flex; align-items: center; justify-content: center; }
#procImp .ven { background: #fff; border-radius: 10px; box-shadow: 0 12px 40px #0005; width: min(440px, 92vw); padding: 16px 18px; }
#procImp .tit { font-weight: 700; margin-bottom: 8px; }
#procImp .txt { color: var(--suave); margin: 8px 0 0; min-height: 1.3em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#procImp .barra { height: 8px; background: var(--acento-2); border-radius: 4px; overflow: hidden; }
#procImp .barra div { height: 100%; background: var(--acento); width: 0; transition: width .15s; }
#bandaPrevia { background: #a35a00; color: #fff; padding: 4px 10px; border-radius: 8px; display: flex; gap: 10px; align-items: center; }
#bandaPrevia button { background: #fff; color: #a35a00; border-color: #fff; }
#bandaSinMigrar { background: #ffd54a; color: #4a3400; padding: 4px 10px; border-radius: 8px; font-weight: 600; cursor: pointer; border: 1px solid #c99a00; }
.sinmig { color: #a35a00; font-weight: 700; cursor: help; white-space: nowrap; }
.sinmig.ok { color: #1f7a3b; font-weight: 400; }
#informeImp pre { background: #f6f8fa; border: 1px solid var(--borde, #d0d7de); border-radius: 6px; padding: 10px; max-height: 55vh; overflow: auto; white-space: pre-wrap; font-size: 12px; margin: 0; }
#ayuda { position: fixed; inset: 0; z-index: 90; background: #0f2a3399; display: flex; align-items: center; justify-content: center; }
#ayuda .ven { background: #fff; width: min(1200px, 96vw); height: min(860px, 94vh); border-radius: 10px; box-shadow: 0 12px 40px #0006; display: grid; grid-template-rows: auto 1fr; overflow: hidden; }
#ayuda .cab { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: #0f2a33; color: #fff; }
#ayuda .cab .sol { background: transparent; color: #cfe3ea; border: 1px solid #ffffff40; }
#ayuda .cab .sol.act { background: #fff; color: #0f2a33; }
#ayuda .cab input { margin-left: 12px; width: 260px; }
#ayuda .cab .cuenta { font-size: 12px; opacity: .8; }
#ayuda .cab .x { margin-left: auto; background: transparent; color: #fff; border: 0; font-size: 18px; line-height: 1; padding: 2px 8px; }
#ayuda .cab .x:hover { background: var(--peligro); }
#ayuda .cuerpoA { display: grid; grid-template-columns: 290px 1fr; min-height: 0; }
#ayuda .indice { overflow: auto; border-right: 1px solid var(--borde); padding: 8px 0; font-size: 13px; }
#ayuda .indice a { display: block; padding: 3px 12px; color: var(--texto); text-decoration: none; cursor: pointer; }
#ayuda .indice a.n3 { padding-left: 26px; font-size: 12px; color: var(--suave); }
#ayuda .indice a:hover, #ayuda .indice a.act { background: #e8f2f6; }
#ayuda .doc { overflow: auto; padding: 10px 28px 40px; font-size: 14px; line-height: 1.5; }
#ayuda .doc table { border-collapse: collapse; margin: 8px 0; font-size: 13px; }
#ayuda .doc th, #ayuda .doc td { border: 1px solid var(--borde); padding: 3px 7px; vertical-align: top; }
#ayuda .doc th { background: #f0f5f7; }
#ayuda .doc pre { background: #f4f7f8; border: 1px solid var(--borde); padding: 8px 10px; overflow: auto; font-size: 12.5px; }
#ayuda .doc code { background: #f4f7f8; padding: 0 3px; border-radius: 3px; font-size: 12.5px; }
#ayuda .doc pre code { background: none; padding: 0; }
#ayuda .doc h1 { font-size: 22px; } #ayuda .doc h2 { font-size: 18px; border-bottom: 1px solid var(--borde); padding-bottom: 3px; margin-top: 26px; } #ayuda .doc h3 { font-size: 15px; }
#ayuda .doc mark { background: #ffe58a; } #ayuda .doc mark.actual { background: #ff9d2e; }
#ayuda .doc .destacado { animation: destacarA 2s ease-out; }
@keyframes destacarA { from { background: #ffe58a; } to { background: transparent; } }
</style>
</head>
<body>
<div id="barra">
  <span class="marca">OPTIMIST Designer</span>
  <button id="bAbrir" title="Elegir la carpeta del proyecto o src/main/resources/trn">📂 Abrir carpeta</button>
  <button id="bArchivo" title="Abrir un solo YAML (TRN, web panel, impresión o consulta); se graba en el mismo lugar">📄 Abrir archivo</button>
  <button id="bNueva" title="Crear una aplicación nueva de OPTIMIST Engine (pom, menú, dominios, usuarios, configuración)">✨ Nueva aplicación</button>
  <button id="bImportar" title="Importar transacciones desde el export XML o XPZ de una KB de GeneXus">⬇ Importar de GeneXus</button>
  <select id="lista" disabled><option>— sin carpeta —</option></select>
  <button id="bDeshacer" disabled title="Ctrl+Z">↶ Deshacer</button>
  <button id="bRehacer" disabled title="Ctrl+Y">↷ Rehacer</button>
  <button id="bGuardar" class="primario" disabled title="Ctrl+S">💾 Guardar</button>
  <button id="bClases" title="Crear o cambiar clases (estilos con nombre) y ver cómo quedan">🎨 Clases</button>
  <span class="orden"><button id="bVoz" title="Dictale al diseñador: «poné AlmacenesDescrip en negrita»">🎤</button><input id="orden" type="text" placeholder="Decime qué hacer… (ej: poné AlmacenesDescrip en negrita)"></span>
  <button id="bAyuda" title="Manual del desarrollador y guía de los YAML (abre en el tema de lo que estás haciendo)">❓ Ayuda</button>
  <span class="estado" id="estado"></span>
</div>
<div id="cuerpo">
  <div class="panel" id="izq"><div class="titulo-panel">Estructura</div><div id="arbol"></div></div>
  <div id="centro"></div>
  <div class="panel" id="props"><div class="vacio-props">Elegí un elemento del árbol o del formulario para ver sus propiedades.</div></div>
</div>
<div id="pie"><span id="pieInfo">Arrastrá campos para moverlos · Botón derecho para sus propiedades rápidas</span><span id="pieErr" class="err"></span></div>
<div id="menu"></div>
<input type="file" id="inArchivo" accept=".yaml,.yml" hidden>
<input type="file" id="inGx" accept=".xml,.xpz" hidden>
<div id="imp"></div>

    if (cond && (textoDe(cond, 'Source') || '').trim()) kb.ww_cond[n.slice(2).toLowerCase()] = textoDe(cond, 'Source');
  } else if (t === T_INST) {
    const p = hijo(el, 'Part'), d = p ? hijo(p, 'Data') : null;
    const r = wwDeInstancia(d ? d.t : '');
    if (r) kb.ww_inst[r[0].toLowerCase()] = r[1];
  } else if (t === T_TAB) {
    kb.tablas[n] = hijo(el, 'Part') ? [...recorrer(el, 'Item')].map(i => i.t.trim()) : [];
    kb.indices[n] = ordenado(new Set([...recorrer(el, 'Member')].map(m => (m.t || '').trim())));
  } else if (t === T_TRN) {
    kb.checksums[n] = el.a.checksum || '';
    const parts = {};
    for (const p of hijos(el, 'Part')) parts[p.a.type] = p;
    const st = parts[P_STRUCT];
    if (st) kb.trns[n] = { desc: el.a.description, niveles: hijos(st, 'Level').map(nivel) };
    const src = k => parts[k] ? (textoDe(parts[k], 'Source') || '') : '';
    kb.objetivos[n] = { webform: src(P_WEBFORM), reglas: src(P_RULES), eventos: src(P_EVENTS) };
    kb.info[n] = { modulo: el.a.moduleGuid || '', nombreCompleto: el.a.fullyQualifiedName || n, fecha: el.a.lastUpdate || '' };
  }
}

function normalizarKb(kb) {
  for (const a of Object.values(kb.attrs || {}))
    if (a.DomainKey && !a.idBasedOn && !a.ATTCUSTOMTYPE) a.idBasedOn = 'Domain:' + a.DomainKey;
  return kb;
}

/**
 * Lee la KB de un stream de texto (ReadableStream de strings o un iterable asíncrono de strings).
 * avance(bytesLeidos) se llama de vez en cuando.
 */
async function leerKbTexto(trozos, avance) {
  const kb = kbVacia();
  let buf = '', seccion = null, leidos = 0, cabecera = '';
  const proximo = /<(\/?)(Objects|Attributes)\s*>|<(Object|Attribute)[\s>]/g;
  const consumir = (final) => {
    let pos = 0;
    for (;;) {
      proximo.lastIndex = pos;
      const m = proximo.exec(buf);
      if (!m) { pos = Math.max(pos, buf.length - 20); break; }   // deja la cola por si un tag quedó partido
      if (m[2]) { seccion = m[1] ? null : m[2]; pos = proximo.lastIndex; continue; }
      const tag = m[3];
      if ((tag === 'Object' && seccion !== 'Objects') || (tag === 'Attribute' && seccion !== 'Attributes')) { pos = m.index + 1; continue; }
      const cierre = '</' + tag + '>';
      // un elemento vacío (<Object ... />)
      const finTag = buf.indexOf('>', m.index);
      if (finTag < 0) { pos = m.index; break; }
      if (buf[finTag - 1] === '/') { procesar(kb, buf.slice(m.index, finTag + 1)); pos = finTag + 1; continue; }
      // el cierre que le corresponde: algunos objetos (temas, design systems) tienen otros <Object> adentro
      const reAnid = new RegExp('<' + tag + '[\\s>]|' + cierre, 'g');
      reAnid.lastIndex = finTag + 1;
      let prof = 1, fin = -1, x;
      while ((x = reAnid.exec(buf))) {
        if (x[0] === cierre) { if (--prof === 0) { fin = x.index; break; } }
        else if (buf[buf.indexOf('>', x.index) - 1] !== '/') prof++;
      }
      if (fin < 0) { pos = m.index; break; }   // falta leer más
      procesar(kb, buf.slice(m.index, fin + cierre.length));
      pos = fin + cierre.length;
    }
    if (!final) buf = buf.slice(pos);
  };
  for await (const t of trozos) {
    if (cabecera.length < 4000) cabecera += t.slice(0, 4000 - cabecera.length);
    buf += t; leidos += t.length;
    if (buf.length > 1 << 20) consumir(false);
    if (avance) avance(leidos);
  }
  consumir(true);
  const mv = cabecera.match(/<KMW>\s*<MajorVersion>(\d+)<\/MajorVersion>\s*<MinorVersion>(\d+)<\/MinorVersion>\s*<Build>(\d+)<\/Build>/);
  if (mv) kb.version = mv[1] + '.' + mv[2] + '.' + mv[3];
  const nk = cabecera.match(/<KnowledgeBase name="([^"]*)"/);
  kb.nombre = nk ? unescapeXml(nk[1]) : '';
  return normalizarKb(kb);
}

/** Bytes (ReadableStream<Uint8Array>) -> texto, por partes. */
async function* textoDeBytes(stream) {
  const dec = new TextDecoder('utf-8');
  const r = stream.getReader();
  for (;;) {
    const { done, value } = await r.read();
    if (done) break;
    yield dec.decode(value, { stream: true });
  }
  const resto = dec.decode();
  if (resto) yield resto;
}

/** Los XML de adentro de un XPZ (zip). archivo: Blob/File. Devuelve [{nombre, abrir: () => ReadableStream<Uint8Array>}]. */
async function xmlsDeZip(archivo) {
  const tam = archivo.size;
  const cola = new DataView(await archivo.slice(Math.max(0, tam - 66000), tam).arrayBuffer());
  let eocd = -1;
  for (let i = cola.byteLength - 22; i >= 0; i--) if (cola.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  if (eocd < 0) throw new Error('el archivo no es un XPZ (zip) válido');
  let total = cola.getUint16(eocd + 10, true), tamCd = cola.getUint32(eocd + 12, true), iniCd = cola.getUint32(eocd + 16, true);
  if (iniCd === 0xffffffff) throw new Error('XPZ de más de 4 GB (zip64): exportá un XML en su lugar');
  const cd = new DataView(await archivo.slice(iniCd, iniCd + tamCd).arrayBuffer());
  const r = [];
  for (let p = 0, i = 0; i < total; i++) {
    if (cd.getUint32(p, true) !== 0x02014b50) break;
    const metodo = cd.getUint16(p + 10, true), comp = cd.getUint32(p + 20, true);
    const ln = cd.getUint16(p + 28, true), le = cd.getUint16(p + 30, true), lc = cd.getUint16(p + 32, true);
    const local = cd.getUint32(p + 42, true);
    const nombre = new TextDecoder().decode(new Uint8Array(cd.buffer, cd.byteOffset + p + 46, ln));
    p += 46 + ln + le + lc;
    if (!/\.xml$/i.test(nombre)) continue;
    r.push({ nombre, tamano: comp, abrir: async () => {
      const lh = new DataView(await archivo.slice(local, local + 30).arrayBuffer());
      const ini = local + 30 + lh.getUint16(26, true) + lh.getUint16(28, true);
      const datos = archivo.slice(ini, ini + comp).stream();
      if (metodo === 0) return datos;
      if (metodo === 8) return datos.pipeThrough(new DecompressionStream('deflate-raw'));
      throw new Error('el XPZ usa una compresión que no se conoce (' + metodo + ')');
    } });
  }
  return r;
}

/** Lee un archivo .xml o .xpz (Blob/File con .name). avance(fraccion 0..1). */
async function leerArchivo(archivo, avance) {
  if (/\.xpz$/i.test(archivo.name || '') || (await archivo.slice(0, 2).text()) === 'PK') {
    const xs = await xmlsDeZip(archivo);
    if (!xs.length) throw new Error('el XPZ no tiene ningún XML adentro');
    xs.sort((a, b) => b.tamano - a.tamano);   // el export es el XML grande
    const total = archivo.size * 6;           // estimado (el XML comprimido ocupa ~1/6)
    return leerKbTexto(textoDeBytes(await xs[0].abrir()), n => avance && avance(Math.min(0.99, n / total)));
  }
  return leerKbTexto(textoDeBytes(archivo.stream()), n => avance && avance(Math.min(0.99, n / archivo.size)));
}

// ----------------------------------------------------------------------------- modelo

const DOMINIOS_GENEXUS = {
  'Address, GeneXus': { ATTCUSTOMTYPE: 'bas:VarChar', Length: '1024' },
  'Email, GeneXus': { ATTCUSTOMTYPE: 'bas:VarChar', Length: '100' },
  'Url, GeneXus': { ATTCUSTOMTYPE: 'bas:VarChar', Length: '1000' },
  'Phone, GeneXus': { ATTCUSTOMTYPE: 'bas:Character', Length: '20' },
  'Html, GeneXus': { ATTCUSTOMTYPE: 'bas:LongVarChar', Length: '2000' },
  'Geolocation, GeneXus': { ATTCUSTOMTYPE: 'bas:Character', Length: '50' },
  'Time, GeneXus': { ATTCUSTOMTYPE: 'bas:DateTime' },
};
const conCT = (base, fuente) => { const r = Object.assign({}, base); if ('ControlType' in fuente) r.ControlType = fuente.ControlType; return r; };

class Modelo {
  constructor(kb) {
    this.kb = kb;
    this.tablaPorClaves = new Map();
    for (const [k, v] of Object.entries(kb.tablas)) if (v.length) this.tablaPorClaves.set(claveSet(v), k);
    this.clavesDe = new Map(Object.entries(kb.tablas).map(([k, v]) => [k, new Set(v)]));
    this.todasLasClaves = new Set(); for (const s of this.clavesDe.values()) for (const x of s) this.todasLasClaves.add(x);
    this.noClaves = new Map(); this.noClavesLit = new Map(); this._niveles = [];
    for (const trn of Object.values(kb.trns)) for (const lv of trn.niveles) this._recorrer(lv, []);
    let base = this.noClaves, baseLit = this.noClavesLit;
    for (let pasada = 0; pasada < 2; pasada++) {
      this.guardados = new Map(); this.guardadosLit = new Map();
      for (const [tabla, atts, todos] of this._niveles)
        for (const n of atts)
          if (!this._inferidoEn(n, tabla, todos, base, baseLit)) {
            if (!this.guardados.has(tabla)) this.guardados.set(tabla, new Set());
            this.guardados.get(tabla).add(n); this.guardados.get(tabla).add(this.norm(n));
            if (!this.guardadosLit.has(tabla)) this.guardadosLit.set(tabla, new Set());
            this.guardadosLit.get(tabla).add(n);
          }
      base = this.guardados; baseLit = this.guardadosLit;
    }
  }
  _inferidoEn(n, tabla, todos, base, baseLit) {
    const gs = this.grupos(n);
    if (gs.size) {
      const miembros = new Set(todos.filter(c => hayInter(this.grupos(c), gs)).map(c => this.norm(c)));
      const na = this.norm(n);
      for (const k2 of this.clavesDe.values()) if (k2.size && esSub(k2, miembros) && !k2.has(na)) return true;
      return false;
    }
    const lit = new Set(todos);
    for (const [t2, k2] of this.clavesDe) if (t2 !== tabla && k2.size && esSub(k2, lit) && !k2.has(n) && (baseLit.get(t2) || new Set()).has(n)) return true;
    return false;
  }
  _recorrer(lv, clavesPadre) {
    const claves = clavesPadre.concat(lv.atts.filter(a => a.key).map(a => a.n));
    const tabla = this.tablaPorClaves.get(claveSet(claves));
    if (tabla) {
      if (!this.noClaves.has(tabla)) this.noClaves.set(tabla, new Set());
      if (!this.noClavesLit.has(tabla)) this.noClavesLit.set(tabla, new Set());
      const s = this.noClaves.get(tabla), sl = this.noClavesLit.get(tabla);
      const atts = lv.atts.filter(a => !a.key && !this.formula(a.n)).map(a => a.n);
      for (const n of atts) { s.add(n); s.add(this.norm(n)); sl.add(n); }
      this._niveles.push([tabla, atts, claves.concat(lv.atts.map(a => a.n))]);
    }
    for (const sub of lv.niveles) this._recorrer(sub, claves);
  }
  columnaEn(n, tabla) {
    const visto = new Set(); let a = n;
    while (!visto.has(a)) {
      if ((this.guardadosLit.get(tabla) || new Set()).has(a)) return a;
      visto.add(a);
      if (!(a in this.kb.subs)) break;
      a = this.kb.subs[a].super;
    }
    return this.norm(n);
  }
  norm(a) { const visto = new Set(); while (a in this.kb.subs && !visto.has(a)) { visto.add(a); a = this.kb.subs[a].super; } return a; }
  grupos(a) { const s = this.kb.subs[a]; return s ? new Set(s.grupos && s.grupos.length ? s.grupos : [s.grupo]) : new Set(); }
  formula(a) { return (this.kb.attrs[a] || {}).Formula || null; }
  /** [dominio, 'Tipo(l.d)', valores|null, fuente] */
  tipo(a) {
    const base = this.norm(a);
    const p = this.kb.attrs[a] || {}, pb = this.kb.attrs[base] || {};
    let fuente = (p.ATTCUSTOMTYPE || p.idBasedOn) ? p : pb;
    let dom = null;
    if ((fuente.idBasedOn || '').startsWith('Domain:')) {
      dom = splitN(fuente.idBasedOn, ':', 1)[1];
      if (!(dom in this.kb.doms) && dom in DOMINIOS_GENEXUS) fuente = conCT(DOMINIOS_GENEXUS[dom], fuente);
      else fuente = conCT(this.kb.doms[dom] || {}, fuente);
    }
    const t = (fuente.ATTCUSTOMTYPE || 'bas:Numeric').split(':').pop();
    let lon = parseInt(fuente.Length || 0, 10) || 0;
    const dec = parseInt(fuente.Decimals || 0, 10) || 0;
    const mapa = { Numeric: 'Numeric', Character: 'Character', VarChar: 'VarChar', LongVarChar: 'VarChar', Date: 'Date', DateTime: 'DateTime', Boolean: 'Boolean', GUID: 'GUID' };
    const tt = Object.prototype.hasOwnProperty.call(mapa, t) ? mapa[t] : null;
    if (tt === 'GUID') return [dom, 'GUID', null, fuente];
    if (tt == null) return [dom, null, null, fuente];
    let txt;
    if (tt === 'Numeric') { lon = lon || 4; txt = dec ? `Numeric(${lon}.${dec})` : `Numeric(${lon})`; }
    else if (tt === 'Character' || tt === 'VarChar') { if (t === 'LongVarChar' && lon < 1) lon = 2097152; lon = lon || 20; txt = `${tt}(${lon})`; }
    else txt = tt;
    let en = null;
    if (fuente.IDEnumDefinedValues) {
      en = [];
      for (const parte of fuente.IDEnumDefinedValues.split(';')) {
        const v = splitN(parte, ',', 2).map(x => x.trim());
        if (v.length === 3) en.push({ valor: strip(v[0].trim(), '"'), nombre: v[1], texto: v[2] });
      }
    }
    if (en == null && tt !== 'Boolean') {
      for (const fp of [p, pb]) {
        if (fp.ControlType === 'Combo Box' && fp.ControlValues) {
          en = [];
          for (const parte of fp.ControlValues.split(',')) {
            if (!parte.includes(':')) continue;
            const i = parte.lastIndexOf(':'), texto = parte.slice(0, i), valor = parte.slice(i + 1);
            en.push({ valor: strip(valor.trim(), '"'), nombre: texto.trim(), texto: texto.trim() });
          }
          if (en.length) dom = dom == null ? base[0].toUpperCase() + base.slice(1) : dom;
          else en = null;
          break;
        }
      }
    }
    return [dom, txt, en, fuente];
  }
  valorInicial(a) {
    const p = this.kb.attrs[a] || {};
    const v = (p.ATT_INITIAL_VALUE || '').trim();
    if (!v) return null;
    if (v.toLowerCase() === 'true' || v.toLowerCase() === 'false') return v.toLowerCase() === 'true';
    if (/^-?\d+$/.test(v)) return new Num(v, false);
    if (/^-?\d+\.\d+$/.test(v)) return new Num(v, true);
    const m = v.match(/^["'](.*)["']$/);
    return m ? m[1] : null;
  }
  autonumerico(a) { const f = this.tipo(a)[3]; return f.AUTONUMBER === 'True' || (this.kb.attrs[a] || {}).AUTONUMBER === 'True'; }
  etiqueta(a) { const p = this.kb.attrs[a] || this.kb.attrs[this.norm(a)] || {}; return p.ContextualTitle || p.Description || p._desc || a; }

  analizarNivel(atts, clavesPadre, ctxExtra) {
    const claves = clavesPadre.concat(atts.filter(a => a.key).map(a => a.n));
    const tabla = this.tablaPorClaves.get(claveSet(claves)) || null;
    const ctx = atts.map(a => a.n).concat(clavesPadre, ctxExtra);
    const propios = [], inferidos = new Map(), formulas = [], descartados = [];
    const refs = new Map();   // clave "t2|fk" -> {t2, fk, trae: [[l, r]]}
    const ctxSimple = new Set(ctx.filter(c => !this.grupos(c).size));
    for (const a of atts) {
      const n = a.n;
      if (a.key) continue;
      if (this.formula(n)) { formulas.push(n); continue; }
      if (this.formula(this.norm(n))) { descartados.push(n); continue; }
      const gs = this.grupos(n);
      let elegido = null;
      if (gs.size) {
        const miembros = new Map();
        for (const c of ctx) if (hayInter(this.grupos(c), gs)) miembros.set(this.norm(c), c);
        const mset = new Set(miembros.keys()), na = this.norm(n);
        let cands = [...this.clavesDe].filter(([t2, k2]) => k2.size && esSub(k2, mset) && !k2.has(na) && (this.guardados.get(t2) || new Set()).has(na)).map(x => x[0]);
        if (!cands.length)
          cands = [...this.clavesDe].filter(([t2, k2]) => k2.size && esSub(k2, mset) && !k2.has(na) && (this.noClaves.get(t2) || new Set()).has(na)).map(x => x[0]);
        if (cands.length) {
          let t2 = cands[0];
          for (const c of cands) if (this.clavesDe.get(c).size > this.clavesDe.get(t2).size) t2 = c;
          elegido = [t2, ordenado(this.clavesDe.get(t2)).map(k => [miembros.get(k), k]), this.columnaEn(n, t2)];
        }
      }
      if (elegido == null) {
        const cands = [...this.clavesDe].filter(([t2, k2]) => k2.size && t2 !== tabla && esSub(k2, ctxSimple) && !k2.has(n) && (this.guardados.get(t2) || new Set()).has(n)).map(x => x[0]);
        if (cands.length) {
          const clave = t => [commonPrefix(t, n), -this.clavesDe.get(t).size];
          let t2 = cands[0];
          for (const c of cands) { const a1 = clave(c), b1 = clave(t2); if (a1[0] > b1[0] || (a1[0] === b1[0] && a1[1] > b1[1])) t2 = c; }
          elegido = [t2, ordenado(this.clavesDe.get(t2)).map(k => [k, k]), n];
        }
      }
      if (elegido == null && gs.size && !this.todasLasClaves.has(this.norm(n))
          && Object.entries(this.kb.subs).some(([x, e]) => hayInter(gs, new Set(e.grupos && e.grupos.length ? e.grupos : [e.grupo])) && this.todasLasClaves.has(this.norm(x)))) {
        descartados.push(n); continue;
      }
      if (elegido == null) { propios.push(n); continue; }
      const [t2, fk, col] = elegido;
      const k = t2 + '|' + JSON.stringify(fk);
      if (!refs.has(k)) refs.set(k, { t2, fk, trae: [] });
      refs.get(k).trae.push([n, col]);
      inferidos.set(n, [t2, fk]);
    }
    return { tabla, claves, propios, inferidos, formulas, refs, descartados };
  }
  atributoDescripcion(tabla) {
    for (const trn of Object.values(this.kb.trns)) for (const lv of trn.niveles) { const r = this._buscarDesc(lv, [], tabla); if (r) return r; }
    return null;
  }
  _buscarDesc(lv, cp, tabla) {
    const claves = cp.concat(lv.atts.filter(a => a.key).map(a => a.n));
    if (this.tablaPorClaves.get(claveSet(claves)) === tabla && sinNone(lv.descAtt)) return sinNone(lv.descAtt);
    for (const s of lv.niveles) { const r = this._buscarDesc(s, claves, tabla); if (r) return r; }
    return null;
  }
}

// ----------------------------------------------------------------------------- web form y reglas

function gx17AHtml(s) {
  const m = s.match(/<Form id="1"[^>]*>(.*?)<\/Form>/s);
  s = m ? m[1] : s;
  s = s.split(/<actionGroups>/)[0];
  s = s.replace(/PATTERN_ELEMENT_CUSTOM_PROPERTIES="[^"]*"/g, '');
  const atributo = (a, tag) => { const r = tag.match(new RegExp('\\b' + a + '="([^"]*)"')); return r ? r[1] : null; };
  s = s.replace(/<simplegrid\b([^>]*)>(.*?)<\/simplegrid>/gs, (m0, g1, g2) => {
    const nombre = atributo('controlName', g1) || 'GridLevel';
    let cols = '';
    for (const it of g2.matchAll(/<item\b[^>]*\/?>/g)) {
      const a = atributo('attribute', it[0]);
      if (!a) continue;
      const tit = atributo('titleExp', it[0]) || atributo('title', it[0]) || a;
      const vis = atributo('visible', it[0]) === 'False' ? 'False' : 'True';
      cols += `<gxColumn ColAttId="${a}" ColTitleExpression="${tit}" ColVisible="${vis}" />`;
    }
    return `<gxGrid ControlName="${nombre}">${cols}</gxGrid>`;
  });
  // E4b: las solapas de GeneXus 17 (<tab><item itemControlName=.. caption=..>...</item></tab>) como las de GeneXus 15
  let nSolapa = 0;
  s = s.replace(/<tab\b[^>]*>/g, '<gxgxui.TabPanel>').split('</tab>').join('</gxgxui.TabPanel>');
  s = s.replace(/<item\b[^>]*\bitemControlName="[^"]*"[^>]*>/g, m0 => {
    nSolapa++;
    const cap = atributo('caption', m0) || atributo('itemControlName', m0) || 'Solapa ' + nSolapa;
    return `<container containerId="TitletabPanel${nSolapa}">${cap}</container><container containerId="tabPanel${nSolapa}">`;
  }).split('</item>').join('</container>');
  s = s.replace(/<textblock\b[^>]*\/>/g, m0 => { const cap = atributo('caption', m0); return cap ? `<gxTextBlock CaptionExpression="${cap}" />` : ''; });
  s = s.replace(/<data\b[^>]*\/>/g, tag => {
    const att = atributo('attribute', tag);
    if (!att) return '';
    const cap = atributo('labelCaption', tag);
    const txt = cap && atributo('labelPosition', tag) !== 'None' ? `<gxTextBlock CaptionExpression="${cap}" />` : '';
    return txt + `<gxAttribute AttID="${att}" />`;
  });
  s = s.replace(/<row\b/g, '<tr').split('</row>').join('</tr>');
  s = s.replace(/<cell\b/g, '<td').split('</cell>').join('</td>');
  return s;
}

function leerSolapas(webform) {
  let s = webform;
  if (s.slice(0, 400).includes('type="layout"')) s = gx17AHtml(s);
  const internos = [], pila = [];
  let fin = -1;
  for (const m of s.matchAll(/<gxgxui\.TabPanel[ >]|<\/gxgxui\.TabPanel>/g)) {
    if (m[0].startsWith('</')) {
      if (!pila.length) continue;
      const ini = pila.pop();
      if (pila.length) internos.push([ini, m.index + m[0].length]);
      else { fin = m.index; break; }
    } else pila.push(m.index);
  }
  if (fin > 0) s = s.slice(0, fin);
  const dentro = p => internos.some(([a, b]) => a <= p && p < b);
  let pos = [...s.matchAll(/<container containerId="(tabPanel\d+)"/g)].filter(m => !dentro(m.index)).map(m => [m[1], m.index]);
  let titulos = {};
  for (const m of s.matchAll(/<container containerId="Title(tabPanel\d+)">([^<]*)/g))

        const op = [it.titulo, it.abierto === false && 'cerrado', it.ancho && 'ancho=' + it.ancho, it.alinear && 'alinear=' + it.alinear, it.ocultarVacio && 'ocultarVacio'].filter(Boolean).join(' ');
        L.push(sp(ind) + '<panel' + (op ? ' ' + op : '') + '>'); emitir(it.items, ind + 2); L.push(sp(ind) + '<endpanel>');
      } else if (it.t === 'renglon') {
        L.push(sp(ind) + '<renglon>'); emitir(it.items, ind + 2); L.push(sp(ind) + '<endrenglon>');
      } else if (it.t === 'detalle') L.push(sp(ind) + '<detalle ' + [it.nombre, it.completo && 'completo', it.sinTitulo && 'sinTitulo', it.alinear && 'alinear=' + it.alinear].filter(Boolean).join(' ') + '>');
      else if (it.t === 'coment') L.push(sp(ind) + it.texto);
    }
  };
  emitir(p.items, 2);
  return '|\n' + L.join('\n') + '\n';
}

function textoColumnas(ww) {
  return '[' + ww.columnas.map(c => c.titulo ? q(c.campo + ': ' + c.titulo) : c.campo).join(', ') + ']';
}

function generarTexto() {
  const t = A.texto, m = A.m, o = A.orig, r = A.rangos;
  const cambios = [];     // {ini, fin, txt}
  const todos = (mm) => mm.campos.concat(...mm.detalles.map(d => d.campos));
  const origPor = new Map(todos(o).map(c => [c.nivel + '|' + c.vals.nombre, c]));
  // V49o: el orden de las columnas de un detalle es el orden de sus campos: si cambió, cada renglón de campo del YAML
  // (en su lugar de siempre) recibe el campo que ahora va en esa posición
  const reordenados = new Set();
  for (const d of m.detalles) {
    const od = o.detalles.find(x => x.nombre === d.nombre); if (!od) continue;
    const a = d.campos.map(c => c.vals.nombre), b = od.campos.map(c => c.vals.nombre);
    if (igual(a, b) || a.length !== b.length || !od.campos.every(c => r.campos[d.nombre + '|' + c.vals.nombre])) continue;
    reordenados.add(d.nombre);
    const lugares = od.campos.map(c => r.campos[d.nombre + '|' + c.vals.nombre]).sort((x, y) => x[0] - y[0]);
    d.campos.forEach((c, i) => {
      const k = d.nombre + '|' + c.vals.nombre, oc = origPor.get(k);
      const txt = oc && !igual(oc.vals, c.vals) ? mapaCampo(c, oc) : t.slice(r.campos[k][0], r.campos[k][1]);
      cambios.push({ ini: lugares[i][0], fin: lugares[i][1], txt });
    });
  }
  for (const c of todos(m)) {
    if (reordenados.has(c.nivel)) continue;
    const k = c.nivel + '|' + c.vals.nombre, oc = origPor.get(k);
    if (oc && !igual(oc.vals, c.vals) && r.campos[k]) cambios.push({ ini: r.campos[k][0], fin: r.campos[k][1], txt: mapaCampo(c, oc) });
  }
  // V65f: el título de cada detalle (el que se ve arriba de su grilla y en los mensajes)
  for (const d of m.detalles) {
    const od = o.detalles.find(x => x.nombre === d.nombre);
    if (od && od.titulo !== d.titulo && r.detTitulo[d.nombre] && d.titulo.trim()) cambios.push({ ini: r.detTitulo[d.nombre][0], fin: r.detTitulo[d.nombre][1], txt: q(d.titulo.trim()) });
  }
  const faltan = [];
  for (const k of Object.keys(m.top)) {
    if (m.top[k] === o.top[k]) continue;
    if (r.top[k]) cambios.push({ ini: r.top[k][0], fin: r.top[k][1], txt: m.top[k] === '' ? '""' : q(m.top[k]) });
    else if (m.top[k] !== '') faltan.push(k + ': ' + q(m.top[k]));
  }
  if (faltan.length) {
    const ancla = r.top.titulo || r.top.singular;
    const fin = ancla ? t.indexOf('\n', ancla[1]) : -1;
    if (fin >= 0) cambios.push({ ini: fin, fin: fin, txt: '\n' + faltan.join('\n') });
  }
  if (!igual(m.pantalla, o.pantalla) && m.pantalla) {
    if (r.pantalla) cambios.push({ ini: r.pantalla[0], fin: r.pantalla[1], txt: textoPantalla(m.pantalla) });
    else {
      const w = t.search(/^workwith:/m);
      const pos = w >= 0 ? w : t.length;
      cambios.push({ ini: pos, fin: pos, txt: 'pantalla: ' + textoPantalla(m.pantalla) });
    }
  }
  if (!igual(m.ww.columnas, o.ww.columnas) && r.columnas)
    cambios.push({ ini: r.columnas[0], fin: r.columnas[1], txt: textoColumnas(m.ww) });
  if (!igual(m.ww.anchos, o.ww.anchos)) {
    const hay = Object.keys(m.ww.anchos).length;
    const txt = '{' + Object.entries(m.ww.anchos).map(([k, v]) => k + ': ' + v).join(', ') + '}';
    if (r.anchos) {
      if (hay) cambios.push({ ini: r.anchos[0], fin: r.anchos[1], txt });
      else { // borrar el renglón entero de anchos
        const ini = t.lastIndexOf('\n', r.anchos[0]), fin = t.indexOf('\n', r.anchos[1]);
        cambios.push({ ini, fin: fin < 0 ? t.length : fin, txt: '' });
      }
    } else if (hay && r.columnas) {
      const fin = t.indexOf('\n', r.columnas[1]);
      cambios.push({ ini: fin < 0 ? t.length : fin, fin: fin < 0 ? t.length : fin, txt: '\n  anchos: ' + txt });
    }
  }
  if (!igual(m.orden, o.orden)) {   // V66: orden inicial del WorkWith (renglón 'orden:' de arriba de todo)
    const txt = '[' + m.orden.map(x => x.campo + (x.desc ? ' DESC' : '')).join(', ') + ']';
    if (r.orden) {
      if (m.orden.length) cambios.push({ ini: r.orden[0], fin: r.orden[1], txt });
      else {   // sin orden: se borra el renglón entero
        const ini = t.lastIndexOf('\n', r.orden[0]), fin = t.indexOf('\n', r.orden[1]);
        cambios.push({ ini: Math.max(0, ini), fin: fin < 0 ? t.length : fin, txt: '' });
      }
    } else if (m.orden.length) {
      // va después del bloque workwith (como en las TRN que ya lo tienen); si no hay, al final
      let pos = t.length;
      if (r.workwith) { const re = /\n(?=[A-Za-z_])/g; re.lastIndex = r.workwith[0]; const mm = re.exec(t); if (mm) pos = mm.index + 1; }
      cambios.push({ ini: pos, fin: pos, txt: (pos === t.length && !t.endsWith('\n') ? '\n' : '') + 'orden: ' + txt + (pos === t.length ? '' : '\n') });
    }
  }
  if (!igual(m.ww.filtro, o.ww.filtro)) {   // V43
    const hay = m.ww.filtro.length;
    const val = f => { const v = (f.op === '=' ? '' : f.op) + f.valor; return /^-?\d+(\.\d+)?$/.test(v) ? v : '"' + v.replace(/"/g, '\\"') + '"'; };
    const txt = '{' + m.ww.filtro.map(f => f.campo + ': ' + val(f)).join(', ') + '}';
    if (r.filtro) {
      if (hay) cambios.push({ ini: r.filtro[0], fin: r.filtro[1], txt });
      else {
        const ini = t.lastIndexOf('\n', r.filtro[0]), fin = t.indexOf('\n', r.filtro[1]);
        cambios.push({ ini, fin: fin < 0 ? t.length : fin, txt: '' });
      }
    } else if (hay && r.columnas) {
      const fin = t.indexOf('\n', r.columnas[1]);
      cambios.push({ ini: fin < 0 ? t.length : fin, fin: fin < 0 ? t.length : fin, txt: '\n  filtro: ' + txt });
    }
  }
  if (!igual(m.ww.clases, o.ww.clases)) {   // V48e
    const cl = Object.entries(m.ww.clases).filter(([k, v]) => v && m.ww.columnas.some(c => c.campo === k));
    const txt = '{' + cl.map(([k, v]) => k + ': ' + (listaClases(v).length > 1 ? '[' + listaClases(v).join(', ') + ']' : q(listaClases(v)[0]))).join(', ') + '}';
    if (r.wwClases) {
      if (cl.length) cambios.push({ ini: r.wwClases[0], fin: r.wwClases[1], txt });
      else { const ini = t.lastIndexOf('\n', r.wwClases[0]), fin = t.indexOf('\n', r.wwClases[1]); cambios.push({ ini, fin: fin < 0 ? t.length : fin, txt: '' }); }
    } else if (cl.length && r.columnas) {
      const fin = t.indexOf('\n', r.columnas[1]);
      cambios.push({ ini: fin < 0 ? t.length : fin, fin: fin < 0 ? t.length : fin, txt: '\n  clases: ' + txt });
    }
  }
  if (m.ww.clase !== o.ww.clase) {   // V48e
    if (r.wwClase) {
      if (m.ww.clase) cambios.push({ ini: r.wwClase[0], fin: r.wwClase[1], txt: q(m.ww.clase) });
      else { const ini = t.lastIndexOf('\n', r.wwClase[0]), fin = t.indexOf('\n', r.wwClase[1]); cambios.push({ ini, fin: fin < 0 ? t.length : fin, txt: '' }); }
    } else if (m.ww.clase && r.columnas) {
      const fin = t.indexOf('\n', r.columnas[1]);
      cambios.push({ ini: fin < 0 ? t.length : fin, fin: fin < 0 ? t.length : fin, txt: '\n  clase: ' + q(m.ww.clase) });
    }
  }
  if (!igual(m.ww.ocultas, o.ww.ocultas)) {   // V41
    const hay = m.ww.ocultas.length, txt = '[' + m.ww.ocultas.join(', ') + ']';
    if (r.ocultas) {
      if (hay) cambios.push({ ini: r.ocultas[0], fin: r.ocultas[1], txt });
      else {
        const ini = t.lastIndexOf('\n', r.ocultas[0]), fin = t.indexOf('\n', r.ocultas[1]);
        cambios.push({ ini, fin: fin < 0 ? t.length : fin, txt: '' });
      }
    } else if (hay && r.columnas) {
      const fin = t.indexOf('\n', r.columnas[1]);
      cambios.push({ ini: fin < 0 ? t.length : fin, fin: fin < 0 ? t.length : fin, txt: '\n  ocultas: ' + txt });
    }
  }
  cambios.sort((a, b) => b.ini - a.ini);
  let s = t;
  for (const c of cambios) s = s.slice(0, c.ini) + c.txt + s.slice(c.fin);
  // V48e: clases de la TRN (se cambia solo el renglón de cada clase; los comentarios quedan)
  if (!igual(m.clases || {}, o.clases || {})) s = editarClasesEnTexto(s, difClases(o.clases || {}, m.clases || {}), /^campos:/m);
  return s;
}

// ------------------------------------------------------------------ validación (la del motor, en lo que toca el diseñador)
function validar(m) {
  const errores = [], avisos = [];
  const cab = new Map(m.campos.map(c => [c.vals.nombre, c]));
  const vistos = new Set(), detsPant = new Set();
  const detNombres = new Set(m.detalles.map(d => d.nombre));
  const recorrer = items => {
    for (const it of items) {
      if (it.items) recorrer(it.items);
      else if (it.t === 'detalle') {
        if (!detNombres.has(it.nombre)) errores.push('La pantalla usa el detalle ' + it.nombre + ', que no existe');
        if (detsPant.has(it.nombre)) errores.push('El detalle ' + it.nombre + ' está dos veces en la pantalla');
        detsPant.add(it.nombre);
      } else if (it.t === 'tabla') for (const f of it.filas) for (const c of f) {
        if (c.v) continue;
        if (!cab.has(c.c)) errores.push('La pantalla usa ' + c.c + ', que no es un campo de la cabecera');
        else if (vistos.has(c.c)) errores.push(c.c + ' está dos veces en la pantalla');
        vistos.add(c.c);
      }
    }
  };
  if (m.pantalla) recorrer(m.pantalla.items);
  const wv = new Set();
  for (const c of m.ww.columnas) {
    const f = cab.get(c.campo);
    if (!f) errores.push('WorkWith: ' + c.campo + ' no es un campo de la cabecera');
    else if (f.vals.formula && !f.vals.guardar) errores.push('WorkWith: ' + c.campo + ' es fórmula (no se puede mostrar)');
    if (wv.has(c.campo)) errores.push('WorkWith: ' + c.campo + ' está repetida');
    wv.add(c.campo);
  }
  for (const k of m.ww.ocultas) {   // V41
    const f = cab.get(k);
    if (!f) errores.push('WorkWith: oculta ' + k + ', que no es un campo de la cabecera');
    else if (f.vals.formula) errores.push('WorkWith: oculta ' + k + ' es fórmula');
    if (wv.has(k)) errores.push('WorkWith: ' + k + ' está en columnas y en ocultas');
  }
  for (const [k, v] of Object.entries(m.ww.anchos)) {
    if (!wv.has(k)) errores.push('WorkWith: ancho de ' + k + ', que no es una columna');
    if (!/^\d{1,4}(px|em|rem|ch|%)?$/.test(v)) errores.push('WorkWith: ancho inválido "' + v + '" en ' + k + ' (ej. 120px)');
  }
  if (m.pantalla) for (const c of m.campos) {
    const v = c.vals;
    if (!vistos.has(v.nombre) && !v.oculto && !v.clave && !v.formula && !v.inferido)
      avisos.push(v.nombre);
  }
  // V45: clases de campo que no existen (el motor no abriría la TRN)
  const cls = clasesDisponibles();
  // V49o: una clase que el archivo ya usaba no frena el guardado (con "Abrir archivo" puede no estar leído dominios.yaml)
  const yaUsadas = new Set();
  if (A && A.orig) for (const c of A.orig.campos.concat(...A.orig.detalles.map(d => d.campos))) for (const k of listaClases(c.vals.clase)) yaUsadas.add(k.toLowerCase());
  for (const c of m.campos.concat(...m.detalles.map(d => d.campos)))
    for (const k of listaClases(c.vals.clase))
      if (!buscarClase(cls, k) && !yaUsadas.has(k.toLowerCase())) errores.push(c.vals.nombre + ': la clase ' + k + ' no existe (se definen en dominios.yaml o en "clases:" de la TRN)');
  for (const [col, v] of Object.entries(limpiasWW(m)))   // V48e
    for (const k of listaClases(v)) if (!buscarClase(cls, k)) errores.push('WorkWith, columna ' + col + ': la clase ' + k + ' no existe');
  if (m.ww.clase && !/^ninguna$/i.test(m.ww.clase) && !buscarClase(cls, m.ww.clase)) errores.push('WorkWith: la clase ' + m.ww.clase + ' no existe');
  return { errores, avisos };
}

// ------------------------------------------------------------------ cambios con deshacer
function cambiar(fn) {
  if (Q) { cambiarQ(fn); return; }   // V66k4
  if (R) { cambiarR(fn); return; }   // V64
  if (P) { cambiarP(fn); return; }
  A.hist.push(JSON.stringify(A.m));
  if (A.hist.length > 200) A.hist.shift();
  A.fut = [];
  fn(A.m);
  pintar();
}
function deshacer() { if (Q) { if (Q.hist.length) { Q.fut.push(JSON.stringify(Q.m)); Q.m = JSON.parse(Q.hist.pop()); pintar(); } return; } if (R) { if (R.hist.length) { R.fut.push(JSON.stringify(R.m)); R.m = JSON.parse(R.hist.pop()); pintar(); } return; } if (P) { if (P.hist.length) { P.fut.push(JSON.stringify(P.m)); P.m = JSON.parse(P.hist.pop()); pintar(); } return; } if (!A || !A.hist.length) return; A.fut.push(JSON.stringify(A.m)); A.m = JSON.parse(A.hist.pop()); corregirSel(); pintar(); }
function rehacer() { if (Q) { if (Q.fut.length) { Q.hist.push(JSON.stringify(Q.m)); Q.m = JSON.parse(Q.fut.pop()); pintar(); } return; } if (R) { if (R.fut.length) { R.hist.push(JSON.stringify(R.m)); R.m = JSON.parse(R.fut.pop()); pintar(); } return; } if (P) { if (P.fut.length) { P.hist.push(JSON.stringify(P.m)); P.m = JSON.parse(P.fut.pop()); pintar(); } return; } if (!A || !A.fut.length) return; A.hist.push(JSON.stringify(A.m)); A.m = JSON.parse(A.fut.pop()); corregirSel(); pintar(); }
function corregirSel() { if (sel && sel.tipo !== 'campo' && sel.tipo !== 'trn' && sel.tipo !== 'wwcol') sel = null; }
const sucio = () => (A && !igual(A.m, A.orig)) || (P && !igual(P.m, P.orig)) || (R && !igual(R.m, R.orig)) || (Q && !igual(Q.m, Q.orig));   // V64: R, la impresión; V66k4: Q, la consulta

// ------------------------------------------------------------------ búsqueda en el modelo
function campo(nivel, nombre) {
  const lista = nivel === '#cab' ? A.m.campos : (A.m.detalles.find(d => d.nombre === nivel) || { campos: [] }).campos;
  return lista.find(c => c.vals.nombre === nombre);
}
function solapas() { return A.m.pantalla ? A.m.pantalla.items.filter(i => i.t === 'solapa') : []; }
/** contenedores de la pantalla con su ruta: [{cont (lista items), ruta}] */
function todasLasTablas() {
  const r = [];
  const rec = (items, ruta) => items.forEach((it, i) => {
    if (it.items) rec(it.items, ruta.concat(i));
    else if (it.t === 'tabla') r.push({ tabla: it, ruta: ruta.concat(i) });
  });
  if (A.m.pantalla) rec(A.m.pantalla.items, []);
  return r;
}
function porRuta(ruta) { let items = A.m.pantalla.items, it = null; for (const i of ruta) { it = items[i]; items = it && it.items; } return it; }
function contenedorDe(ruta) { return ruta.length === 1 ? A.m.pantalla.items : porRuta(ruta.slice(0, -1)).items; }
function ubicar(nombre) {
  for (const { tabla, ruta } of todasLasTablas())
    for (let f = 0; f < tabla.filas.length; f++)
      for (let c = 0; c < tabla.filas[f].length; c++)
        if (tabla.filas[f][c].c === nombre) return { ruta, f, c };
  return null;
}
function anchoTabla(t) { return Math.max(1, ...t.filas.map(f => f.reduce((s, c) => s + (c.n || 1), 0))); }

// ------------------------------------------------------------------ operaciones de arrastre
function celdaEn(loc) { return porRuta(loc.ruta).filas[loc.f][loc.c]; }
function ponerCelda(loc, v) { porRuta(loc.ruta).filas[loc.f][loc.c] = v; }

function moverCampoA(nombre, destino) {       // destino: {ruta,f,c}
  cambiar(() => {
    const origen = ubicar(nombre);
    const aca = celdaEn(destino);
    const nueva = origen ? celdaEn(origen) : { c: nombre, n: 1 };
    if (origen && origen.ruta.join() === destino.ruta.join() && origen.f === destino.f && origen.c === destino.c) return;
    if (origen) ponerCelda(origen, aca.v ? { v: 1 } : aca);   // intercambio (o deja el hueco)
    ponerCelda(destino, nueva);
    if (origen && (origen.ruta.join() !== destino.ruta.join() || origen.f !== destino.f)) sacarSiQuedoVacio(origen);
  });
}
function agregarRenglon(ruta, nombre) {
  cambiar(() => {
    const t = porRuta(ruta);
    const n = anchoTabla(t);
    let celda = { v: 1 };
    let o = null;
    if (nombre) { o = ubicar(nombre); if (o) { celda = celdaEn(o); ponerCelda(o, { v: 1 }); } else celda = { c: nombre, n: 1 }; }
    const fila = [celda];
    while (fila.reduce((s, c) => s + (c.n || 1), 0) < n) fila.push({ v: 1 });
    t.filas.push(fila);
    if (o) sacarSiQuedoVacio(o);
  });
}
function agregarColumna(ruta) { cambiar(() => { porRuta(ruta).filas.forEach(f => f.push({ v: 1 })); }); }
function quitarDePantalla(nombre) {
  const o = ubicar(nombre);
  if (!o) return;
  cambiar(() => { ponerCelda(o, { v: 1 }); sacarSiQuedoVacio(o); });
}
function alSolapa(idxSolapa, nombre) {
  cambiar(m => {
    const so = solapas()[idxSolapa];
    let t = so.items.find(i => i.t === 'tabla');
    if (!t) { t = { t: 'tabla', filas: [], titulo: '', anchos: '', etiquetas: '', anchoEtiquetas: '', alinear: '' }; so.items.unshift(t); }
    const o = ubicar(nombre);
    let celda = { c: nombre, n: 1 };
    if (o) { celda = celdaEn(o); ponerCelda(o, { v: 1 }); }
    const fila = [celda];
    while (fila.reduce((s, c) => s + (c.n || 1), 0) < anchoTabla(t)) fila.push({ v: 1 });
    t.filas.push(fila);
    if (o) sacarSiQuedoVacio(o);
  });
}
/** si al sacar un campo su renglón quedó todo vacío, el renglón se va (no deja huecos al mover) */
function sacarSiQuedoVacio(loc) {
  const t = porRuta(loc.ruta);
  if (t && t.filas[loc.f] && t.filas[loc.f].every(c => c.v) && t.filas.length > 1) t.filas.splice(loc.f, 1);
}
function limpiarVacios(t) {  // saca renglones totalmente vacíos
  t.filas = t.filas.filter(f => f.some(c => !c.v));
}
/** V64c: achica la tabla: saca los lugares vacíos del final de cada renglón y los renglones vacíos. La tabla queda con tantas
    columnas como su renglón más largo (antes, un renglón con muchos vacíos estiraba todas las columnas, también en OPTIMIST). */
function achicarTabla(t) {
  for (const f of t.filas) while (f.length > 1 && f[f.length - 1].v) f.pop();
  limpiarVacios(t);
  if (!t.filas.length) t.filas.push([{ v: 1 }]);
}

// ------------------------------------------------------------------ arrastrar y soltar
let arrastre = null;   // {tipo:'campo', nombre} | {tipo:'detalle', ruta} | {tipo:'solapa', idx} | {tipo:'wwcol', idx}
function arrastrable(el, dato) {
  el.draggable = true;
  // V49o: gana lo de más adentro (la columna dentro del bloque del detalle, que también se arrastra)
  el.addEventListener('dragstart', e => { e.stopPropagation(); arrastre = dato; e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', JSON.stringify(dato)); });
  el.addEventListener('dragend', () => { arrastre = null; document.querySelectorAll('.drop').forEach(x => x.classList.remove('drop')); });

// ------------------------------------------------------------------ V48e: escribir clases en un YAML (solo el renglón de cada clase)
function flowClase(est) {
  const e = normalEst(est), orden = ['negrita', 'italica', 'letra', 'tamaño', 'color'], partes = [];
  const val = (k, x) => typeof x === 'boolean' || typeof x === 'number' && k !== 'tamaño' ? String(x) : (k === 'tamaño' || k === 'color') ? '"' + String(x).replace(/"/g, '\\"') + '"' : q(x);
  for (const k of orden.concat(Object.keys(e).filter(k => !orden.includes(k)))) if (e[k] != null && e[k] !== '') partes.push(k + ': ' + val(k, e[k]));
  return '{' + partes.join(', ') + '}';
}
/** {nombre: est | null} entre dos juegos de clases (null = se borra). Primero los borrados (por si se renombró). */
function difClases(o, m) {
  const r = {};
  for (const k of Object.keys(o)) if (!(k in m)) r[k] = null;
  for (const k of Object.keys(m)) if (!(k in o) || !igual(o[k], m[k])) r[k] = m[k];
  return r;
}
/** Aplica los cambios al bloque "clases:" del texto: cambia, agrega o borra el renglón de cada clase; el resto queda igual. */
function editarClasesEnTexto(texto, cambios, ancla) {
  const L = texto.split('\n');
  const ind = l => l.match(/^\s*/)[0].length;
  const esc = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  let i = L.findIndex(l => /^clases:\s*(#.*)?$/.test(l));
  const enLinea = L.findIndex(l => /^clases:\s*\{/.test(l));
  if (i < 0 && enLinea >= 0) {   // clases: {A: {...}} en un renglón: se pasa a bloque
    let viejas = {}; try { viejas = (YAML.parse(L[enLinea]) || {}).clases || {}; } catch {}
    L.splice(enLinea, 1, 'clases:', ...Object.entries(viejas).map(([k, v]) => '  ' + q(k) + ': ' + flowClase(v)));
    i = enLinea;
  }
  const entradas = Object.entries(cambios);
  if (i < 0) {
    const nuevas = entradas.filter(([, v]) => v).map(([k, v]) => '  ' + q(k) + ': ' + flowClase(v));
    if (!nuevas.length) return texto;
    const a = ancla ? L.findIndex(l => ancla.test(l)) : -1;
    if (a >= 0) L.splice(a, 0, 'clases:', ...nuevas, '');
    else { while (L.length && L[L.length - 1].trim() === '') L.pop(); L.push('', 'clases:', ...nuevas, ''); }
    return L.join('\n');
  }
  const finBloque = () => { let j = i + 1; while (j < L.length && (L[j].trim() === '' || /^\s/.test(L[j]))) j++; while (j > i + 1 && L[j - 1].trim() === '') j--; return j; };
  const primera = L.slice(i + 1, finBloque()).find(l => l.trim() && !l.trim().startsWith('#'));
  const sangria = primera ? primera.match(/^\s*/)[0] : '  ';
  for (const [k, v] of entradas) {
    const j = finBloque();
    const re = new RegExp('^\\s+["\']?' + esc(k) + '["\']?\\s*:', 'i');
    const p = L.slice(i + 1, j).findIndex(l => re.test(l));
    if (p >= 0) {
      const ini = i + 1 + p;
      let fin = ini + 1;
      while (fin < j && (L[fin].trim() === '' || ind(L[fin]) > ind(L[ini]))) fin++;
      while (fin > ini + 1 && L[fin - 1].trim() === '') fin--;
      if (v) L.splice(ini, fin - ini, sangria + q(k) + ': ' + flowClase(v)); else L.splice(ini, fin - ini);
    } else if (v) L.splice(j, 0, sangria + q(k) + ': ' + flowClase(v));
  }
  if (!L.slice(i + 1, finBloque()).some(l => l.trim())) L.splice(i, 1);   // bloque vacío: se saca "clases:"
  return L.join('\n');
}

/** Graba cambios de clases en dominios.yaml: relee el archivo, cambia solo esos renglones, controla que el YAML quede sano. */
async function grabarDominios(cambios) {
  try {
    if (!DOM_HANDLE) DOM_HANDLE = await leerGuardado('dominios');
    if (!DOM_HANDLE) {
      if (!window.showOpenFilePicker) { aviso('Abrí la carpeta del proyecto (📂) para poder grabar en dominios.yaml.', true); return false; }
      aviso('Elegí el archivo dominios.yaml (src/main/resources)');
      const [fh] = await showOpenFilePicker({ id: 'optimist-dominios', types: [{ description: 'dominios.yaml', accept: { 'text/yaml': ['.yaml', '.yml'] } }] });
      if (!/^dominios\.ya?ml$/i.test(fh.name)) { aviso('Ese archivo no es dominios.yaml', true); return false; }
      DOM_HANDLE = fh; guardarClave('dominios', fh);
    }
    if (DOM_HANDLE.queryPermission && await DOM_HANDLE.queryPermission({ mode: 'readwrite' }) !== 'granted'
        && await DOM_HANDLE.requestPermission({ mode: 'readwrite' }) !== 'granted') { aviso('Sin permiso para grabar dominios.yaml', true); return false; }
    const viejo = await (await DOM_HANDLE.getFile()).text();
    const nuevo = editarClasesEnTexto(viejo, cambios, /^dominios:/m);
    const js = YAML.parse(nuevo) || {};
    const cl = (js.clases && typeof js.clases === 'object') ? js.clases : {};
    for (const [k, v] of Object.entries(cambios)) {
      const hay = Object.keys(cl).find(x => x.toLowerCase() === k.toLowerCase());
      if (v ? !hay || !igual(normalEst(cl[hay]), normalEst(v)) : !!hay) throw new Error('el archivo generado no quedó bien (clase ' + k + ')');
    }
    if (!DOM_BAK && DOM_DIR) {   // copia del original, una vez por sesión
      const b = await DOM_DIR.getFileHandle('dominios.yaml.bak', { create: true });
      const wb = await b.createWritable(); await wb.write(viejo); await wb.close(); DOM_BAK = true;
    }
    const w = await DOM_HANDLE.createWritable(); await w.write(nuevo); await w.close();
    DOM_GLOBALES.clases = cl;
    try { localStorage.setItem('optimist-dominios', JSON.stringify(DOM_GLOBALES)); } catch {}
    return true;
  } catch (e) {
    if (e && e.name === 'AbortError') return false;
    aviso('No se pudo grabar dominios.yaml: ' + e.message, true);
    return false;
  }
}

// ------------------------------------------------------------------ órdenes (dictadas o escritas)
const plano = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]/g, '');

/** campos mencionados en la orden: por nombre (AlmacenesDescrip = "almacenes descrip") o por etiqueta si no hay dudas */
function camposMencionados(txt) {
  const p = plano(txt), usados = [], res = [];
  const todos = A.m.campos.map(c => ({ c, nivel: '#cab' })).concat(...A.m.detalles.map(d => d.campos.map(c => ({ c, nivel: d.nombre }))));
  const libre = (i, n) => usados.every(([a, b]) => i + n <= a || i >= b);
  const buscar = (clave, lista) => {
    for (const x of lista.sort((a, b) => clave(b).length - clave(a).length)) {

function interpretar(txt) {

  if (/\b(deshace|deshacer|deshaceme)\b/.test(t)) { deshacer(); return 'Deshecho'; }
  if (/\b(rehace|rehacer)\b/.test(t)) { rehacer(); return 'Rehecho'; }
  if (/\b(guarda|guardar|graba|grabar)\b/.test(t)) { guardar(); return 'Guardando…'; }
  let campos = camposMencionados(txt);
  if (!campos.length && sel && sel.tipo === 'campo') campos = [{ c: campo(sel.nivel, sel.nombre), nivel: sel.nivel }];
  if (!campos.length) return 'No encontré el campo en «' + txt.trim() + '». Decí su nombre (ej: AlmacenesDescrip) o elegilo antes.';
  const no = /\b(saca|sacale|quita|quitale|sin|no)\b/.test(t);
  const hechos = [];

    if (/negrita/.test(t)) { est('negrita', !no); hechos.push(no ? 'sin negrita' : 'en negrita'); }
    if (/(italica|cursiva)/.test(t)) { est('italica', !no); hechos.push(no ? 'sin itálica' : 'en itálica'); }
    if (/(ocult|escond|invisible)/.test(t)) { fijar('oculto', true); hechos.push('oculto'); }
    else if (/(mostra|visible|que se vea)/.test(t)) { fijar('oculto', false); hechos.push('visible'); }
    if (/solo lectura|no editable|que no se pueda (editar|modificar)/.test(t)) { fijar('soloLectura', !(/\b(saca|quita|sin)\b/.test(t))); hechos.push(/\b(saca|quita|sin)\b/.test(t) ? 'editable' : 'solo lectura'); }
    else if (/\beditable\b/.test(t)) { fijar('soloLectura', false); hechos.push('editable'); }

    if ((m = t.match(/\b(rojo|azul|verde|naranja|negro|gris|violeta|amarillo|celeste|bordo|marron)\b/))) { est('color', COLORES[m[1]]); hechos.push('color ' + m[1]); }
    else if (/sin color|color normal/.test(t)) { est('color', ''); hechos.push('sin color'); }
    // V46: "letra +4", "tamaño -2", "letra 125%" -> relativo a la letra del usuario; "letra 20" -> fijo
    if ((m = t.match(/(tamano|letra|tamanio)[^\d+-]{0,12}([+-]?)\s*(\d{1,3})\s*(%?)/))) {

    else if (/ancho (normal|automatico)/.test(t)) { fijar('ancho', ''); hechos.push('ancho automático'); }
    if ((m = t.match(/(\d{1,2}) renglones/))) { fijar('renglones', +m[1]); hechos.push(m[1] + ' renglones'); }

}
function ejecutarOrden(txt) { if (!txt || !txt.trim()) return; const r = interpretar(txt); aviso(r, !r.startsWith('✓') && !/^(Deshecho|Rehecho|Guardando)/.test(r)); $('#pieInfo').textContent = '«' + txt.trim() + '» → ' + r; }
